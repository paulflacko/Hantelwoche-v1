<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hantelwoche"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Hantelwoche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f3d6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: ein Spaltenfluss wie ein Trainingsbuch; Tab-Leiste unten am Handy, links ab 900px. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e3e8e6; --line:#cfd7d4;
  --fg:#16201d; --muted:#5a6863; --accent:#1f4f9a; --accent-ink:#ffffff;
  --amber:#b86e00; --good:#1f7a4d; --warn:#a4501d; --plate:#c23b2a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201e; --surface-2:#212b29; --line:#2d3936;
  --fg:#e6ecea; --muted:#9aa8a4; --accent:#7fa8ef; --accent-ink:#0b1426;
  --amber:#f0a94a; --good:#5fca93; --warn:#e8935f; --plate:#f07b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --surface-2:#212b29; --line:#2d3936;
  --fg:#e6ecea; --muted:#9aa8a4; --accent:#7fa8ef; --accent-ink:#0b1426;
  --amber:#f0a94a; --good:#5fca93; --warn:#e8935f; --plate:#f07b6b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.sync{margin-left:auto;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(8,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;min-width:0;color:var(--muted);cursor:pointer;font-weight:600}
@media (max-width:430px){nav.tabs button{font-size:.6rem}} @media (max-width:380px){nav.tabs button{font-size:.55rem} nav.tabs svg{width:20px;height:20px}}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}
  .top{grid-column:1/-1}
  nav.tabs{position:sticky;top:60px;align-self:start;display:flex;flex-direction:column;border:0;background:none;padding:16px 0 0 max(16px,env(safe-area-inset-left,0px));gap:4px}
  nav.tabs button{flex-direction:row;gap:10px;font-size:1rem;padding:10px 12px;border-radius:8px;justify-content:flex-start}
  nav.tabs button[aria-current="page"]{background:var(--surface)}
  main{padding-bottom:48px}
}

.section{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.good{color:var(--good)} .pill.amber{color:var(--amber)} .pill.accent{color:var(--accent)}

/* Start: Übersicht */
.hhero{display:flex;gap:14px;align-items:center}
.hhero .date{font-family:var(--display);font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hhero h1{font-size:2.3rem;margin:2px 0}
.hday-ring{border:0;background:none;padding:0;cursor:pointer;flex:none;width:84px;align-self:flex-start;margin-top:8px}
.hring .fg.zero{opacity:0}
.hring{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;text-align:center;min-width:0}
.hring svg{width:64px;height:64px;transform:rotate(-90deg)}
.hring .bg{fill:none;stroke:var(--surface-2);stroke-width:7}
.hring .fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .5s}
.hring.amb .fg{stroke:var(--amber)} .hring.calm .fg{stroke:var(--good)} .hring.full .fg{stroke:var(--good)}
.hring .rv{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;gap:1px;font-size:1.25rem;font-weight:700;line-height:1}
.hring .rv small{font-size:.75rem;color:var(--muted);font-weight:600}
.hring .rl{font-weight:600;font-size:.85rem}
.hring .rs{font-size:.72rem;color:var(--muted)}
.hring.cnt .big{height:64px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:700;line-height:1;color:var(--accent)}
.hring.cnt .big small{font-size:1rem;color:var(--muted)}
.hday-ring .hring svg{width:76px;height:76px} .hday-ring .hring .rv{height:76px}
.hnext{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--line)}
.hnext.main{border-left-color:var(--accent)} .hnext.done{border-left-color:var(--good)}
.hnext h2{font-size:1.6rem}
.hnext .hact{margin-top:8px}
.hnext .hact .actcol{padding-left:0;flex-wrap:wrap}
.hnext .hact .actcol .btn{white-space:normal;justify-content:center}
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px 8px}
.hday{border:0;background:none;padding:6px 0;border-radius:8px;display:grid;justify-items:center;gap:4px;cursor:pointer;min-width:0;color:var(--fg)}
.hday.today{background:var(--surface-2)}
.hday .dn{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted)}
.hday.today .dn{color:var(--accent)}
.hday .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.hday .dot.kraft{border-color:var(--accent)} .hday .dot.zirkel{border-color:var(--amber)}
.hday.part .dot{background:color-mix(in srgb,var(--good) 22%,transparent)}
.hday.full .dot{background:var(--good);border-color:var(--good);color:#fff}
.hday.miss .dot{opacity:.55}
.hday .dt{font-size:.66rem;color:var(--muted);line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hrings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 8px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.htile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;min-width:0;color:var(--fg)}
.htile .hi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:6px}
.htile .hi svg{width:22px;height:22px}
.htile b{font-family:var(--display);font-size:1.1rem}
.htile small{color:var(--muted);font-size:.78rem;line-height:1.25}
.htile.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.htile.acc .hi{background:rgba(255,255,255,.18);color:inherit}
.htile.acc small{color:inherit;opacity:.85}
.htile:active,.hstat:active,.hday:active{transform:scale(.98)}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hstat{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.hstat .v{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1}
.hstat .v small{font-size:.95rem;color:var(--muted);font-weight:600}
.spark{width:96px;height:32px;flex:none}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.hlinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.hlinks .btn{justify-content:flex-start}
.hlinks .btn svg{width:20px;height:20px;color:var(--accent);flex:none}

/* Heute: Zeitleiste */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .date{font-family:var(--display);font-size:1.05rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch}
.tl .t{font-family:var(--display);font-weight:600;font-size:1.05rem;padding-top:14px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .c{border-left:2px solid var(--line);padding:8px 0 8px 14px;position:relative;min-width:0}
.tl .c::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl.done .c::before{background:var(--good);border-color:var(--good)}
.tl.main .c::before{border-color:var(--accent)}
.tl .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tl.main .box{border-color:var(--accent)}
.zone-pill{color:var(--fg);background:var(--surface-2);gap:6px}.zone-pill i{width:9px;height:9px;border-radius:50%;background:#ff5436;box-shadow:0 0 6px #ff5436}
.actcol{display:flex;gap:8px;flex-basis:100%;padding-left:36px}
.actcol .btn{flex:1;white-space:nowrap}
.mobwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:520px){.mobwrap{grid-template-columns:120px 1fr;gap:12px}}
.body svg{width:100%;height:auto;display:block}
.body .zone{cursor:pointer;fill:var(--accent);stroke:var(--accent);stroke-width:1.5;transition:fill-opacity .15s}
.body .zone[data-lv="0"]{fill-opacity:.06;stroke-opacity:.6;stroke-dasharray:3 3}
.body .zone[data-lv="1"]{fill-opacity:.35;stroke-opacity:.9}
.body .zone[data-lv="2"]{fill-opacity:.8;stroke-opacity:1}
.body .sil{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.chip .lv{font-weight:700;margin-left:4px;opacity:.85}
.mobprev .li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mobprev img{width:72px;height:48px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.mobprev .li:last-child{border-bottom:0}
.check{appearance:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;margin:0}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li label{flex:1;min-width:0;cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .v small{font-size:1rem;color:var(--muted);font-weight:600}

/* Woche */
.week{display:flex;flex-direction:column;gap:8px}
.wd{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.wd.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wd .d{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1}
.wd .d small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.plates{display:flex;gap:3px;align-items:center}
.plates i{width:7px;height:22px;border-radius:2px;background:var(--surface-2)}
.plates i.on{background:var(--plate)}

/* Übungen */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ex .img{background:#fff;aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.ex .img img{width:100%;height:100%;object-fit:contain}
.ex .img.none{background:var(--surface-2);color:var(--muted);font-size:.85rem;text-align:center;padding:12px}
.ex .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"],.chip.ntday:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Bibliothek und Workout-Editor */
.search{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:11px 12px;font:inherit;color:var(--fg);width:100%}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.lib{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lr{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.th{flex:none;width:64px;height:48px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:contain}
.th.none{background:var(--surface-2);color:var(--muted)}
.th svg{width:24px;height:24px}
.lr .nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lrx{padding:0 12px 12px 88px;display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.lrx{padding-left:12px}}
.lrx img{width:100%;max-width:360px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl.hid{opacity:.6}
.tli{margin:0;padding:0;list-style:none;font-size:.875rem;display:flex;flex-direction:column;gap:3px}
.tli .gnum{font-size:.95rem}
.tpl .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tedrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.tedrow.ss{border-left:4px solid var(--accent)}
.tedhead{display:flex;gap:8px;align-items:center}
.tedhead .iconbtn{width:34px;height:34px;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.tedctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tedctl input{width:100%}
.mini{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.mini input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.field select{appearance:auto}

/* Overlay (Training, Timer) */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ov-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.ov-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 140px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.excard.done{border-color:var(--good)}
.excard .top2{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px}
@media (max-width:420px){.excard .top2{grid-template-columns:96px 1fr}}
.excard .thumb{background:#fff;border-radius:8px;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;max-width:100%}
.excard .thumb img{width:100%;height:100%;object-fit:contain}
.excard .thumb.none{background:var(--surface-2);color:var(--muted);font-size:.7rem;text-align:center;padding:6px}
.gnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.1rem;margin-right:6px}
.hint{font-size:.85rem;padding:8px 12px;background:var(--surface-2);border-radius:8px}
.tips{background:var(--surface-2);border-radius:10px;padding:0;text-align:left;width:100%;max-width:560px}
.tips summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:.9rem;list-style-position:inside}
.tips .tipbody{padding:0 14px 12px;font-size:.88rem;line-height:1.45}
.tips h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.tips ol,.tips ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tips ul.warn li::marker{color:var(--warn)}
.tips p{margin:0}

  seiza:{a:['Knie zusammen, Po sinkt auf die Fersen. Ist es zu steil: Kissen zwischen Po und Fersen.','Sitzbeinhöcker schwer, Scheitel wächst zur Decke.','Kinn minimal einziehen, Nacken lang.','Schultern sinken, Hände liegen locker auf den Oberschenkeln.'],

  sun:{a:['Berghaltung: Füße hüftbreit, Gewicht gleichmäßig, Arme mit dem Einatmen nach oben.','Vorbeuge aus der Hüfte, Knie dürfen gebeugt sein, Rücken möglichst lang.','Halbe Vorbeuge: Hände an die Schienbeine, Rücken flach, Blick nach vorn.','Brett: Schultern über den Handgelenken, Körper eine Linie, dann kontrolliert absenken.','Heraufschauender Hund: Hüfte tief, Brust nach vorn oben, Schultern weg von den Ohren.','Herabschauender Hund: Hüfte nach hinten oben, 3 Atemzüge, dann nach vorn kommen.'],

  pigeon:{a:['Vorderes Schienbein möglichst quer, je steifer die Hüfte, desto näher die Ferse zur Leiste.','Vorderen Fuß aktiv anziehen, das schützt das Knie.','Hinteres Bein lang nach hinten, Zehen zeigen gerade nach unten.','Becken gerade ausrichten: Kissen unter die Po-Seite des vorderen Beins, wenn sie schwebt.','Erst aufrecht, dann mit langem Rücken auf Unterarme oder Stirn ablegen.'],
    f:['Becken kippt zur Seite des vorderen Beins.','Schmerz im vorderen Knie: Fuß näher zur Hüfte oder Figur-4 im Liegen nehmen.'],b:'Tief in den Bauch, mit jedem Ausatmen etwas weiter sinken.',s:'Ziehen tief im Po und an der Hüftaußenseite des vorderen Beins.'},
  pyramid:{a:['Schrittstellung etwa ein Bein lang, beide Füße flach, hinterer Fuß ca. 45° gedreht.','Beide Hüftknochen zeigen nach vorn wie Scheinwerfer.','Beine gestreckt, aber Knie nicht durchdrücken.','Aus der Hüfte mit langem Rücken nach vorn kippen, Hände auf Blöcke oder Schienbein.','Erst wenn der Rücken lang bleibt, darf der Oberkörper weiter sinken.'],
    f:['Rücken rund ziehen, um tiefer zu kommen.','Hüfte des hinteren Beins dreht auf.'],b:'Einatmen: Rücken lang. Ausatmen: aus der Hüfte etwas tiefer.',s:'Dehnung in der Beinrückseite des vorderen Beins.'},
  frog:{a:['Vierfüßlerstand, Knie weit auseinander auf weicher Unterlage.','Unterschenkel parallel, Sprunggelenke auf Höhe der Knie, Füße zeigen nach außen.','Auf die Unterarme gehen, Rücken neutral, Bauch leicht aktiv.','Hüfte langsam nach hinten schieben, bis es innen zieht, dann halten.'],
    f:['Rücken hängt ins Hohlkreuz durch.','Zu weit auf einmal: Knie und Leiste reagieren empfindlich.'],b:'Ruhig weiteratmen, beim Ausatmen Hüfte minimal nach hinten.',s:'Innenseite der Oberschenkel bis zur Leiste.'},
  twist:{a:['Auf dem Rücken, Arme in T-Form, Handflächen nach oben.','Knie angewinkelt zusammen, langsam zu einer Seite sinken lassen.','Beide Schulterblätter bleiben am Boden, sonst Knie auf ein Kissen.','Kopf dreht optional zur Gegenseite.'],
    f:['Die obere Schulter hebt ab.','Die Knie mit Kraft nach unten drücken.'],b:'In die oben liegende Flanke und Brust atmen. Jedes Ausatmen lässt die Knie schwerer werden.',s:'Sanfte Drehung in der Wirbelsäule, Dehnung an Po und Brust.'},
  baby:{a:['Auf dem Rücken, Knie Richtung Achseln ziehen.','Füße von außen greifen, Fußsohlen zeigen zur Decke.','Schienbeine senkrecht, Knie weiter als die Hüfte.','Kreuzbein und Hinterkopf bleiben am Boden, sanft seitlich schaukeln.'],
    f:['Kopf und Schultern heben ab. Dann lieber die Kniekehlen greifen.','Steißbein rollt hoch.'],b:'Langsam in den Bauch und unteren Rücken atmen.',s:'Öffnung in Hüfte und Leiste, Entspannung im unteren Rücken.'},
  sava:{a:['Auf dem Rücken, Beine etwas breiter als die Hüfte, Füße fallen locker nach außen.','Arme etwas vom Körper weg, Handflächen nach oben.','Kinn leicht zur Brust, Nacken lang. Bei Bedarf Kissen unter die Knie.','Augen schließen, Gesicht weich, Kiefer lösen.'],
    f:['Gedanklich schon beim nächsten Termin sein: den Atem einfach beobachten.'],b:'Nichts steuern. Atem kommen und gehen lassen.',s:'Schwere, Wärme, ruhiger Puls.'},
  child:{a:['Knie hüftbreit oder weiter, große Zehen berühren sich.','Po sinkt Richtung Fersen, Stirn liegt auf dem Boden oder einem Kissen.','Arme lang nach vorn oder locker neben dem Körper.','Schultern lösen und schwer werden lassen.'],
    f:['Druck auf die Knie aushalten: Kissen zwischen Po und Fersen.','Nacken verdrehen statt die Stirn abzulegen.'],b:'In den Rücken und die Flanken atmen, der Rücken hebt sich beim Einatmen.',s:'Sanfte Dehnung im ganzen Rücken, Entspannung.'},
  tspine:{a:['Vierfüßlerstand, Hüfte bleibt über den Knien, die Stützhand unter der Schulter.','Freie Hand an den Hinterkopf, Ellbogen zeigt zur Seite.','Ellbogen unter dem Körper Richtung Stützarm führen.','Dann den Ellbogen weit zur Decke aufdrehen, Blick folgt.','Die Drehung kommt aus dem Brustkorb, nicht aus der Lendenwirbelsäule.'],
    f:['Hüfte schiebt zur Seite oder nach hinten.','Den Kopf in den Nacken reißen.'],b:'Einatmen beim Aufdrehen, ausatmen beim Einrollen.',s:'Bewegung zwischen den Schulterblättern.'},
  chest:{a:['Unterarm an den Türrahmen, Ellbogen etwa auf Schulterhöhe.','Schulter bleibt tief und hinten, nicht zum Ohr ziehen.','Mit dem Körper einen kleinen Schritt nach vorn und leicht vom Arm wegdrehen.','Bauch fest, kein Hohlkreuz.','Ellbogen höher = obere Brust, tiefer = mittlere Brust.'],
    f:['Schulter rollt nach vorn und zieht vorne im Gelenk.','Zu stark gedreht, sodass Kribbeln im Arm entsteht: dann lockerer.'],b:'Ruhig weiteratmen, mit dem Ausatmen etwas weiter drehen.',s:'Ziehen in Brust und vorderer Schulter, nicht im Gelenk.'},
  neck:{a:['Aufrecht sitzen oder stehen, Scheitel lang nach oben.','Ohr langsam Richtung Schulter sinken lassen, Nase zeigt nach vorn.','Die Gegenschulter aktiv nach unten schieben, Hand ggf. unter den Po klemmen.','Für mehr Dehnung den Kopf leicht nach vorn unten drehen (Nase zur Achsel).'],
    f:['Die Schulter zum Ohr hochziehen.','Mit der Hand am Kopf ziehen.'],b:'Ins Ziehen hineinatmen, beim Ausatmen sinkt der Kopf von allein.',s:'Seitlich am Hals bis in die obere Schulter.'},
  shroll:{a:['Aufrecht, Arme hängen locker.','Schultern hoch zu den Ohren, dann weit nach hinten.','Schulterblätter nach unten in die Gesäßtaschen ziehen.','Große, langsame Kreise, der Kopf bleibt ruhig.'],
    f:['Kleine, hastige Kreise.','Den Kopf mitbewegen.'],b:'Einatmen beim Hochziehen, ausatmen beim Absenken.',s:'Lockerheit in Nacken und Schultern.'},
  calfst:{a:['Hände an die Wand, hinteres Bein gestreckt, Ferse fest am Boden.','Fuß zeigt gerade nach vorn.','Hüfte nach vorn zur Wand schieben, Körper bleibt eine Linie.','Danach das hintere Knie leicht beugen, so dehnt sich die tiefe Wadenmuskulatur.'],
    f:['Fuß dreht nach außen.','Ferse hebt ab.'],b:'Gleichmäßig atmen, beim Ausatmen etwas weiter zur Wand.',s:'Ziehen in der Wade bis zur Achillessehne.'},
  pullapart:{a:['Band auf Brusthöhe, Hände schulterbreit, Arme fast gestreckt.','Schultern tief und von den Ohren weg.','Band auseinanderziehen, bis es die Brust berührt, Schulterblätter zusammen.','Langsam zurück, 2 s für den Rückweg.'],
    f:['Ins Hohlkreuz ausweichen.','Ellbogen stark beugen und mit dem Bizeps ziehen.'],b:'Ausatmen beim Auseinanderziehen.',s:'Arbeit zwischen den Schulterblättern und hinten an der Schulter.'},
  bridge:{a:['Rückenlage, Füße hüftbreit, Fersen etwa eine Handbreit vor dem Po.','Becken leicht einrollen, unterer Rücken nah am Boden.','Durch die Fersen drücken und die Hüfte heben, bis Knie, Hüfte und Schulter eine Linie bilden.','Oben den Po fest anspannen, Rippen bleiben unten.','Knie zeigen nach vorn und fallen nicht zusammen.'],
    f:['Oben ins Hohlkreuz drücken.','Aus den Zehen statt aus den Fersen drücken.'],b:'Ausatmen beim Hochheben, einatmen beim Absenken.',s:'Arbeit im Po, nicht im unteren Rücken.'},
  birddog:{a:['Vierfüßlerstand, Rücken flach wie ein Tisch.','Bauch fest, als käme gleich ein leichter Stoß.','Gegenarm und -bein langsam strecken, bis sie mit dem Rücken eine Linie bilden.','Becken bleibt waagerecht, die Hüfte dreht nicht auf.','2 s halten, kontrolliert zurück.'],
    f:['Bein zu hoch, dann folgt das Hohlkreuz.','Gewicht kippt zur Seite.'],b:'Ausatmen beim Strecken, einatmen beim Zurückkommen.',s:'Rumpfspannung, Po und Rückenstrecker arbeiten.'},
  deadbug:{a:['Rückenlage, Arme zur Decke, Knie und Hüfte 90°.','Unterer Rücken drückt sanft in den Boden.','Gegenarm und -bein langsam strecken, knapp über dem Boden stoppen.','Zurück zur Mitte, dann Seite wechseln.'],
    f:['Der untere Rücken hebt ab.','Zu schnell und mit Schwung.'],b:'Lang ausatmen, während du streckst.',s:'Tiefe Bauchspannung.'},
  plank:{a:['Ellbogen unter den Schultern, Unterarme parallel.','Körper eine Linie von Kopf bis Ferse.','Po anspannen und Becken leicht einrollen.','Ellbogen gedanklich zu den Zehen ziehen, Bauch wird fester.','Blick zum Boden, Nacken lang.'],
    f:['Po hoch oder Hüfte hängt durch.','Schultern sinken zwischen die Schulterblätter.'],b:'Kurz und ruhig weiteratmen, nicht pressen.',s:'Bauch und Po arbeiten, nicht der untere Rücken.'},
  jj:{a:['Leicht auf den Fußballen landen.','Knie bleiben weich und zeigen in Richtung der Zehen.','Arme locker über den Kopf.'],f:['Mit gestreckten Knien landen.'],b:'Gleichmäßig weiteratmen.',s:'Puls steigt, Körper wird warm.'},
  hollow:{a:['Rückenlage, unterer Rücken drückt fest in den Boden.','Schultern und Beine knapp vom Boden heben.','Arme lang neben die Ohren oder zu den Hüften (leichter).','Bananenform: Rippen zum Becken ziehen.'],
    f:['Hohlkreuz: dann Beine höher oder Knie beugen.'],b:'Kurze, flache Atemzüge, Spannung halten.',s:'Ganzer Bauch brennt.'},

  // ---------- Kraftübungen aus dem Plan ----------
  deadlift:{a:['Füße hüftbreit, Stange über der Fußmitte, etwa 3 cm vor dem Schienbein.','Griff knapp außerhalb der Beine, Arme senkrecht.','Schienbeine an die Stange, Brust hoch, Rücken neutral.','Lat anspannen: Achseln zu den Hosentaschen.','Boden wegdrücken, Stange bleibt am Bein, oben Hüfte strecken und Po anspannen.'],
    f:['Hüfte schießt zuerst hoch, der Rücken macht die Arbeit.','Stange entfernt sich vom Körper.','Oben nach hinten überstrecken.'],b:'Unten tief einatmen und den Bauch fest machen, oben ausatmen.',s:'Beine und Po drücken, der Rücken hält nur.'},
  bss:{a:['Hinterer Fußrücken auf der Bank, vorderer Fuß so weit vorn, dass das Knie unten etwa über dem Fuß ist.','Gewicht zu 80 % auf dem vorderen Bein.','Oberkörper aufrecht oder leicht nach vorn, Rumpf fest.','Knie zeigt in Richtung zweiter Zeh.','Durch die ganze Fußsohle hochdrücken.'],
    f:['Vorderes Knie fällt nach innen.','Zu kurzer Abstand: Ferse hebt ab.','Mit dem hinteren Bein mitdrücken.'],b:'Einatmen beim Absenken, ausatmen beim Hochdrücken.',s:'Oberschenkel vorn und Po des vorderen Beins.'},
  dbbench:{a:['Füße fest am Boden, Schulterblätter zusammen und nach unten.','Leichtes natürliches Hohlkreuz, Po bleibt auf der Bank.','Hanteln über der Brust, Unterarme senkrecht.','Ellbogen ca. 45° zum Körper absenken, bis die Hanteln neben der Brust sind.','Kraftvoll hochdrücken, oben nicht zusammenschlagen.'],
    f:['Ellbogen 90° zur Seite: belastet die Schulter.','Schulterblätter lösen sich beim Drücken.'],b:'Einatmen beim Absenken, ausatmen beim Drücken.',s:'Brust und Trizeps.'},
  bench1:{a:['Beide Hanteln oben halten, Schulterblätter fest zusammen.','Nur eine Hantel absenken, die andere bleibt gestreckt.','Rumpf und Becken bleiben ruhig.'],f:['Oberkörper dreht mit.'],b:'Ausatmen beim Drücken.',s:'Brust, dazu Rumpfspannung.'},
  pullup:{a:['Griff etwas breiter als schulterbreit.','Aus dem toten Hang erst die Schulterblätter nach unten ziehen.','Brust zur Stange, Ellbogen zu den Hüften führen.','Beine leicht vor dem Körper, Bauch fest, kein Schwung.','Unten wieder ganz strecken.'],
    f:['Halbe Wiederholungen.','Kinn reckt sich nach vorn über die Stange.','Schwingen mit den Beinen.'],b:'Ausatmen beim Hochziehen, einatmen beim Ablassen.',s:'Breiter Rücken, Bizeps.'},
  chinup:{a:['Untergriff schulterbreit.','Schulterblätter zuerst nach unten ziehen.','Brust zur Stange, Ellbogen eng am Körper.','Kontrolliert ganz nach unten ablassen.'],f:['Nur mit den Armen ziehen.','Hohlkreuz und Schwung.'],b:'Ausatmen beim Hochziehen.',s:'Rücken und Bizeps.'},
  bandpull:{a:['Kniend, Band oben fixiert, Arme gestreckt.','Brust leicht raus, Rumpf aufrecht.','Ellbogen nach unten zu den Hüften ziehen.','Unten Schulterblätter zusammen, langsam zurück.'],f:['Mit dem Oberkörper nach hinten lehnen.'],b:'Ausatmen beim Ziehen.',s:'Seitlicher Rücken.'},
  lateral:{a:['Leicht nach vorn geneigt, Knie weich.','Ellbogen minimal gebeugt, führen die Bewegung.','Arme seitlich bis Schulterhöhe heben, kleine Finger leicht höher.','Schultern bleiben tief, Hals entspannt.','2 s ablassen.'],
    f:['Schwung aus dem Oberkörper.','Schultern ziehen zu den Ohren.'],b:'Ausatmen beim Heben.',s:'Seitliche Schulter.'},
  bandlat:{a:['Mittig auf dem Band stehen, Knie weich.','Ellbogen leicht gebeugt, seitlich bis Schulterhöhe.','Schultern tief, langsam zurück.'],f:['Schulter zuckt hoch.'],b:'Ausatmen beim Heben.',s:'Seitliche Schulter.'},
  pallof:{a:['Seitlich zum Ankerpunkt, Füße schulterbreit, Knie weich.','Band auf Brusthöhe, Hände an der Brust.','Arme gerade nach vorn drücken, der Rumpf bleibt frontal.','Vorne 2 s halten, langsam zurück.'],f:['Oberkörper dreht zum Band.','Hohlkreuz.'],b:'Ausatmen beim Rausdrücken.',s:'Seitliche Bauchmuskeln.'},
  shtaps:{a:['Hohe Brettposition, Füße etwas breiter.','Hände unter den Schultern.','Langsam eine Schulter antippen, die Hüfte bleibt waagerecht.'],f:['Hüfte schaukelt hin und her.'],b:'Ruhig weiteratmen.',s:'Rumpf gegen Drehung.'},
  kneeraise:{a:['Toter Hang, Schultern leicht aktiv.','Becken einrollen, dann Knie bis Hüfthöhe oder höher.','Langsam ablassen, kein Schwingen.'],f:['Nur die Beine anheben, ohne das Becken einzurollen.'],b:'Ausatmen beim Hochziehen.',s:'Unterer Bauch.'},
  revcrunch:{a:['Rückenlage, Hände halten die Bank hinter dem Kopf.','Knie 90°, Becken einrollen und vom Boden heben.','Langsam Wirbel für Wirbel ablassen.'],f:['Schwung mit den Beinen.'],b:'Ausatmen beim Einrollen.',s:'Unterer Bauch.'},
  calf:{a:['Ballen auf der Stufe, Fersen frei.','Körper aufrecht, Knie gestreckt aber nicht durchgedrückt.','Ganz nach unten in die Dehnung, dann auf die Zehenspitzen.','Oben 1 s halten, Gewicht über dem Großzehenballen.'],f:['Wippen mit Schwung.','Fuß knickt nach außen.'],b:'Ausatmen beim Hochdrücken.',s:'Waden.'},
  goblet:{a:['Füße schulterbreit, Fußspitzen leicht nach außen.','Hantel eng vor der Brust, Ellbogen zeigen nach unten.','Hüfte nach hinten und unten, Knie folgen den Fußspitzen.','Oberkörper aufrecht, Brust bleibt oben.','Unten kurz halten, über die ganze Sohle hochdrücken.'],
    f:['Knie fallen nach innen.','Fersen heben ab.','Rücken rundet unten.'],b:'Oben einatmen und Bauch fest, beim Hochdrücken ausatmen.',s:'Oberschenkel vorn und Po.'},
  hipbridge:{a:['Rücken am Boden, Stange mit Polster in der Hüftfalte.','Füße hüftbreit, Fersen nah am Po.','Kinn leicht zur Brust, Rippen unten.','Durch die Fersen drücken, oben Po 2 s anspannen.'],f:['Oben ins Hohlkreuz.','Knie fallen nach innen.'],b:'Ausatmen beim Hochdrücken.',s:'Po.'},
  ohp:{a:['Griff knapp schulterbreit, Stange auf der vorderen Schulter.','Po und Bauch fest, Rippen unten.','Kopf kurz zurück, Stange gerade nach oben drücken.','Oben Kopf durch die Arme schieben, Stange über der Fußmitte.'],f:['Hohlkreuz, um das Gewicht hochzubekommen.','Stange vor dem Körper nach vorn drücken.'],b:'Einatmen und Bauch fest vor jeder Wiederholung, oben ausatmen.',s:'Schultern und Trizeps, Rumpf hält.'},
  row:{a:['Knie und Hand der gleichen Seite auf der Bank, Rücken flach.','Arm hängt gestreckt senkrecht unter der Schulter.','Ellbogen nah am Körper Richtung Hüfte ziehen.','Oben Schulterblatt zur Wirbelsäule, langsam ablassen.'],f:['Oberkörper dreht auf.','Mit dem Bizeps statt dem Rücken ziehen.'],b:'Ausatmen beim Ziehen.',s:'Rücken und hintere Schulter.'},
  curl:{a:['Aufrecht, Ellbogen am Körper.','Stange kontrolliert hochbeugen, Handgelenke gerade.','Oben kurz anspannen, langsam ablassen.'],f:['Schwung mit dem Oberkörper.','Ellbogen wandern nach vorn.'],b:'Ausatmen beim Hochbeugen.',s:'Bizeps.'},
  revcurl:{a:['Obergriff, Ellbogen am Körper.','Handgelenke gerade halten.','Langsam ablassen.'],f:['Handgelenke knicken ab.'],b:'Ausatmen beim Hochbeugen.',s:'Unterarme und Oberarm.'},
  french:{a:['Auf der Bank liegend, Oberarme senkrecht.','Ellbogen zeigen zur Decke und bleiben eng.','Stange Richtung Stirn oder knapp dahinter absenken.','Nur aus dem Ellbogen strecken.'],f:['Ellbogen gehen nach außen.','Oberarme bewegen mit.'],b:'Ausatmen beim Strecken.',s:'Trizeps.'},
  closepush:{a:['Hände unter der Brust, eng.','Körper eine Linie, Po fest.','Ellbogen streifen beim Absenken den Körper.'],f:['Ellbogen nach außen.'],b:'Ausatmen beim Hochdrücken.',s:'Trizeps.'},
  benchdip:{a:['Hände schulterbreit an der Bankkante, Finger nach vorn.','Rücken nah an der Bank.','Ellbogen nach hinten bis ca. 90° beugen.'],f:['Schultern rollen nach vorn.','Zu tief absenken.'],b:'Ausatmen beim Hochdrücken.',s:'Trizeps.'},
  sideplank:{a:['Ellbogen unter der Schulter, Unterarm nach vorn.','Füße übereinander oder versetzt.','Hüfte hoch, Körper eine gerade Linie.','Obere Schulter leicht nach hinten, Brust offen.'],f:['Hüfte sackt ab.','Oberkörper kippt nach vorn.'],b:'Ruhig weiteratmen.',s:'Seitlicher Bauch.'},
  sideplankhip:{a:['Aus dem Seitstütz die Hüfte langsam senken.','Wieder über die Linie heben.','Schulter bleibt stabil.'],f:['Schwung.'],b:'Ausatmen beim Heben.',s:'Seitlicher Bauch.'},
  rdl:{a:['Hüftbreiter Stand, Knie leicht gebeugt und fest.','Hüfte nach hinten schieben wie beim Schließen einer Tür mit dem Po.','Stange gleitet an den Oberschenkeln entlang.','Rücken bleibt neutral, Lat angespannt.','Runter bis knapp unter das Knie oder bis der Rücken rund würde.'],
    f:['Knie zu stark beugen: wird zur Kniebeuge.','Stange weg vom Bein.','Runder Rücken unten.'],b:'Einatmen beim Absenken, ausatmen beim Hochkommen.',s:'Beinrückseite und Po.'},
  revlunge:{a:['Großer Schritt zurück.','Vorderes Knie bleibt über dem Fuß.','Oberkörper aufrecht, Rumpf fest.','Hinteres Knie fast bis zum Boden.'],f:['Knie fällt nach innen.','Oberkörper kippt nach vorn.'],b:'Ausatmen beim Hochdrücken.',s:'Oberschenkel und Po.'},
  fwdlunge:{a:['Großer Schritt nach vorn, Fuß zeigt gerade.','Knie über dem Fuß.','Kräftig zurück in den Stand.'],f:['Zu kurzer Schritt.'],b:'Ausatmen beim Zurückdrücken.',s:'Oberschenkel und Po.'},
  lunge:{a:['Großer Schritt.','Knie über dem Fuß.','Oberkörper aufrecht.'],f:['Knie fällt nach innen.'],b:'Ausatmen beim Hochdrücken.',s:'Oberschenkel und Po.'},
  pushup:{a:['Hände etwas breiter als die Schultern.','Körper eine Linie, Po und Bauch fest.','Ellbogen ca. 45° zum Körper.','Brust bis knapp über den Boden.'],f:['Hüfte hängt durch.','Kopf zuerst zum Boden.'],b:'Einatmen beim Absenken, ausatmen beim Drücken.',s:'Brust und Trizeps.'},
  bandpush:{a:['Band über den oberen Rücken, Enden unter den Händen.','Körper eine Linie.','Oben voll strecken.'],f:['Hüfte sackt durch.'],b:'Ausatmen beim Hochdrücken.',s:'Brust und Trizeps.'},
  pullover:{a:['Quer auf der Bank, Schultern aufgelegt, Hüfte tief.','Hantel mit beiden Händen über der Brust.','Mit leicht gebeugten Armen hinter den Kopf absenken.','Rippen bleiben unten.'],f:['Hohlkreuz beim Absenken.'],b:'Einatmen beim Absenken, ausatmen beim Zurückholen.',s:'Lat und Brust.'},
  facepull:{a:['Band auf Kopfhöhe.','Ellbogen hoch, Hände Richtung Ohren ziehen.','Am Ende Daumen nach hinten drehen.'],f:['Mit dem Oberkörper lehnen.'],b:'Ausatmen beim Ziehen.',s:'Hintere Schulter.'},

  rollout:{a:['Kniend, Hände schulterbreit an der Stange.','Becken leicht eingerollt, Bauch fest.','Nur so weit rollen, wie der Rücken gerade bleibt.','Mit Bauchspannung zurückziehen.'],f:['Hohlkreuz am weitesten Punkt.'],b:'Einatmen beim Rausrollen, ausatmen beim Zurückkommen.',s:'Bauch.'},

function tipFor(k){ return TIPS[k]||null; }
function tipsHtml(k,open){ const t=tipFor(k); if(!t) return '';
  const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
  return `<details class="tips" ${open?"open":""}><summary>Haltung und Technik</summary><div class="tipbody">
    <h4>Ausrichtung</h4><ol>${li(t.a)}</ol>

function mobPlan(cfg){
  const feel=MOB_FEEL[cfg.feel]||MOB_FEEL.gut, total=(cfg.min||15)*60;
  let sel=MOB_AREAS.filter(a=>(cfg.areas||{})[a.k]>0); const all=!sel.length; if(all) sel=MOB_AREAS;
  const w=a=>all?1:cfg.areas[a.k];
  const seed=Math.floor(Date.now()/864e5/7); // wöchentlich etwas andere Reihenfolge im Pool
  const pools=sel.map(a=>{ let pl=a.pool.slice();
    if(feel.gentle) pl=pl.filter(x=>!['wgs','birddog','pullapart'].includes(x.ex)).concat(pl.filter(x=>['wgs','birddog','pullapart'].includes(x.ex)));
    else if(feel.dyn>0) pl=pl.filter(x=>x.dyn).concat(pl.filter(x=>!x.dyn));
    else { const r=seed%pl.length; pl=pl.slice(r).concat(pl.slice(0,r)); }
    return {a,pl,i:0}; });
  const cost=x=>Math.round(x.sec*(x.dyn?1:feel.hold))*(x.side?2:1);
  const closer=feel.gentle||cfg.feel==='verspannt' ? {ex:'sava',sec:feel.gentle?150:90,rest:1,note:'Alles loslassen, Atem beobachten'} : {ex:'child',sec:60,rest:1,note:'Tief in Bauch und Flanken atmen'};
  const opener=feel.gentle ? {ex:'seiza',sec:60,note:'5 tiefe Atemzüge in den Bauch, ankommen'} : {ex:'catcow',sec:60,dyn:1,note:'8 langsame Wiederholungen mit dem Atem'};
  let budget=total-cost(opener)-closer.sec; const used=new Set([opener.ex,closer.ex]); const picked=[];
  const tickets=[]; pools.forEach(p=>{ for(let k=0;k<w(p.a);k++) tickets.push(p); });
  tickets.sort((x,y)=>w(y.a)-w(x.a));
  let progress=true;
  while(progress && budget>20){ progress=false;
    for(const p of tickets){
      while(p.i<p.pl.length && used.has(p.pl[p.i].ex)) p.i++;
      if(p.i>=p.pl.length) continue;
      const x=p.pl[p.i], c=cost(x);
      if(c<=budget+20){ picked.push({...x,area:p.a.n}); used.add(x.ex); budget-=c; p.i++; progress=true; }
      else p.i++;
    } }
  // Wenige Bereiche gewählt: mit benachbarten Bereichen auffüllen, bevor Haltezeiten verlängert werden
  const focusBase=picked.reduce((t,x)=>t+cost(x),0); let fill=budget-focusBase*.5; // gewählte Bereiche erst länger halten, dann ergänzen
  if(fill>90 && !all){
    const near={nacken:['schulter','bws'],schulter:['bws','nacken'],bws:['schulter','lws'],lws:['bws','huefte','po'],huefte:['po','leiste','lws'],po:['huefte','lws'],hinten:['waden','huefte'],leiste:['huefte','po'],waden:['hinten','huefte']};
    const extra=[...new Set(sel.flatMap(a=>near[a.k]))].filter(k=>!sel.some(a=>a.k===k)).map(k=>MOB_AREAS.find(a=>a.k===k));
    const rest=MOB_AREAS.filter(a=>!sel.includes(a)&&!extra.includes(a)); let more=true;
    while(more && fill>90){ more=false; for(const a of extra.concat(rest)){ for(const x of a.pool){ if(fill<=90) break; if(used.has(x.ex)||(feel.gentle&&['wgs','birddog','pullapart'].includes(x.ex))) continue; const c=cost(x); if(c<=fill){ picked.push({...x,area:a.n}); used.add(x.ex); budget-=c; fill-=c; more=true; break; } } } if(fill<=90) break; }
  }
  // Restzeit: Haltezeiten verlängern (max. +50 %)
  const base=picked.reduce((t,x)=>t+cost(x),0); const stretch=budget>30&&base?Math.min(1.5,1+budget/base):1;
  if(!feel.gentle) picked.push(opener);
  picked.sort((x,y)=>(MOB_POS[x.ex]-MOB_POS[y.ex])||((y.dyn?1:0)-(x.dyn?1:0)));
  const steps=[]; const sec=x=>Math.round(cost(x)/(x.side?2:1)*stretch/5)*5;
  const push=(x,kind)=>{ const e=EX[x.ex]; let note=x.note||''; if(!x.dyn&&feel.tip&&!x.rest) note=(note?note+' · ':'')+feel.tip;
    if(x.side){ steps.push(S(e.n+' · links',sec(x),x.ex,note,kind)); steps.push(S(e.n+' · rechts',sec(x),x.ex,note,kind)); }
    else steps.push(S(e.n,x===opener||x===closer?x.sec:sec(x),x.ex,note,kind)); };
  if(feel.gentle) push(opener); picked.forEach(x=>push(x)); push(closer,'rest');
  return {steps,areas:all?['Ganzkörper']:sel.map(a=>a.n),short:all?['Ganzkörper']:sel.map(a=>a.s),feel};
}

// Leitet aus dem Training der letzten 3 Tage ab, welche Bereiche heute Regeneration brauchen.
// Muskel-Stichwort (aus EX.mg) -> Körperbereiche aus MOB_AREAS mit Gewicht
const LOAD_MAP = [
  [/unterer rücken/i,{lws:1}],
  [/nacken|trapez/i,{nacken:1,schulter:.4}],
  [/brust/i,{schulter:1,bws:.4}],
  [/schulter|rotatoren/i,{schulter:1,nacken:.3,bws:.2}],
  [/trizeps|bizeps|arme|unterarm|griff/i,{schulter:.4}],
  [/^(?!.*unter).*(rücken|\blat\b)/i,{bws:1,lws:.4,schulter:.3}],
  [/(^|\s)po(\s|$)/i,{po:1,huefte:.4}],
  [/beinbeuger|rückseite/i,{hinten:1,lws:.3}],
  [/oberschenkel innen|adduktor/i,{leiste:1}],
  [/oberschenkel(?! innen)|beine/i,{huefte:.7,po:.4,leiste:.3}],
  [/waden|schienbein/i,{waden:1}],
  [/hüft/i,{huefte:1}],
  [/core/i,{lws:.5,huefte:.3}],
  [/ganzkörper|kondition|schnellkraft/i,{huefte:.4,waden:.3,schulter:.3,lws:.3,hinten:.3}],
];
const _exLoad={};
function exLoad(k){ if(_exLoad[k]) return _exLoad[k]; const e=EX[k], out={};
  if(e && e.cat!=='mobil' && !GLOW_EX.has(k)){
    const parts=String(e.mg||'').split(/,\s*/).filter(Boolean);
    parts.forEach((p,i)=>{ const w=i===0?1:.7; // erstgenannter Muskel zählt voll
      LOAD_MAP.forEach(([re,m])=>{ if(re.test(p)) for(const a in m) out[a]=Math.max(out[a]||0,m[a]*w); }); });
  }
  return _exLoad[k]=out; }
// Übungen und Satzzahl einer abgeschlossenen Einheit
function sessExSets(w){
  if(w.plan && w.plan.mode==='timer'){ const t=getTpl(w.tpl); if(!t) return []; const R=+t.rounds||1; return tplItems(t).map(x=>[x.ex,R]); }
  const rows=Object.entries(w.sets||{}).map(([g,arr])=>[w.exmap&&w.exmap[g],(arr||[]).filter(x=>x.done).length,(arr||[]).length]).filter(r=>EX[r[0]]);
  const anyDone=rows.some(r=>r[1]>0); return rows.map(r=>[r[0],anyDone?r[1]:r[2]]); }
const REGEN_DAY=['Heute','Gestern','Vorgestern','Vor 3 Tagen'];
function regenInfo(key){
  key=key||todayKey(); const L={}, src=[];
  const add=(ex,n,f)=>{ const m=exLoad(ex); for(const a in m) L[a]=(L[a]||0)+m[a]*n*f; };
  for(let d=0;d<=3;d++){ const k=addDays(key,-d), f=[1,1,.6,.3][d];
    workouts().filter(w=>w.date===k&&w.finished).forEach(w=>{ const list=sessExSets(w); if(!list.length) return; list.forEach(([ex,n])=>add(ex,n,f)); src.push({d,n:wname(w)}); });
    const doc=Store.get('d-'+k);
    if(doc&&doc.done){
      if(doc.done.circuit && !workouts().some(w=>w.date===k&&w.slot==='circuit')){ ['thruster','climber','renegade','burpee','woodchop','hollow'].forEach(e=>add(e,4,f)); src.push({d,n:'Zirkel'}); }
      if(doc.done.z2){ L.waden=(L.waden||0)+3*f; L.huefte=(L.huefte||0)+2*f; L.hinten=(L.hinten||0)+1.5*f; src.push({d,n:'Ausdauer'}); }
    }
  }
  const ranked=Object.entries(L).filter(([,v])=>v>=1).sort((a,b)=>b[1]-a[1]);
  const areas={}; ranked.slice(0,4).forEach(([a,v])=>{ const lv=v>=7?2:v>=2.5?1:0; if(lv) areas[a]=lv; });
  const ck=(Store.get('d-'+key)||{}).check;
  if(ck&&ck.areas) ck.areas.filter(a=>MOB_AREAS.some(m=>m.k===a)).forEach(a=>{ areas[a]=2; });
  const office=!Object.keys(areas).length;
  if(office){ areas.huefte=1; areas.bws=1; areas.nacken=1; }
  const today=Store.get('d-'+key)||{}, total=ranked.reduce((t,[,v])=>t+v,0);
  const recent=src.some(s=>s.d<=1);
  let feel='gut', why='';
  if(today.sleep!=null && today.sleep!=='' && +today.sleep<6){ feel='muede'; why='Wenig Schlaf: sanft und viel am Boden.'; }
  else if(recent && total>=25){ feel='verspannt'; why='Hohe Belastung: längere, ruhige Haltezeiten.'; }
  else if(office){ why='Kein Training in den letzten 3 Tagen erfasst: Fokus auf die typischen Büro-Bereiche.'; }
  if(ck&&ck.light==='r'&&feel==='gut'){ feel='muede'; why='Ampel Rot: sanft und viel am Boden.'; }
  else if(ck&&ck.areas&&ck.areas.length&&!why) why='Bereiche aus deinem Check-in sind dabei.';
  const m=Store.get('mob')||{}, min=m.regenMin||15;
  const byDay={}; src.forEach(s=>{ (byDay[s.d]=byDay[s.d]||[]).push(s.n); });
  const srcTxt=Object.keys(byDay).sort().map(d=>REGEN_DAY[d]+': '+[...new Set(byDay[d])].join(', ')).join(' · ');
  return {areas,feel,min,load:L,ranked,office,srcTxt,why};
}

const YOGA_STYLE = {aktiv:{n:'Aktiv',d:'Fließend und kräftigend, mehr Sonnengrüße und Stehhaltungen'},ruhig:{n:'Entspannend',d:'Langsam, lange Haltungen am Boden, längere Endentspannung'}};
const YOGA_INT = {1:{n:'Sanft',f:.8},2:{n:'Mittel',f:1},3:{n:'Kräftig',f:1.25}};
function yogaCfg(){ const m=Store.get('mob')||{}, y=m.yoga||{}; return {areas:{...(y.areas||{})},style:y.style||'aktiv',int:y.int||2,min:y.min||20}; }

function yogaPlan(cfg){
  const relax=cfg.style==='ruhig', int=+cfg.int||2, total=(cfg.min||20)*60, f=YOGA_INT[int].f;
  const sel=Object.keys(cfg.areas||{}).filter(k=>cfg.areas[k]>0), all=!sel.length;
  const hold=x=>Math.round(x.sec*(relax?(x.act===2?1:1.6):1)*(x.act>0&&!relax?f:1)*(relax&&int===1?1.15:1)/5)*5;
  const cost=x=>x.sets?x.sets*hold(x)+(x.sets-1)*15:hold(x)*(x.side?2:1);
  // feste Teile
  const opener={ex:'seiza',sec:relax?120:60,note:relax?'Augen schließen, lang ausatmen, ankommen':'Ankommen, ruhig in den Bauch atmen'};
  const warm={ex:'catcow',sec:relax?90:60,note:'Langsam mit dem Atem, 8 Wiederholungen'};
  const rounds=relax?(int===1?0:int===2?2:3):[2,4,6][int-1]+(total>=1800?2:0);
  const sun=rounds?{ex:'sun',sec:rounds*(relax?75:60),note:rounds+' Runden'+(relax?', sehr langsam, jede Haltung 2 Atemzüge':' in deinem Atemtempo')}:null;
  const sava={ex:'sava',sec:Math.max(90,Math.round(total*(relax?.15:.08)/30)*30),note:'Alles loslassen, Atem kommen und gehen lassen'};
  let budget=total-opener.sec-warm.sec-(sun?sun.sec:0)-sava.sec;
  const seed=Math.floor(Date.now()/864e5);
  const pool=YOGA_POOL.filter(x=>!(x.min&&(relax||int<x.min))).map((x,i)=>{
    const rs=all?1:x.r.reduce((t,k)=>t+(cfg.areas[k]||0),0);
    const st=relax?2-x.act:x.act;
    return {...x,sets:x.sets?(relax?1:int):0,score:rs*(all?1:3)+st*(all?1.5:1)+(relax&&(MOB_POS[x.ex]??2)>=2?1:0)+((i*7+seed)%5)/10};
  }).sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const x of pool){ if(budget<30) break; if(!all&&!x.r.some(k=>cfg.areas[k])) continue; const c=cost(x); if(c<=budget+15){ picked.push(x); budget-=c; } }
  const focus=picked.reduce((t,x)=>t+cost(x),0); let fill=budget-focus*.4; // Schwerpunkt etwas länger halten, Rest mit passenden Haltungen füllen
  for(const x of pool){ if(fill<60) break; if(picked.includes(x)) continue; const c=cost(x); if(c<=fill){ picked.push(x); budget-=c; fill-=c; } }
  // Rest auf Haltungen verteilen
  const base=picked.reduce((t,x)=>t+cost(x),0), k=budget>20&&base?Math.min(1.6,1+budget/base):1;
  picked.sort((a,b)=>(MOB_POS[a.ex]??2)-(MOB_POS[b.ex]??2)||b.act-a.act);
  const steps=[]; const sec=x=>Math.round(hold(x)*k/5)*5;
  const add=(x,kind)=>{ const e=EX[x.ex], note=x.note||'';
    if(x.sets>1){ for(let i=1;i<=x.sets;i++){ steps.push(S('Brücke halten',sec(x),x.ex,i+' von '+x.sets)); if(i<x.sets) steps.push(S('Lösen',15,null,'','rest')); } }
    else if(x.side){ steps.push(S(e.n+' · links',sec(x),x.ex,note,kind)); steps.push(S(e.n+' · rechts',sec(x),x.ex,note,kind)); }
    else steps.push(S(x.ex==='bridge'?'Brücke halten':e.n,x.fixed?x.sec:sec(x),x.ex,note,kind)); };
  [opener,warm,sun].filter(Boolean).forEach(x=>{ x.fixed=1; add(x); });
  picked.forEach(x=>add(x)); sava.fixed=1; add(sava,'rest');
  const names=all?['Ganzkörper']:MOB_AREAS.filter(a=>cfg.areas[a.k]).map(a=>a.s);
  return {steps,short:names,title:'Yoga · '+(relax?'entspannend':'aktiv')+' · '+YOGA_INT[int].n.toLowerCase()};
}

function planTpls(){ return ['A','B','C'].map(t=>({id:'plan-'+t,plan:t,cls:'kraft',name:WORKOUTS[t].name,mode:'sets',warm:true,note:'Aus deinem Wochenplan, mit Varianten und Ersatzübungen.',items:WORKOUTS[t].items.map(it=>({ex:it.ex,sets:it.sets,r:it.r,rest:it.rest,side:!!it.side,ss:it.rest<=20}))})); }

function tplItems(t){ const arr=(t.items||[]).filter(it=>EX[it.ex]); let n=0, sub=0;
  return arr.map((it,i)=>{ const ss=!!it.ss && i<arr.length-1, prev=i>0 && !!arr[i-1].ss;
    if(!prev){ n++; sub=0; } const g=(ss||prev)?n+'abcdefghij'[sub++]:String(n);
    return {ex:it.ex,sets:Math.max(1,+it.sets||1),r:[+it.r[0]||0,Math.max(+it.r[0]||0,+it.r[1]||0)],side:!!it.side,ssE:ss,g,rest:ss?15:(+it.rest||0)}; }); }
function tplMin(t){ const it=tplItems(t); if(!it.length) return 0;
  if(t.mode==='timer'){ const R=+t.rounds||1,W=+t.work||0,P=+(t.rest??0),RR=+(t.rrest??0); return Math.max(1,Math.round((R*(it.length*W+(it.length-1)*P)+(R-1)*RR)/60+(t.warm?3:0))); }
  return Math.max(1,Math.round(it.reduce((a,x)=>{ const u=EX[x.ex].unit, work=u==='sec'?(x.r[1]||30):40; return a+x.sets*(work*(x.side?2:1)+x.rest); },0)/60+(t.warm!==false?10:0))); }

  out.push(S('Gleich geht es los',10,null,'Erste Übung: '+EX[it[0].ex].n,'rest'));
  for(let r=1;r<=R;r++){ it.forEach((x,i)=>{ out.push(S(EX[x.ex].n,W,x.ex,'Runde '+r+' von '+R)); if(i<it.length-1&&P>0) out.push(S('Pause',P,null,'Gleich: '+EX[it[i+1].ex].n,'rest')); });

const LS_KEY = 'hantelwoche-v1';
const Store = {
  cache:{}, mode:'local', col:null, timers:{}, writing:{}, dirty:{},
  load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) this.cache=JSON.parse(raw)||{}; }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(this.cache)); }catch(e){} },
  get(k){ return this.cache[k]; },
  put(k,v){ this.cache[k]=JSON.parse(JSON.stringify(v)); this.touch(k); this.saveLocal(); this.queue(k); },
  del(k){ delete this.cache[k]; this.touch(k); this.saveLocal(); this.queue(k); },
  touch(k){ try{ const m=JSON.parse(localStorage.getItem(LS_KEY+'-t')||'{}'); m[k]=Date.now(); localStorage.setItem(LS_KEY+'-t',JSON.stringify(m)); }catch(e){} if(typeof GitSync!=='undefined') GitSync.soon(); if(typeof Ntfy!=='undefined') Ntfy.soon(); },
  queue(k){ if(!this.col) return; this.dirty[k]=true; clearTimeout(this.timers[k]); this.timers[k]=setTimeout(()=>this.flush(k),700); },
  async flush(k){
    if(this.writing[k]){ this.timers[k]=setTimeout(()=>this.flush(k),400); return; }
    this.writing[k]=true; this.dirty[k]=false;
    try{ const v=this.cache[k]; const ref=this.col.doc(k); if(v===undefined) await ref.delete(); else await ref.set(v); }
    catch(e){ if(e && e.code==='unavailable'){ this.dirty[k]=true; setTimeout(()=>this.flush(k),1500+Math.random()*1000);} }
    finally{ this.writing[k]=false; }
  },
  async connect(){
    if(!window.claude || !claude.use) return;
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user) return;
      const uid=await user.id(); if(!uid) return;
      this.col=db.collection('data/users/'+uid);
      let first=true;
      this.col.onSnapshot(snap=>{
        const remote={}; snap.docs.forEach(d=>{ remote[d.id]=d.data(); });
        if(first){ first=false; for(const k in this.cache) if(!(k in remote)) this.queue(k); }
        else { for(const k in this.cache) if(!(k in remote) && !this.dirty[k] && !this.writing[k]) delete this.cache[k]; }
        for(const k in remote) if(!this.dirty[k] && !this.writing[k]) this.cache[k]=JSON.parse(JSON.stringify(remote[k]));
        this.mode='cloud'; this.saveLocal(); onData();
      }, ()=>{ this.mode='local'; this.col=null; onData(); });
    }catch(e){}
  }
};

const GitSync = {
  KEY:LS_KEY+'-gh', busy:false, timer:null, last:null, err:'',

  times(){ try{ return JSON.parse(localStorage.getItem(LS_KEY+'-t')||'{}'); }catch(e){ return {}; } },
  soon(){ if(!this.on()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.sync(),4000); },
  api(path,opt={},raw){ const c=this.cfg(); const br=c.branch||'daten'; return fetch('https://api.github.com/repos/'+c.repo+'/contents/'+path+(opt.method==='PUT'?'':'?ref='+encodeURIComponent(br)),{...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})},cache:'no-store'}); },
  // Verschlüsselung: AES-GCM 256, Schlüssel aus dem Passwort per PBKDF2-SHA256. Das Passwort verlässt das Gerät nie.
  ITER:310000, keyCache:{},
  bytesB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); },
  b64Bytes(b){ const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; },

  async seal(obj,salt){ const c=this.cfg(); salt=salt||this.bytesB64(crypto.getRandomValues(new Uint8Array(16)));
    let plain=new TextEncoder().encode(JSON.stringify(obj)); const z=await this.zip(plain,true); if(z) plain=z;
    const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await this.key(c.pass,salt,this.ITER),plain));
    return {app:'Hantelwoche',hinweis:'Verschlüsselt. Lesbar nur in der App mit deinem Passwort.',v:1,enc:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter:this.ITER,zip:!!z,salt,iv:this.bytesB64(iv),data:this.bytesB64(ct),saved:new Date().toISOString()}; },
  async open(f){ const c=this.cfg(); if(!f.enc) return f;
    let pt; try{ pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:this.b64Bytes(f.iv)},await this.key(c.pass,f.salt,f.iter||this.ITER),this.b64Bytes(f.data))); }

  unb64(b){ const bin=atob(b.replace(/\n/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); },
  async sync(tries=0){
    if(!this.on()) return; if(this.busy){ this.soon(); return; } this.busy=true; this.err='';

        if(tr>tl){ if(k in remote.docs){ if(JSON.stringify(Store.cache[k])!==JSON.stringify(remote.docs[k])){ Store.cache[k]=remote.docs[k]; changedLocal=true; } } else if(k in Store.cache){ delete Store.cache[k]; changedLocal=true; } lt[k]=tr; }

        const t=Math.max(tl,tr)||Date.now(); lt[k]=t; out.t[k]=t; if(k in Store.cache) out.docs[k]=Store.cache[k]; });
      try{ localStorage.setItem(LS_KEY+'-t',JSON.stringify(lt)); }catch(e){}
      if(changedLocal){ Store.saveLocal(); onData(); }

        const file=await this.seal(out,salt);
        const w=await this.api('data.json',{method:'PUT',body:JSON.stringify({message:'Daten '+todayKey()+' (verschlüsselt)',branch:this.cfg().branch||'daten',content:this.b64(JSON.stringify(file)),...(sha?{sha}:{})})});

function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function defaultStart(){ const d=new Date(); const wd=d.getDay(); if(wd===0||wd===6) d.setDate(d.getDate()+(wd===0?1:2)); return mondayOf(d); }
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return dkey(x); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }

const fmtShort=k=>parseKey(k).toLocaleDateString('de-DE',{day:'numeric',month:'short'});

let audioCtx=null;
function beep(freq=880,dur=.15,times=1){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
      const t0=audioCtx.currentTime+i*(dur+.08); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.35,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.02); }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(times>1?[120,80,120]:120); }catch(e){}
}

function render(){
  const ist=prof().settings.imgStyle||'auto'; if(ist!==applyImgStyle.cur) applyImgStyle(ist);
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${UI.tab===k?'aria-current="page"':''}>${ICONS[k]||HICO[k]}<span>${l}</span></button>`).join('');
  const v={home:vHome,today:vToday,skills:vSkills,week:vWeek,tpl:vTpl,ex:vEx,food:vFood,progress:vProgress}[UI.tab]||vHome;
  $('#main').innerHTML=v();
  if(UI.tab==='progress') drawCharts();
}

function blockDone(key,b,doc){
  if(b.key==='train'){ return workouts().some(w=>w.date===key && (w.slot||w.type)===b.train && w.finished); }
  return !!doc.done[b.key];
}
/* ============================== START: ÜBERSICHT ============================== */
function homeGreet(h){ return h<5?'Gute Nacht':h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht'; }
function ring(v,max,lab,sub,cls){
  const f=max?Math.min(1,v/max):0, C=2*Math.PI*26;
  return `<div class="hring ${cls||''} ${f>=1?'full':''}"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" class="bg"/><circle cx="32" cy="32" r="26" class="fg ${f?'':'zero'}" stroke-dasharray="${(f*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="rv num">${v}<small>/${max}</small></div><div class="rl">${esc(lab)}</div>${sub?`<div class="rs">${esc(sub)}</div>`:''}</div>`;
}
function spark(vals){
  if(vals.length<2) return '';
  const W=120,H=36,lo=Math.min(...vals),hi=Math.max(...vals),r=(hi-lo)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*(W-6)+3,H-3-((v-lo)/r)*(H-6)]);
  const [lx,ly]=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3"/></svg>`;
}

function nextBlock(day,key,doc){
  return day.blocks.find(b=>!blockDone(key,b,doc))||null;
}

function blockAct(b,key){
  let act='';
  if(b.train){ const op=workouts().find(w=>!w.finished&&w.date===key&&(w.slot||w.type)===b.train);
    act=`<div class="actcol">${op&&op.type!==b.train?`<button class="btn primary" data-act="resume" data-id="${op.id}">Fortsetzen: ${esc(wname(op))}</button>`:`<button class="btn primary" data-act="train" data-w="${b.train}">${op?'Fortsetzen':'Training starten'}</button>`}<button class="btn" data-act="tplpick" data-slot="${b.train}">Andere Vorlage</button></div>`; }
  else if(b.pick) act=`<div class="actcol"><button class="btn ${b.main?'primary':''}" data-act="mobpick" data-key="${b.key}" data-min="${b.pickMin||''}">Nach Gefühl</button>${/^yoga/.test(b.seq)?`<button class="btn" data-act="yogapick" data-key="${b.key}">${esc(b.seqLabel||'Yoga')}</button>`:`<button class="btn" data-act="seq" data-seq="${b.seq}" data-key="${b.key}">${esc(b.seqLabel||'Starten')}</button>`}</div>`;
  else if(b.seq&&/^yoga/.test(b.seq)) act=`<div class="actcol"><button class="btn ${b.main?'primary':''}" data-act="seq" data-seq="${b.seq}" data-key="${b.key}">Starten</button><button class="btn" data-act="yogapick" data-key="${b.key}">Anpassen</button></div>`;
  else if(b.seq&&b.main) act=`<div class="actcol"><button class="btn primary" data-act="seq" data-seq="${b.seq}" data-key="${b.key}">Starten</button><button class="btn" data-act="tplpick" data-slot="${b.key}">Andere Vorlage</button></div>`;
  else if(b.seq==='med') act=`<div class="actcol"><button class="btn" data-act="seq" data-seq="${b.seq}" data-key="${b.key}">Starten</button><button class="btn" data-act="brpick" data-key="${b.key}">Atemübung</button></div>`;
  else if(b.seq) act=`<button class="btn" data-act="seq" data-seq="${b.seq}" data-key="${b.key}">Starten</button>`;
  else if(b.go) act=`<button class="btn" data-tab="${b.go}">Öffnen</button>`;
  return act;
}
function vToday(){

function weeklyAverages(bw){

}

function drawCharts(){
  const el=$('#bwchart'); if(!el) return;
  const bw=[...prof().bw].sort((a,b)=>a.d<b.d?-1:1);
  if(bw.length<2){ el.innerHTML='<p class="small muted">Ab zwei Messungen siehst du hier den Verlauf.</p>'; return; }
  const W=Math.max(320,el.clientWidth||600),H=200,L=40,R=12,T=12,B=26;
  const xs=bw.map(e=>parseKey(e.d).getTime()), x0=Math.min(...xs), x1=Math.max(...xs);
  const ys=bw.map(e=>e.kg); let y0=Math.floor(Math.min(...ys)-0.5), y1=Math.ceil(Math.max(...ys)+0.5);
  const X=t=>L+(x1===x0?0:(t-x0)/(x1-x0))*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const step=(y1-y0)>4?1:0.5; let grid='';
  for(let v=y0;v<=y1+1e-9;v+=step){ grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v,1)}</text>`; }
  const avgs=weeklyAverages(bw).map(a=>({t:parseKey(a.w).getTime()+3*864e5,v:a.avg}));
  const pts=bw.map(e=>`<circle cx="${X(parseKey(e.d).getTime())}" cy="${Y(e.kg)}" r="3" fill="var(--muted)"/>`).join('');
  const line=avgs.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${avgs.map(a=>X(Math.min(x1,Math.max(x0,a.t)))+','+Y(a.v)).join(' ')}"/>`:'';
  const last=avgs[avgs.length-1];
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">${grid}${pts}${line}${last?`<circle cx="${X(Math.min(x1,Math.max(x0,last.t)))}" cy="${Y(last.v)}" r="5" fill="var(--accent)"/>`:''}<text x="${L}" y="${H-6}">${fmtShort(bw[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(bw[bw.length-1].d)}</text></svg><p class="small muted">Punkte: einzelne Messungen · Linie: Wochenschnitt</p>`;
}

/* ============================== TRAINING ============================== */
function variantOf(raw){ return raw.v ? {...raw, ...raw.v, isVar:true} : null; }
function altOf(raw){ return raw.alt ? {...raw, ex:raw.alt.ex, sets:raw.alt.sets, r:raw.alt.r, side:false, lab:null, isAlt:true} : null; }
function itemFor(raw,exId){ if(raw.alt && exId===raw.alt.ex) return altOf(raw); if(raw.v && exId===raw.v.ex) return variantOf(raw); return raw; }
function isVariantWeek(k){ const w=weekNo(k); return w>0 && w%2===0; }
function resolveItem(raw,st,k){
  if(raw.alt && !st.bar) return altOf(raw);
  if(raw.v && st.vary!==false && isVariantWeek(k)) return variantOf(raw);
  return raw;
}
function activeItem(it,s){ return resolveItem(it,s,todayKey()); }
// Gesamtgewicht: eingetragen werden die Scheiben, die Stange wird addiert
function barOf(e,st){ st=st||prof().settings; return !st.plates||!e.imp ? 0 : e.imp==='lh'?+st.barlh||0 : e.imp==='sz'?+st.barsz||0 : +st.barkh||0; }
function totalKg(e,kg,st){ if(kg===''||kg==null||isNaN(+kg)) return null; return +kg+barOf(e,st); }
function totTxt(e,kg){ const t=totalKg(e,kg); if(t===null||!barOf(e)) return ''; return '= '+fmtNum(t,2)+' kg'+(e.imp==='kh2'?' je Hantel':'')+' mit Stange'; }
function setTotal(e,s){ return s.tot!=null ? +s.tot : (totalKg(e,s.kg)||0); }
function perfHistory(exId, beforeId, n){
  const out=[]; const ws=workouts().filter(w=>w.finished && w.id!==beforeId).reverse();
  for(const w of ws){ for(const [g,arr] of Object.entries(w.sets||{})){ if(w.exmap&&w.exmap[g]===exId){ const done=arr.filter(x=>x.done); if(done.length) out.push({date:w.date,sets:done}); } } if(out.length>=n) break; }
  return out;
}
function lastPerf(exId, beforeId){ return perfHistory(exId,beforeId,1)[0]||null; }
function suggestion(it,sessId){
  const ex=EX[it.ex], hist=perfHistory(it.ex,sessId,4), last=hist[0];
  const weighted=ex.unit==='kg'||ex.unit==='carry';
  if(!last) return {kg:'',text: weighted ? 'Erstes Mal: Gewicht wählen, mit dem du die untere Wdh.-Zahl mit RIR 2 schaffst.'+(barOf(ex)?' Trag nur die Scheiben ein, die Stange ('+fmtNum(barOf(ex),2)+' kg) rechnet die App dazu.':'') : 'Erstes Mal: sauber ausführen, Satz endet bei RIR 2.',up:false,trend:''};
  const unitTxt=ex.unit==='sec'?' s':'';
  const fmtSets=h=>h.sets.map(x=>(weighted&&x.kg!==''?fmtNum(x.kg,2)+'×':'')+(x.reps||'–')+unitTxt).join(', ');
  const trend=hist.slice().reverse().map(h=>fmtShort(h.date)+': '+fmtSets(h)).join(' · ');
  const top=h=>h.sets.length>=it.sets && h.sets.every(x=>+x.reps>=it.r[1]);
  const below=h=>h.sets.some(x=>x.reps!=='' && +x.reps<it.r[0]);
  const maxKg=h=>Math.max(0,...h.sets.map(x=>+x.kg||0));
  const reps=last.sets.map(x=>Math.min(it.r[1],(+x.reps||it.r[0])+1)).join(', ');
  if(weighted){
    const kg=maxKg(last), step=ex.step||1, rnd=x=>Math.max(0,Math.round(x/step)*step);
    const tot=x=>barOf(ex)?' (= '+fmtNum(totalKg(ex,x),2)+' kg'+(ex.imp==='kh2'?' je Hantel':'')+' mit Stange)':'';
    if(top(last)) return {kg:kg+step, up:true, trend, text:`Letztes Mal alle Sätze mit ${it.r[1]} Wdh. geschafft: heute ${fmtNum(kg+step,2)} kg${tot(kg+step)}, also +${fmtNum(step,2)} kg.`};
    if(below(last)){ const k=rnd(kg-Math.max(step,kg*0.05)); return {kg:k, down:true, trend, text:`Letztes Mal unter ${it.r[0]} Wdh. geblieben. Heute etwas leichter: ${fmtNum(k,2)} kg${tot(k)}, Ziel ${it.r[0]}–${it.r[1]} Wdh.`}; }
    const sumReps=h=>h.sets.reduce((a,x)=>a+(+x.reps||0),0);
    const stalled=hist.length>=3 && hist.slice(0,3).every(h=>maxKg(h)===kg && !top(h)) && sumReps(hist[0])<=sumReps(hist[2]);
    if(stalled){ const k=rnd(kg*0.9); return {kg:k, down:true, trend, text:`Seit 3 Einheiten mit ${fmtNum(kg,2)} kg kein Fortschritt. Heute ca. 10 % leichter: ${fmtNum(k,2)} kg${tot(k)}, sauber arbeiten und von dort neu steigern. Schlaf und Essen prüfen.`}; }
    return {kg, trend, text:`Gewicht halten: ${fmtNum(kg,2)} kg${tot(kg)}. Ziel heute: ${reps} Wdh.`};
  }
  if(it.ex==='pushup'){ const mx=Math.max(...last.sets.map(x=>+x.reps||0)); return {kg:'',trend,text:mx>=20?'Ab 20 Wdh.: Rucksack mit Gewicht aufsetzen.':'Ziel heute: '+reps+' Wdh.',up:mx>=20}; }
  if(ex.unit==='sec'){ return {kg:'',trend,up:top(last),text:top(last)?`Obere Zeit geschafft: nächste Stufe (${EX[it.v?.ex]?.n||'5–10 s länger'}) oder 5 s mehr.`:'Ziel heute: 5 s länger halten als letztes Mal.'}; }
  return {kg:'', trend, up:top(last), text:top(last)?'Obere Zahl geschafft: schwerere Variante oder stärkeres Band.':'Ziel heute: '+reps+' Wdh.'};
}
function startTraining(type,slot){
  const key=todayKey(); let sess=workouts().find(w=>!w.finished && w.date===key && w.type===type);
  if(!sess){
    const s=prof().settings, deload=isDeload(key), id='w-'+Date.now();
    const sets={}, exmap={}, sugg={}, lite=liteToday();
    WORKOUTS[type].items.forEach(raw=>{ const it=resolveItem(raw,s,key); const n=liteSets(it.sets,deload,lite); const sg=suggestion(it,id);
      exmap[raw.g]=it.ex; sets[raw.g]=[...Array(n)].map(()=>({kg:sg.kg===''?'':liteKg(EX[it.ex],sg.kg,lite),reps:'',done:false})); });
    sess={id,type,...(slot&&slot!==type?{slot}:{}),date:key,start:Date.now(),sets,exmap,warm:{},finished:false,...(lite?{lite:true}:{})};
    Store.put(id,stripId(sess));
  }
  UI.session=sess.id; keepAwake(true); renderSession(true);
}
function liteToday(){ const c=ckGet(); return !!(c&&c.choice==='lite'); }
function liteSets(n,deload,lite){ const d=deload?Math.ceil(n/2):n; return lite?Math.max(1,Math.min(d,Math.ceil(n*2/3))):d; }
function liteKg(e,kg,lite){ if(!lite||kg===''||kg==null) return kg; const st=e&&e.step||1; return Math.max(0,Math.round(+kg*.9/st)*st); }
function stripId(o){ const {id,...rest}=o; return rest; }
function sessObj(){ return UI.session?{id:UI.session,...Store.get(UI.session)}:null; }
function saveSess(s){ Store.put(s.id,stripId(s)); }
function loadPlan(s){
  const groups={}; wdef(s).items.forEach(raw=>{ const e=EX[s.exmap[raw.g]]; const k=e.imp||'none'; (groups[k]=groups[k]||[]).push(raw.g+' '+e.n); });
  const order=['lh','sz','kh2','kh1','none']; if(s.plan&&!order.slice(0,4).some(k=>groups[k])) return '';
  return `<section class="card"><h3>Gewichte heute</h3><div class="list small" style="margin-top:4px">${order.filter(k=>groups[k]).map(k=>`<div class="li"><b style="min-width:120px">${k==='none'?'Ohne Umstecken':IMP_NAME[k]}</b><span class="grow">${esc(groups[k].join(' · '))}</span></div>`).join('')}</div><p class="small muted" style="margin-top:6px">${s.plan?'Gewichte nach Gerät sortiert, damit du planen kannst, was du wann umsteckst.':'Die Reihenfolge ist so gewählt, dass du kaum umstecken musst. Band- und Körpergewichtsübungen laufen im Wechsel mit den Hantelübungen.'}</p></section>`;

function startRest(sec,label){ if(!sec) return; UI.rest={end:Date.now()+sec*1000,total:sec,label}; tickRest(); }

/* ============================== GEFÜHRTER ABLAUF ============================== */

}
function guideStep(){ const g=UI.guide; return g.steps[g.i]; }

function tickGuide(){

function cueIdx(g,st){ const t=tipFor(st.ex); if(!t) return -1; const el=st.sec?Math.max(0,st.sec-g.remain):0; return Math.floor(el/9)%t.a.length; }

function finishGuide(completed){

    if(g.key==='warmup' && UI.session){ const s=sessObj(); WARMUP.forEach((_,i)=>s.warm[i]=true); saveSess(s); }
    else if(g.key){ const k=todayKey(), d=dayDoc(k); d.done[g.key]=true; saveDay(k,d); }
    if(g.onDone) g.onDone(); else if(g.seq==='med') skAuto('meditation',{min:Math.round(g.steps.reduce((a,x)=>a+(x.sec||0),0)/60),src:'plan'});
    toast(g.title+' erledigt');
  }
  if(!UI.session) keepAwake(false);
  renderGuide(); if(!UI.session) render();
}

const brCyc=pat=>pat.reduce((t,p)=>t+p.s,0);
const fmtS=s=>String(+s.toFixed(1)).replace('.',',');
function brCfg(){ const m=Store.get('mob')||{}, b=m.breath||{}; return {set:{tone:true,vib:true,voice:false,...(b.set||{})},last:{...(b.last||{})}}; }
function brSaveCfg(patch){ const m=Store.get('mob')||{}, b=brCfg(); Store.put('mob',{...m,breath:{set:{...b.set,...(patch.set||{})},last:{...b.last,...(patch.last||{})}}}); }
function brChoice(m){ const l=brCfg().last[m.id]||{}; const v=Math.min(l.v||0,m.vars.length-1); return {v,len:m.lens.includes(l.len)?l.len:m.len}; }
function brEstimate(m,v,len){ if(m.whm) return len*(m.vars[v].b*3+75); return m.unit==='min'?len*60:len*brCyc(m.vars[v].pat); }
function brLenTxt(m,len){ return m.unit==='min'?len+' min':len+' '+(len===1?m.unit.replace(/n$/,''):m.unit); }
function brPatBar(m,v){
  if(m.whm){ const b=m.vars[v].b; return `<div class="brpat" aria-hidden="true"><i class="in" style="flex:${b*3}"></i><i class="rest" style="flex:60"></i><i class="hold" style="flex:15"></i></div><div class="brleg small muted">${b} tiefe Atemzüge · Luft anhalten · 15 s halten</div>`; }
  const pat=m.vars[v].pat;
  return `<div class="brpat" aria-hidden="true">${pat.map(p=>`<i class="${p.k}${p.hum?' hum':''}" style="flex:${p.s}"></i>`).join('')}</div><div class="brleg small muted">${esc(m.vars[v].leg||pat.map(p=>(p.lab||BR_KIND[p.k])+' '+fmtS(p.s)+' s').join(' · '))}</div>`;
}
function brSuggest(){
  const h=new Date().getHours(), k=todayKey();
  const fresh=workouts().some(w=>w.date===k&&w.finished&&w.start&&Date.now()-w.start<3*36e5);
  if(fresh) return {id:'sigh',why:'Nach dem Training: schnell runterfahren und regenerieren.'};
  if(h>=5&&h<10) return {id:'whm',why:'Morgens zum Wachwerden, am besten vor dem Frühstück.'};
  if(h>=10&&h<17) return {id:'box',why:'Im Büro: kurz sammeln, dann konzentriert weiter.'};
  if(h>=17&&h<21) return {id:'coherent',why:'Feierabend: Stress abbauen, Puls und Atem in Takt bringen.'};
  return {id:'478',why:'Vor dem Schlafen: Puls senken und müde werden.'};
}
function brToday(){ const d=dayDoc(todayKey()); return d.breath||[]; }
function brWeek(){ const mon=mondayOf(new Date()); let n=0, sec=0; for(let i=0;i<7;i++){ const d=Store.get('d-'+addDays(mon,i)); (d&&d.breath||[]).forEach(x=>{ n++; sec+=x.sec||0; }); } return {n,sec}; }
