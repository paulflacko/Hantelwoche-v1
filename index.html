/* Ablauf */
function brSegs(m,v,len){
  const out=[]; let lv=.42;
  const push=(p,extra)=>{ const from=lv; let to=lv;
    if(p.k==='in') to=p.to||1; else if(p.k==='top') to=p.to||1; else if(p.k==='out') to=p.to||.42; else if(p.k==='prep') to=.42;
    out.push({...p,...(extra||{}),from,to}); lv=to; };
  push(BP('prep',m.whm?5:4,{h:m.whm?'Setz dich hin oder leg dich hin':'Bequem hinsetzen, Schultern locker'}));
  if(m.whm){ const B=m.vars[v].b;
    for(let r=0;r<len;r++){
      for(let b=0;b<B;b++){ push(BP('in',1.6,{to:.95,lab:'Tief ein',cnt:b+1,of:B,r,fast:1})); push(BP('out',1.4,{to:.55,lab:'Loslassen',cnt:b+1,of:B,r,fast:1})); }
      push(BP('out',2.5,{to:.34,lab:'Ausatmen',h:'Alles raus, dann halten',r}));
      push(BP('retain',null,{max:240,h:'Mit leerer Lunge entspannt halten. Wenn der Atemreiz kommt: tippen.',r}));
      push(BP('in',2.5,{to:1,lab:'Tief einatmen',r}));
      push(BP('hold',15,{lab:'Halten',h:'Volle Lunge, 15 s',r}));
      push(BP('out',3,{to:.5,lab:'Ausatmen',h:r<len-1?'Gleich beginnt die nächste Runde':'Loslassen',r}));
    }
    push(BP('free',45,{h:'Normal atmen und nachspüren'}));
    return out; }
  const pat=m.vars[v].pat, n=m.unit==='min'?Math.max(1,Math.round(len*60/brCyc(pat))):len;
  for(let c=0;c<n;c++) pat.forEach(p=>push(p,{c,of:n}));
  return out;
}
function brStart(id,v,len,key){
  const m=brMode(id); brSaveCfg({last:{[id]:{v,len}}});
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(_){}
  const segs=brSegs(m,v,len);
  UI.bp=null; UI.modal='breath';
  UI.br={id,v,len,key,segs,i:0,t0:performance.now(),paused:false,pauseAt:0,done:0,started:Date.now(),ret:[],end:false};
  keepAwake(true); renderBreath(); brCue(segs[0]); brLoop();
}
function brLoop(){ const b=UI.br; if(!b||b.end) return; brTick(); b.raf=requestAnimationFrame(brLoop); }
function brSeg(){ const b=UI.br; return b.segs[b.i]; }
function brElapsed(){ const b=UI.br; return ((b.paused?b.pauseAt:performance.now())-b.t0)/1000; }
function brAdvance(){
  const b=UI.br, s=brSeg(), el=brElapsed();
  if(s.k==='retain') b.ret.push(Math.round(el));
  b.done+=s.s==null?el:s.s; b.t0+=(s.s==null?el:s.s)*1000;
  b.i++;
  if(b.i>=b.segs.length){ brFinish(true); return false; }
  const n=brSeg(); if(n.k==='retain'||(s.k==='retain')||n.k==='free'||n.k==='prep'||s.k==='prep') renderBreath();
  brCue(n); return true;
}
function brTick(){
  const b=UI.br; if(!b||b.end) return;
  if(!b.paused){ let guard=0; while(guard++<200){ const s=brSeg(), el=brElapsed(), dur=s.s==null?s.max:s.s; if(el<dur) break; if(!brAdvance()) return; } }
  const s=brSeg(), el=Math.max(0,brElapsed()), dur=s.s==null?null:s.s, f=dur?Math.min(1,el/dur):0;
  const ease=x=>(1-Math.cos(Math.PI*x))/2;
  let lv=s.from+(s.to-s.from)*ease(f); if(s.k==='free') lv=.6+.18*Math.sin(el/5*Math.PI*2/1.6);
  const R=38+78*lv;
  const c=$('#brc'); if(c){ c.setAttribute('r',R.toFixed(1)); c.setAttribute('class','brcirc k-'+s.k+(s.hum?' hum':'')); }
  const ring=$('#brring'); if(ring){ ring.style.strokeDashoffset=String(754*(dur?1-f:0)); ring.setAttribute('class','brring k-'+s.k); }
  const lab=$('#brlab'), num=$('#brnum'), sub=$('#brsub');
  const L=s.lab||BR_KIND[s.k];
  if(lab&&lab.textContent!==L) lab.textContent=L;
  let N, S='';
  if(s.k==='retain'){ N=mmss(el); S='Runde '+(s.r+1); }
  else if(s.cnt){ N=String(s.cnt); S='von '+s.of; }
  else { N=String(Math.max(1,Math.ceil(dur-el))); S=''; }
  if(num&&num.textContent!==N) num.textContent=N; if(sub&&sub.textContent!==S) sub.textContent=S;
  const h=$('#brh'); if(h){ const H=s.h||''; if(h.textContent!==H) h.textContent=H; }
  const wv=$('#brwaves'); if(wv) wv.classList.toggle('on',!!s.hum&&!b.paused);
  const nose=$('#brnose'); if(nose){ const o=s.k==='hold'||s.k==='prep'?'':(s.open??''); nose.dataset.open=o; }
  const tot=$('#brtot'); if(tot){ const m=brMode(b.id), total=b.done+el;
    let T; if(m.whm){ T='Runde '+((s.r??0)+1)+' von '+b.len+' · '+mmss(total); }
    else { const all=b.segs.reduce((t,x)=>t+x.s,0); T='Noch '+mmss(all-total)+(s.of?' · Zyklus '+(s.c+1)+' von '+s.of:''); }
    if(tot.textContent!==T) tot.textContent=T; }
  const bar=$('#brprog'); if(bar){ const all=brMode(b.id).whm?null:b.segs.reduce((t,x)=>t+x.s,0); if(all) bar.style.width=Math.min(100,(b.done+el)/all*100)+'%'; }
}
function brTone(f1,f2,dur,vol){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t0=audioCtx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(f1,t0); o.frequency.linearRampToValueAtTime(f2,t0+dur); o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.12,t0+.08); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.05); }catch(e){}
}
function brCue(s){
  const set=brCfg().set; if(!s) return;
  if(set.tone){ const d=Math.min(1.2,Math.max(.25,(s.s||1)*.6));
    if(s.fast){ if(s.k==='in') brTone(392,523,.3,.06); }
    else if(s.k==='in'||s.k==='top') brTone(s.k==='top'?523:392,s.k==='top'?660:587,s.k==='top'?.4:d);
    else if(s.k==='out') brTone(587,392,d,.1);
    else if(s.k==='hold'||s.k==='rest'||s.k==='retain') brTone(494,494,.25,.08);
    else if(s.k==='free') brTone(523,784,.8,.1); }
  if(set.vib&&!s.fast){ try{ navigator.vibrate&&navigator.vibrate(s.k==='in'?60:s.k==='out'?[30,60,30]:25); }catch(e){} }
  if(set.voice&&!s.fast&&s.k!=='prep'&&window.speechSynthesis){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(s.lab||BR_KIND[s.k]); u.lang='de-DE'; u.rate=.95; u.volume=.8; speechSynthesis.speak(u); }catch(e){} }
}
function brNose(){ return `<svg id="brnose" class="brnose" viewBox="0 0 120 64" aria-hidden="true" data-open=""><path d="M60 4c-6 18-14 30-24 38-8 6-10 16 2 18h44c12-2 10-12 2-18C74 34 66 22 60 4z" fill="none" stroke="var(--line)" stroke-width="3"/><ellipse class="nl" cx="48" cy="52" rx="8" ry="5"/><ellipse class="nr" cx="72" cy="52" rx="8" ry="5"/><text x="20" y="58" class="nlt">L</text><text x="96" y="58" class="nrt">R</text></svg>`; }
function renderBreath(){
  const b=UI.br; if(!b){ $('#overlay').innerHTML=''; return; }
  const m=brMode(b.id);
  if(b.end){ renderBreathEnd(); return; }
  const s=brSeg(), set=brCfg().set;
  $('#overlay').innerHTML=`<div class="overlay brplayer"><div class="player">
    <div class="ov-head"><button class="iconbtn" data-act="brstop" aria-label="Beenden">✕</button><div class="grow"><h2>${esc(m.n)}</h2><div class="small muted" id="brtot"></div></div>
      <button class="iconbtn" data-act="brset" data-k="tone" aria-pressed="${!!set.tone}" aria-label="Ton ${set.tone?'ausschalten':'einschalten'}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>${set.tone?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M17 9l5 6M22 9l-5 6"/>'}</svg></button></div>
    ${m.whm?'':'<div class="brprogbar"><span id="brprog"></span></div>'}
    <div class="stage">

        <circle id="brring" class="brring" cx="140" cy="140" r="120" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="754" transform="rotate(-90 140 140)"/>
        <g id="brwaves" class="brwaves"><circle cx="140" cy="140" r="70"/><circle cx="140" cy="140" r="70"/><circle cx="140" cy="140" r="70"/></g>

        <text id="brlab" x="140" y="118" text-anchor="middle" class="brlab"></text>

      </svg>
      ${m.id==='nadi'?brNose():''}
      <p class="brh" id="brh" aria-live="polite"></p>
      ${s.k==='retain'?`<button class="btn primary brbig" data-act="brnext">Einatmen</button><p class="small muted">${b.ret.length?'Letzte Runde: '+mmss(b.ret[b.ret.length-1]):'Kein Wettkampf. Nur so lange, wie es angenehm ist.'}</p>`:''}
      ${s.k==='free'?'<p class="small muted">Gleich fertig. Bleib noch einen Moment sitzen.</p>':''}
    </div>
    <div class="controls">
      <button class="btn" data-act="brplay">${b.paused?'Weiter':'Pause'}</button>
      <button class="btn" data-act="brstop">Beenden</button>
    </div></div></div>`;
  brTick();
}
function brFinish(completed){
  const b=UI.br; if(!b) return; const el=b.paused?b.pauseAt:performance.now();
  const sec=Math.round(b.done+(completed?0:Math.max(0,(el-b.t0)/1000)));
  if(b.raf) cancelAnimationFrame(b.raf);
  try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
  b.end=true; b.sec=sec; b.completed=completed;
  if(sec>=30){ const k=todayKey(), d=dayDoc(k); d.breath=[...(d.breath||[]),{m:b.id,v:b.v,sec,at:Date.now(),...(b.ret.length?{ret:b.ret}:{})}];
    if(completed&&b.key) d.done[b.key]=true; saveDay(k,d); b.saved=true;
    if(b.onDone) b.onDone(sec); else if(sec>=60) skAuto('atem',{min:Math.round(sec/60),src:'breath',m:b.id}); }
  if(completed){ brTone(523,784,.9,.12); setTimeout(()=>brTone(659,988,.9,.1),250); try{ navigator.vibrate&&navigator.vibrate([80,60,80]); }catch(e){} }
  keepAwake(false); renderBreath();
}
function renderBreathEnd(){
  const b=UI.br, m=brMode(b.id), wk=brWeek();
  const cyc=b.segs.slice(0,b.i).filter((s,j)=>s.c!=null&&(!b.segs[j+1]||b.segs[j+1].c!==s.c)).length;
  $('#overlay').innerHTML=`<div class="overlay"><div class="player">
    <div class="ov-head"><button class="iconbtn" data-act="brclose" aria-label="Schließen">✕</button><div class="grow"><h2>${esc(m.n)}</h2></div></div>
    <div class="stage">
      <div class="phase rest">${b.completed?'Geschafft':'Beendet'}</div>
      <div class="clock" style="font-size:clamp(3.5rem,16vw,6rem)">${mmss(b.sec)}</div>
      <p class="muted">${m.whm?esc(b.ret.length+' '+(b.ret.length===1?'Runde':'Runden')):esc(cyc+' '+(cyc===1?'Atemzyklus':'Atemzyklen'))}${b.saved?' · gespeichert':' · unter 30 s, nicht gespeichert'}</p>
      ${b.ret.length?`<div class="card" style="min-width:240px"><div class="label">Luft angehalten</div><div class="brret">${b.ret.map((r,i)=>`<div><span class="small muted">Runde ${i+1}</span><b class="num">${mmss(r)}</b></div>`).join('')}</div><p class="small muted" style="margin-top:6px">Die Zeiten werden mit Übung meist länger. Es geht nicht um Rekorde.</p></div>`:''}
      ${b.key&&b.completed?`<p class="small" style="color:var(--good);font-weight:600">${esc((DAYS[new Date().getDay()].blocks.find(x=>x.key===b.key)||{n:'Eintrag'}).n)} abgehakt</p>`:''}
      <p class="small muted">Diese Woche: ${wk.n} ${wk.n===1?'Atemübung':'Atemübungen'} · ${Math.round(wk.sec/60)} min${b.saved&&b.sec>=60?' · zählt für den Skill Atemkontrolle':''}</p>
    </div>
    <div class="controls"><button class="btn" data-act="brpick">Andere Übung</button><button class="btn primary" data-act="brclose">Fertig</button></div>
  </div></div>`;
}

// Übungen aus Verhaltenstherapie (KVT), ACT, DBT-Skills, Achtsamkeit und Selbstmitgefühl, in eigenen Worten beschrieben.
// Selbsthilfe, kein Ersatz für Therapie. Quellen pro Übung, Übersicht in docs/quellen-und-lizenzen.md.
// Aufbau passt zur geplanten Wissenskarte (Säule 'geist'): id, n, kat, use, min, kurz, why, steps[{t,s}], form[], src, ev.
const PSY_KAT = {kvt:'Verhaltenstherapie (KVT)',act:'ACT',dbt:'DBT-Skills',acht:'Achtsamkeit',mitg:'Selbstmitgefühl',schlaf:'Schlaf',pos:'Positive Psychologie'};
const PSY_USE = {
  akut:{n:'Akut angespannt',d:'Puls hoch, Gedanken rasen, gleich platzt etwas'},
  gruebeln:{n:'Grübeln und Sorgen',d:'Gedanken drehen sich im Kreis'},
  angst:{n:'Angst und Unruhe',d:'Nervös, angespannt, etwas fühlt sich bedrohlich an'},
  tief:{n:'Stimmung tief',d:'Antriebslos, leer, alles ist zäh'},
  kritik:{n:'Selbstkritik',d:'Innere Stimme ist hart, nichts ist genug'},
  wut:{n:'Ärger',d:'Gereizt, kurz vor dem Ausrasten'},
  schlaf:{n:'Einschlafen',d:'Müde, aber der Kopf ist wach'},
  werte:{n:'Richtung und Motivation',d:'Was ist mir wichtig, wie fange ich an'},

const PSY_EV = BR_EV; // gleiche Einstufung wie bei den Atemübungen
const PS=(t,s)=>({t,s:s||0});
const PF=(k,l,type,ph)=>({k,l,type:type||'text',ph:ph||''});
const PSY = [
  // ---------- Akut ----------
  {id:'54321',n:'5-4-3-2-1 Erdung',kat:'acht',use:['akut','angst'],min:3,ev:'mittel',
   kurz:'Mit allen Sinnen zurück ins Hier und Jetzt.',
   why:'Lenkt die Aufmerksamkeit weg von Gedankenschleifen hin zu dem, was gerade wirklich da ist. Das Nervensystem bekommt das Signal: hier und jetzt ist es sicher.',
   steps:[PS('Füße fest auf den Boden stellen. Einmal lang ausatmen.',10),PS('Nenne 5 Dinge, die du siehst. Ruhig laut oder leise benennen.',35),PS('Nenne 4 Dinge, die du spürst: Stuhl, Kleidung, Luft, Boden.',30),PS('Nenne 3 Dinge, die du hörst.',30),PS('Nenne 2 Dinge, die du riechst (oder magst zu riechen).',20),PS('Nenne 1 Sache, die du schmeckst.',15),PS('Wie stark ist die Anspannung jetzt, von 0 bis 10? Kurz nachspüren.',15)],
   src:'Achtsamkeitsbasierte Erdungstechnik, verbreitet in der Traumatherapie und DBT. Beschreibung in eigenen Worten.'},
  {id:'stop',n:'STOP-Skill',kat:'dbt',use:['akut','wut'],min:1,ev:'mittel',
   kurz:'Vier Schritte, bevor du etwas tust, das du später bereust.',
   why:'Starke Gefühle drängen zu sofortigem Handeln. STOP schafft eine Lücke von wenigen Sekunden zwischen Impuls und Handlung.',
   steps:[PS('S wie Stopp: Erstarre kurz. Nichts sagen, nichts tun.',8),PS('T wie Tritt zurück: Ein Schritt weg von der Situation, einmal tief ausatmen.',12),PS('O wie Observieren: Was passiert gerade? In dir, um dich, bei den anderen?',25),PS('P wie Plan: Was bringt dich deinem Ziel näher? Erst dann handeln.',20)],
   src:'DBT-Skill aus dem Modul Stresstoleranz (M. Linehan, DBT Skills Training Manual). In eigenen Worten.'},
  {id:'tipp',n:'TIPP: Körper runterfahren',kat:'dbt',use:['akut','wut','angst'],min:5,ev:'mittel',
   kurz:'Wenn nichts mehr geht: über den Körper die Anspannung senken.',
   why:'Bei sehr hoher Anspannung kommt man mit Denken nicht weiter. Kälte im Gesicht aktiviert den Tauchreflex und senkt den Puls, Bewegung baut Stresshormone ab, langes Ausatmen und Muskelentspannung beruhigen.',
   steps:[PS('T wie Temperatur: Kaltes Wasser ins Gesicht oder einen kalten Waschlappen 20 bis 30 s auf Augen und Stirn, dabei die Luft anhalten.',30),PS('I wie Intensive Bewegung: 1 bis 2 Minuten schnell bewegen, z. B. Hampelmann, Treppe, Kniebeugen.',90),PS('P wie Paced Breathing: 4 s ein, 6 bis 8 s aus. Ausatmen ist länger als einatmen.',90),PS('P wie Progressive Entspannung: Fäuste, Schultern und Gesicht 5 s fest anspannen, dann loslassen. Zweimal.',30)],
   safe:'Kältereiz nicht bei Herzerkrankungen, niedrigem Puls oder Essstörung ohne ärztliche Rücksprache.',
   src:'DBT-Skill aus dem Modul Stresstoleranz (M. Linehan). In eigenen Worten.'},
  {id:'anker',n:'Anker werfen',kat:'act',use:['akut','angst','gruebeln'],min:3,ev:'mittel',
   kurz:'Gefühle wie ein Sturm: nicht wegmachen, sondern festen Stand finden.',
   why:'Statt gegen schwierige Gedanken anzukämpfen, verankerst du dich im Körper und in der Umgebung. Der Sturm darf weiterziehen, du bleibst handlungsfähig.',
   steps:[PS('Benennen: Was ist gerade da? „Ich bemerke Angst, Druck in der Brust, den Gedanken …“',20),PS('Körper spüren: Füße in den Boden drücken, Rücken aufrichten, Hände aneinander pressen.',25),PS('Umgebung: Schau dich um. Was siehst und hörst du? Wo bist du, was tust du gerade?',25),PS('Noch einmal: Gefühl benennen, Füße spüren, umschauen. Der Sturm ist da, und du bist auch da.',40),PS('Was willst du als Nächstes tun, das dir wichtig ist?',15)],
   src:'ACT-Übung „Dropping Anchor“ (R. Harris) und WHO-Leitfaden „Doing What Matters in Times of Stress“ (2020, CC BY-NC-SA 3.0 IGO). In eigenen Worten.'},
  {id:'benennen',n:'Gefühle benennen',kat:'dbt',use:['akut','wut','angst','tief'],min:2,ev:'stark',
   kurz:'Name it to tame it: Ein Gefühl genau zu benennen, macht es leiser.',
   why:'Studien mit Hirnbildgebung zeigen: Wer ein Gefühl in Worte fasst, beruhigt die Amygdala. Je genauer das Wort, desto besser (nicht nur „schlecht“, sondern z. B. „enttäuscht“ oder „übergangen“).',
   steps:[PS('Was fühlst du? Wähle ein Grundgefühl: Angst, Wut, Traurigkeit, Scham, Schuld, Ekel, Freude.',20),PS('Geht es genauer? Z. B. Wut: gereizt, frustriert, gekränkt, ungerecht behandelt.',25),PS('Wo im Körper spürst du es? Wie stark von 0 bis 10?',20),PS('Sag dir: „Da ist gerade … Das ist ein Gefühl, und Gefühle kommen und gehen.“',15)],
   form:[PF('gef','Gefühl, so genau wie möglich'),PF('st','Stärke 0–10','num'),PF('ausl','Was hat es ausgelöst?','area')],
   src:'DBT-Modul Emotionsregulation (M. Linehan); Affect-Labeling-Studien (Lieberman et al., 2007). In eigenen Worten.'},
  // ---------- Grübeln und Sorgen ----------
  {id:'protokoll',n:'Gedankenprotokoll',kat:'kvt',use:['gruebeln','tief','angst','kritik'],min:10,ev:'stark',
   kurz:'Einen belastenden Gedanken prüfen wie ein Detektiv.',
   why:'Nicht die Situation, sondern wie wir sie bewerten, bestimmt oft das Gefühl. Wer Gedanken aufschreibt und prüft, findet ausgewogenere Sichtweisen. Kernstück der kognitiven Verhaltenstherapie.',
   steps:[PS('Situation: Wann, wo, mit wem? Nur Fakten, wie eine Kamera.'),PS('Gedanke: Was ging dir durch den Kopf? Der Satz, der am meisten wehtut.'),PS('Gefühl: Welches Gefühl, wie stark (0 bis 100)?'),PS('Was spricht für den Gedanken? Nur Fakten.'),PS('Was spricht dagegen? Was würde eine gute Freundin sagen? Gab es Ausnahmen?'),PS('Ausgewogener Gedanke: Was ist eine faire, realistische Sicht?'),PS('Gefühl jetzt: Wie stark ist es noch (0 bis 100)?')],
   form:[PF('sit','Situation','area','Mo 14 Uhr, Meeting, Chef unterbricht mich'),PF('ged','Gedanke','area','„Ich mache alles falsch“'),PF('gef','Gefühl und Stärke 0–100','text','Scham 70'),PF('pro','Spricht dafür','area'),PF('con','Spricht dagegen','area'),PF('neu','Ausgewogener Gedanke','area'),PF('nach','Gefühl jetzt 0–100','num')],
   src:'Kognitive Therapie nach A. T. Beck, Spaltenprotokoll (z. B. Beck, „Kognitive Therapie der Depression“). In eigenen Worten.'},
  {id:'denkfallen',n:'Denkfallen erkennen',kat:'kvt',use:['gruebeln','kritik','angst','tief'],min:5,ev:'stark',
   kurz:'Typische Verzerrungen, in die jeder Kopf mal tappt.',
   why:'Wer die eigene Lieblings-Denkfalle kennt, erkennt sie schneller und kann gegensteuern. Hake an, was dir bekannt vorkommt.',
   steps:[PS('Schwarz-weiß: Alles oder nichts, perfekt oder versagt.'),PS('Katastrophisieren: Das Schlimmste annehmen („Das wird eine Katastrophe“).'),PS('Gedankenlesen: Wissen, was andere denken („Er hält mich für dumm“).'),PS('Wahrsagen: Die Zukunft negativ vorhersagen.'),PS('Verallgemeinern: „Immer“, „nie“, „jedes Mal“.'),PS('Muss-Sätze: „Ich muss“, „ich sollte“, „man darf nicht“.'),PS('Positives abwerten: „Das zählt nicht, war nur Glück.“'),PS('Gefühl als Beweis: „Ich fühle mich nutzlos, also bin ich es.“'),PS('Etikettieren: „Ich bin ein Versager“ statt „Das hat nicht geklappt“.'),PS('Personalisieren: Alles auf sich beziehen, Schuld bei sich suchen.')],
   form:[PF('falle','Meine häufigste Denkfalle'),PF('bsp','Beispiel aus dieser Woche','area'),PF('gegen','Was sage ich mir das nächste Mal stattdessen?','area')],
   src:'Kognitive Verzerrungen nach A. T. Beck und D. Burns. In eigenen Worten.'},
  {id:'sorgenzeit',n:'Sorgenzeit',kat:'kvt',use:['gruebeln','schlaf','angst'],min:15,ev:'mittel',
   kurz:'Sorgen bekommen einen festen Termin, statt den ganzen Tag zu stören.',
   why:'Wer Sorgen tagsüber aufschiebt und gesammelt zu einer festen Zeit bearbeitet, grübelt in Studien weniger. Der Kopf lernt: Dafür gibt es später Raum.',
   steps:[PS('Lege eine feste Zeit fest, täglich 15 min, nicht kurz vor dem Schlafen (z. B. 18 Uhr).'),PS('Tagsüber: Kommt eine Sorge, schreib sie kurz auf und sag dir „Später, um 18 Uhr“.'),PS('In der Sorgenzeit: Liste durchgehen. Ist die Sorge lösbar? Dann einen ersten Schritt notieren.',300),PS('Nicht lösbar? Anerkennen: „Das kann ich nicht ändern.“ Gedanke darf da sein.',240),PS('Nach 15 min Schluss, bewusst etwas anderes tun, z. B. Spaziergang oder Kochen.',60)],
   form:[PF('sorge','Sorge','area'),PF('loes','Lösbar? Erster Schritt','area')],
   src:'Stimuluskontrolle für Sorgen (T. D. Borkovec et al., 1983); Bestandteil vieler KVT-Programme. In eigenen Worten.'},
  {id:'problem',n:'Problemlösen in 6 Schritten',kat:'kvt',use:['gruebeln','tief','werte'],min:15,ev:'stark',
   kurz:'Vom Grübeln ins Handeln: ein Problem strukturiert angehen.',
   why:'Grübeln fühlt sich an wie Nachdenken, bringt aber nichts voran. Strukturiertes Problemlösen ist gut untersucht und Teil des WHO-Programms „Problem Management Plus“.',
   steps:[PS('Problem genau beschreiben: Was genau ist das Problem, und was davon kann ich beeinflussen?'),PS('Ideen sammeln: Alles aufschreiben, auch Unsinniges. Noch nicht bewerten.'),PS('Ideen bewerten: Vor- und Nachteile, was ist machbar?'),PS('Eine Lösung wählen, oder eine Kombination.'),PS('Planen: Was genau, wann, wo, wer hilft? Erster Schritt so klein, dass er sicher klappt.'),PS('Ausprobieren und später prüfen: Hat es geholfen? Sonst nächste Idee.')],
   form:[PF('prob','Problem','area'),PF('ideen','Ideen','area'),PF('wahl','Gewählte Lösung','area'),PF('schritt','Erster Schritt (was, wann)','area')],
   src:'Problemlösetraining (D’Zurilla und Goldfried); WHO „Problem Management Plus“ (2016, CC BY-NC-SA 3.0 IGO). In eigenen Worten.'},
  {id:'defusion',n:'Abstand zu Gedanken',kat:'act',use:['gruebeln','kritik','angst'],min:3,ev:'mittel',
   kurz:'„Ich habe den Gedanken, dass …“ – Gedanken sind Gedanken, keine Tatsachen.',
   why:'Defusion heißt: Du schaust auf deine Gedanken statt durch sie hindurch. Der Inhalt bleibt, aber er verliert an Macht. Kernstück der Akzeptanz- und Commitment-Therapie.',
   steps:[PS('Nimm den Gedanken, der dich gerade am meisten plagt. Sag ihn dir innerlich: „Ich bin nicht gut genug.“',15),PS('Jetzt: „Ich habe den Gedanken, dass ich nicht gut genug bin.“',15),PS('Und: „Ich bemerke, dass ich den Gedanken habe, dass ich nicht gut genug bin.“',15),PS('Was hat sich verändert? Meist entsteht ein kleiner Abstand.',15),PS('Variante: Sag den Gedanken innerlich mit Micky-Maus-Stimme oder singe ihn zu „Happy Birthday“.',30),PS('Bedank dich bei deinem Kopf: „Danke, Kopf, für den Hinweis.“ Und mach weiter mit dem, was dir wichtig ist.',15)],
   src:'Kognitive Defusion (S. C. Hayes, ACT; R. Harris, „Wer dem Glück hinterherrennt, läuft daran vorbei“). In eigenen Worten.'},
  {id:'blaetter',n:'Blätter auf dem Fluss',kat:'act',use:['gruebeln','angst','schlaf'],min:6,ev:'mittel',
   kurz:'Geführte Vorstellung: Gedanken kommen und ziehen vorbei.',
   why:'Übt, Gedanken zu bemerken, ohne sich in sie hineinziehen zu lassen. Abschweifen gehört dazu, das Zurückkommen ist die eigentliche Übung.',
   steps:[PS('Setz oder leg dich bequem hin, Augen zu oder Blick zum Boden. Ein paar ruhige Atemzüge.',30),PS('Stell dir einen Bach vor. Blätter treiben langsam auf dem Wasser vorbei.',30),PS('Jeder Gedanke, der auftaucht, kommt auf ein Blatt. Ob Wort, Bild oder Gefühl. Lass es vorbeitreiben.',90),PS('Wenn du merkst, dass du mitgegangen bist: Kein Problem. Gedanke aufs Blatt, zurück ans Ufer.',90),PS('Weiter so. Du musst nichts festhalten und nichts wegschieben.',60),PS('Langsam zurückkommen: Atem spüren, Finger bewegen, Augen öffnen.',20)],
   src:'ACT-Übung „Leaves on a Stream“ (S. C. Hayes et al.). In eigenen Worten.'},
  {id:'raum',n:'Einem Gefühl Raum geben',kat:'act',use:['angst','tief','akut'],min:5,ev:'mittel',
   kurz:'Statt dagegen zu kämpfen: das Gefühl neugierig anschauen und Platz machen.',
   why:'Unangenehme Gefühle wegzudrücken macht sie oft stärker. Akzeptanz heißt nicht gutheißen, sondern aufhören zu kämpfen. Dann wird das Gefühl meist kleiner.',
   steps:[PS('Wo im Körper spürst du das Gefühl am stärksten? Brust, Bauch, Hals?',30),PS('Beschreibe es wie ein Forscher: Größe, Form, Temperatur, bewegt es sich?',40),PS('Atme in das Gefühl hinein, als ob sich um es herum Raum öffnet.',60),PS('Sag dir: „Ich muss es nicht mögen. Ich kann Platz dafür machen.“',30),PS('Leg eine Hand auf die Stelle. Wie fühlt es sich jetzt an?',40)],
   src:'ACT-Übung „Expansion“ (R. Harris); WHO „Doing What Matters in Times of Stress“ (2020, CC BY-NC-SA 3.0 IGO). In eigenen Worten.'},
  // ---------- Stimmung tief ----------
  {id:'aktiv',n:'Aktivitäten planen',kat:'kvt',use:['tief','werte'],min:10,ev:'stark',
   kurz:'Erst handeln, dann kommt die Lust: kleine angenehme und sinnvolle Dinge einplanen.',
   why:'Bei gedrückter Stimmung zieht man sich zurück, das macht die Stimmung noch schlechter. Verhaltensaktivierung durchbricht den Kreis und wirkt in Studien ähnlich gut wie andere Therapieformen.',
   steps:[PS('Schreib 3 Dinge auf, die dir früher gutgetan haben (Freude) und 3, die dir wichtig sind (Sinn).'),PS('Wähle eine Sache für heute oder morgen. So klein, dass sie sicher klappt: 10 min Spaziergang statt Joggen.'),PS('Leg einen festen Zeitpunkt fest, wie einen Termin.'),PS('Vorher: Stimmung 0 bis 10 notieren.'),PS('Machen, auch ohne Lust. Die Lust kommt oft erst beim Tun.'),PS('Nachher: Stimmung 0 bis 10 notieren. Was hat sich verändert?')],
   form:[PF('akt','Aktivität'),PF('wann','Wann?'),PF('vor','Stimmung vorher 0–10','num'),PF('nach','Stimmung nachher 0–10','num')],
   src:'Verhaltensaktivierung (P. Lewinsohn; C. Martell, N. Jacobson); Wirksamkeit z. B. Cuijpers et al., 2007. In eigenen Worten.'},
  {id:'gegenteil',n:'Entgegengesetzt handeln',kat:'dbt',use:['tief','angst','wut'],min:3,ev:'mittel',
   kurz:'Wenn ein Gefühl nicht zur Situation passt: das Gegenteil von dem tun, wozu es drängt.',
   why:'Jedes Gefühl hat einen Handlungsdrang: Angst will vermeiden, Traurigkeit will sich zurückziehen, Wut will angreifen. Das Gegenteil zu tun, verändert das Gefühl mit der Zeit.',
   steps:[PS('Welches Gefühl ist da, und wozu drängt es dich?',20),PS('Passt das Gefühl zu den Fakten, oder ist es zu stark oder unpassend?',20),PS('Wenn es nicht passt: Was wäre das Gegenteil? Angst: hingehen. Traurigkeit: aktiv werden, Kontakt suchen. Wut: freundlich bleiben, sanft sprechen, Abstand nehmen.',30),PS('Ganz machen, auch Körperhaltung, Stimme und Gesichtsausdruck.',20)],
   form:[PF('gef','Gefühl und Drang'),PF('tat','Was habe ich stattdessen getan?','area'),PF('wirk','Wie war es danach?','area')],
   src:'DBT-Skill „Opposite Action“ aus dem Modul Emotionsregulation (M. Linehan). In eigenen Worten.'},
  {id:'dreigut',n:'Drei gute Dinge',kat:'pos',use:['tief','alltag','schlaf'],min:5,ev:'mittel',
   kurz:'Abends drei Dinge notieren, die gut waren, und warum.',
   why:'Trainiert den Blick für Positives, das der Kopf sonst schnell übersieht. In Studien hob es die Stimmung über Wochen, wenn man es eine Woche lang täglich macht.',
   steps:[PS('Denk an heute. Was ist gut gelaufen, auch klein? Ein Kaffee, ein Satz, ein geschaffter Satz im Training.'),PS('Schreib drei Dinge auf.'),PS('Zu jedem: Warum ist es passiert? Was war dein Anteil?')],
   form:[PF('g1','1. Gut war …'),PF('g2','2. Gut war …'),PF('g3','3. Gut war …'),PF('warum','Warum ist es passiert?','area')],
   src:'„Three Good Things“ (M. Seligman et al., 2005, American Psychologist). In eigenen Worten.'},
  // ---------- Selbstkritik ----------
  {id:'mitgefuehl',n:'Selbstmitgefühls-Pause',kat:'mitg',use:['kritik','tief','akut'],min:3,ev:'mittel',
   kurz:'Drei Sätze für dich, wenn es gerade schwer ist.',
   why:'Mit sich selbst so freundlich zu sein wie mit einem guten Freund senkt Stress und Selbstkritik, ohne die Motivation zu verlieren. Gut untersucht in der Forschung zu Selbstmitgefühl.',
   steps:[PS('Denk an die Situation, die dich gerade belastet. Spür, wo es im Körper sitzt.',20),PS('Achtsamkeit: Sag dir „Das ist gerade ein Moment von Schmerz“ oder „Das tut weh“.',20),PS('Verbundenheit: „Schwierige Momente gehören zum Leben. Anderen geht es auch so.“',20),PS('Freundlichkeit: Hand aufs Herz. „Möge ich freundlich zu mir sein. Was brauche ich jetzt?“',40),PS('Was würdest du einem guten Freund in dieser Lage sagen? Sag es dir selbst.',30)],
   src:'„Self-Compassion Break“ (K. Neff, C. Germer, Mindful Self-Compassion). In eigenen Worten.'},
  {id:'freund',n:'Mit den Augen eines Freundes',kat:'kvt',use:['kritik','tief'],min:5,ev:'mittel',
   kurz:'Die harte innere Stimme gegen eine faire Stimme tauschen.',
   why:'Wir sind zu uns selbst oft viel strenger als zu anderen. Die Freundes-Perspektive macht Doppelstandards sichtbar.',
   steps:[PS('Schreib auf, was deine innere Kritik gerade sagt, wörtlich.'),PS('Stell dir vor, ein guter Freund erzählt dir genau das über sich. Was würdest du ihm antworten?'),PS('Schreib diese Antwort auf und lies sie dir einmal laut vor.'),PS('Was ist ein kleiner, freundlicher nächster Schritt für dich?')],
   form:[PF('krit','Meine innere Kritik sagt','area'),PF('fr','Ein Freund bekäme von mir zu hören','area'),PF('schritt','Kleiner nächster Schritt')],
   src:'Doppelstandard-Technik der kognitiven Therapie (D. Burns); Compassion Focused Therapy (P. Gilbert). In eigenen Worten.'},
  {id:'akzeptanz',n:'Radikale Akzeptanz',kat:'dbt',use:['wut','tief'],min:4,ev:'mittel',
   kurz:'Was nicht zu ändern ist, ganz annehmen, damit aus Schmerz kein Leiden wird.',
   why:'Gegen die Realität anzukämpfen kostet Kraft und hält das Leid am Leben. Akzeptieren heißt nicht gutheißen, sondern anerkennen, was ist, damit du wieder handeln kannst.',
   steps:[PS('Was genau kannst du nicht ändern? Benenne es so sachlich wie möglich.',30),PS('Bemerk, wo du dagegen ankämpfst: „Das darf nicht sein“, „Das ist unfair“.',30),PS('Sag dir langsam: „Es ist, wie es ist. Ich kann es nicht ändern. Ich kann entscheiden, wie ich damit umgehe.“',30),PS('Entspann Gesicht und Hände, Handflächen nach oben. Körperlich loslassen.',30),PS('Was ist der nächste sinnvolle Schritt?',20)],
   src:'DBT-Skill „Radical Acceptance“ aus dem Modul Stresstoleranz (M. Linehan). In eigenen Worten.'},
  // ---------- Werte und Motivation ----------
  {id:'werte',n:'Werte-Kompass',kat:'act',use:['werte','tief'],min:10,ev:'mittel',
   kurz:'Was ist dir wirklich wichtig, und was ist ein kleiner Schritt in die Richtung?',
   why:'Ziele kann man erreichen, Werte nicht, sie geben die Richtung. Wer nach eigenen Werten handelt, hält schwierige Gefühle besser aus. Passt gut zur Skillbank.',
   steps:[PS('Geh die Bereiche durch: Gesundheit und Körper, Beziehungen, Arbeit und Lernen, Freizeit, Persönliches Wachstum.'),PS('Für jeden Bereich: Was für ein Mensch möchtest du dort sein? Ein bis zwei Worte (z. B. „verlässlich“, „neugierig“).'),PS('Wie wichtig ist dir der Bereich (0 bis 10)? Wie sehr lebst du gerade danach (0 bis 10)?'),PS('Wähle den Bereich mit dem größten Abstand.'),PS('Ein Schritt diese Woche, der zu deinem Wert passt. Konkret und klein.')],
   form:[PF('bereich','Bereich'),PF('wert','Mein Wert dort'),PF('abst','Wichtig / gelebt (0–10)','text','9 / 4'),PF('schritt','Mein Schritt diese Woche','area')],
   src:'Werte-Arbeit der ACT (S. C. Hayes; „Valued Living Questionnaire“, K. Wilson). In eigenen Worten.'},
  {id:'wenndann',n:'Wenn-dann-Plan',kat:'kvt',use:['werte','alltag'],min:5,ev:'stark',
   kurz:'Vorsätze, die wirklich halten: „Wenn X passiert, dann mache ich Y.“',
   why:'Wenn-dann-Pläne verknüpfen ein Vorhaben mit einer festen Situation. In vielen Studien verdoppeln sie die Chance, dass man es wirklich tut.',
   steps:[PS('Was willst du regelmäßig tun? (z. B. Atemübung, Dehnen, Lesen)'),PS('Welche Situation gibt es täglich sicher? (nach dem Zähneputzen, wenn ich den Laptop zuklappe)'),PS('Formuliere: „Wenn ich …, dann …“'),PS('Was könnte dazwischenkommen? Plane auch dafür: „Wenn ich keine Lust habe, dann mache ich nur 2 Minuten.“')],
   form:[PF('plan','Wenn …, dann …','area'),PF('notfall','Wenn etwas dazwischenkommt, dann …','area')],
   src:'Implementation Intentions (P. M. Gollwitzer; Meta-Analyse Gollwitzer und Sheeran, 2006). In eigenen Worten.'},
  // ---------- Schlaf und Entspannung ----------
  {id:'pmr',n:'Progressive Muskelentspannung',kat:'acht',use:['schlaf','akut','alltag'],min:10,ev:'stark',

function psyStart(){ const P=UI.psy, p=psyById(P.sel); P.run={i:0,t0:Date.now(),end:0,paused:false,left:0}; psyStep(0); renderPsyRun(); }
function psyStep(i){ const R=UI.psy.run, p=psyById(UI.psy.sel); R.i=i; const s=p.steps[i]; R.end=s&&s.s?Date.now()+s.s*1000:0; R.paused=false; clearInterval(psyStep.iv); psyStep.iv=setInterval(psyTick,250); }
function psyTick(){ const P=UI.psy; if(UI.modal!=='psy'||!P||!P.run){ clearInterval(psyStep.iv); return; } const R=P.run; if(R.paused||!R.end) return;
  const left=(R.end-Date.now())/1000, el=$('#psyt'); if(el) el.textContent=mmss(left); const bar=$('#psybar'); const s=psyById(P.sel).steps[R.i]; if(bar&&s.s) bar.style.width=Math.min(100,100-left/s.s*100)+'%';
  if(left<=0){ beep(660,.18,1); psyNext(); } }
function psyNext(){ const P=UI.psy, p=psyById(P.sel), R=P.run; if(R.i+1>=p.steps.length){ psyFinish(); return; } psyStep(R.i+1); renderPsyRun(); }
function psyFinish(){ const P=UI.psy, R=P.run; clearInterval(psyStep.iv); psySave({id:P.sel,sec:Math.round((Date.now()-R.t0)/1000)}); P.run=null; P.doneMsg=true; toast('Eingetragen. Gut gemacht.'); renderPsyDetail(true); }
function renderPsyRun(){ const P=UI.psy, p=psyById(P.sel), R=P.run, s=p.steps[R.i];

  <div class="ov-body" style="align-items:center;text-align:center">
    <div class="psydots" aria-hidden="true">${p.steps.map((_,j)=>`<i class="${j<R.i?'on':j===R.i?'cur':''}"></i>`).join('')}</div>
    <p class="psytext">${esc(s.t)}</p>
    ${s.s?`<div class="psytime num" id="psyt" aria-live="off">${mmss(left)}</div><div class="psyprog"><i id="psybar" style="width:${Math.min(100,100-left/s.s*100)}%"></i></div>`:'<p class="small muted">Nimm dir die Zeit, die du brauchst.</p>'}
    <div class="row" style="justify-content:center">${R.i?'<button class="btn" data-act="psyprev">Zurück</button>':''}${s.s?`<button class="btn" data-act="psypause">${R.paused?'Weiter':'Pause'}</button>`:''}<button class="btn primary" data-act="psynext">${R.i+1>=p.steps.length?'Fertig':'Nächster Schritt'}</button></div>
  </div></div>`; }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act; if(!/^psy/.test(a)) return;
  const P=UI.psy;
  switch(a){
    case 'psyopen': openPsy(t.dataset.id,t.dataset.u); break;
    case 'psyuse': P.use=t.dataset.u||null; renderPsy(); break;
    case 'psykat': P.kat=t.dataset.k||null; renderPsy(); break;
    case 'psysel': P.sel=t.dataset.id; renderPsy(true); break;
    case 'psyback': P.sel=null; renderPsy(true); break;
    case 'psypast': P.past=!P.past; renderPsy(); break;
    case 'psyrun': psyStart(); break;
    case 'psynext': psyNext(); break;
    case 'psyprev': if(P.run.i>0){ psyStep(P.run.i-1); renderPsyRun(); } break;
    case 'psypause': { const R=P.run; if(R.paused){ R.end=Date.now()+R.left*1000; R.paused=false; } else { R.left=Math.max(0,(R.end-Date.now())/1000); R.paused=true; } renderPsyRun(); break; }
    case 'psystop': clearInterval(psyStep.iv); P.run=null; renderPsyDetail(true); break;
    case 'psydone': psySave({id:P.sel}); toast('Eingetragen'); renderPsyDetail(); break;
  }
});

/* Meditation: geführte Abläufe pro Stufe */
function medScript(lvl,min){
  const sec=Math.max(3,min)*60, R=(n,s,note)=>S(n,Math.round(s),null,note,'rest');
  const open=R('Ankommen',60,'Aufrecht und bequem sitzen, Augen schließen. Drei tiefe Atemzüge, dann den Atem einfach laufen lassen.');
  const close=R('Abschluss',45,'Atem wieder vertiefen, Finger bewegen. Kurz nachspüren: Wie fühlst du dich jetzt?');
  const mid=sec-105;
  if(lvl===0) return [open,R('Atemanker',mid,'Spür den Atem an der Nase oder am Bauch. Wenn Gedanken kommen: bemerken und freundlich zurück zum Atem. Das Zurückkommen ist die Übung.'),close];
  if(lvl===1){ const parts=['Füße','Unterschenkel und Knie','Oberschenkel','Becken und Bauch','Brust und Rücken','Schultern und Arme','Hände','Nacken, Gesicht und Kopf'];
    return [open,...parts.map(p=>R('Body-Scan: '+p,mid/parts.length,'Aufmerksamkeit hinlenken, wahrnehmen was da ist: Wärme, Kribbeln, Druck oder nichts. Nichts verändern.')),close]; }
  if(lvl===2) return [open,R('Atemzüge zählen',mid*.6,'Beim Ausatmen zählen: eins bis zehn, dann von vorn. Verzählt? Bei eins neu beginnen, ohne Urteil.'),R('Gedanken benennen',mid*.4,'Ohne Zählen. Taucht ein Gedanke auf, kurz benennen: „Planen“, „Erinnern“, „Bewerten“. Dann zurück zum Atem.'),close];
  if(lvl===3){ const p=[['Für dich','Leise wiederholen: Möge ich gesund sein. Möge ich zufrieden sein. Möge ich mit Leichtigkeit leben.'],['Für einen nahen Menschen','Stell dir jemanden vor, der dir gut tut. Möge es dir gut gehen …'],['Für einen neutralen Menschen','Jemand aus dem Alltag, den du kaum kennst. Möge es dir gut gehen …'],['Für einen schwierigen Menschen','Wenn es passt. Sonst wieder zu dir selbst. Möge es dir gut gehen …'],['Für alle','Alle Menschen, alle Lebewesen. Mögen alle gesund und zufrieden sein.']];
    return [open,...p.map(([n,t])=>R('Mitgefühl: '+n,mid/p.length,t)),close]; }
  if(lvl===4){ const p=[['Atem',.2,'Den Atem spüren, wo er am deutlichsten ist.'],['Geräusche',.2,'Geräusche kommen und gehen lassen, ohne sie zu benennen.'],['Körper',.2,'Empfindungen im ganzen Körper wahrnehmen.'],['Gedanken',.2,'Gedanken wie Wolken vorbeiziehen sehen. Du bist der Himmel.'],['Offenes Gewahrsein',.2,'Nichts festhalten. Alles darf da sein.']];
    return [open,...p.map(([n,f,t])=>R(n,mid*f,t)),close]; }
  return [R('Stille Sitzung',sec,'Nur du und der Atem. Der Gong kommt am Ende.')];
}

function bodyKg(){ const bw=[...(prof().bw||[])].sort((a,b)=>a.d<b.d?-1:1); return bw.length?+bw[bw.length-1].kg:66; }

const e1rm=(kg,r)=>(+kg||0)*(1+Math.min(+r||0,12)/30);

/* Fortschritt zur nächsten Stufe: pct 0..1, best als Text, pass */
function skProg(sk,d,li){
  const L=sk.lv[li]; if(!L) return {pct:1,pass:true,bestTxt:''};
  const t=L.test, logs=d.log.filter(x=>x.lvl===li), cl=v=>Math.max(0,Math.min(1,v));
  if(t.type==='reps'||t.type==='hold'){ const vals=logs.map(x=>+(x.res&&x.res.v)).filter(v=>v>0); const best=vals.length?Math.max(...vals):0;
    return {pct:cl(best/t.target),pass:best>=t.target,bestTxt:best?(t.type==='hold'?secTxt(best):best+' Wdh.'):''}; }
  if(t.type==='cm'){ const vals=logs.map(x=>x.res&&x.res.v).filter(v=>v!==''&&v!=null&&!isNaN(+v)).map(Number); if(!vals.length) return {pct:0,pass:false,bestTxt:''};
    const best=Math.min(...vals), from=Math.max(t.from,vals[0]); return {pct:from===t.target?1:cl((from-best)/(from-t.target)),pass:best<=t.target,bestTxt:best+' cm'}; }
  if(t.type==='kg'||t.type==='kgbw'){ const tk=skTargetKg(t), base=t.add?bodyKg():0; let best=null, bv=0, pass=false;
    logs.forEach(x=>{ const r=x.res||{}; if(r.kg===''||r.kg==null) return; const kg=+r.kg, reps=+r.reps||1, v=e1rm(base+kg,reps); if(v>bv){ bv=v; best=r; } if(kg>=tk&&reps>=t.reps) pass=true; });
    return {pct:pass?1:cl(bv/e1rm(base+tk,t.reps)),pass,bestTxt:best?(t.add?'+':'')+fmtNum(best.kg,2)+' kg × '+(best.reps||1):''}; }
  if(t.type==='sess'){ const q=logs.filter(x=>(x.min||0)>=t.min&&(t.max==null||(x.dist||0)<=t.max)).length; return {pct:cl(q/t.target),pass:q>=t.target,bestTxt:q+' von '+t.target}; }
  if(t.type==='book'){ const n=booksDone(); return {pct:cl(n/t.target),pass:n>=t.target,bestTxt:n+' von '+t.target}; }
  return {pct:0,pass:false,bestTxt:''};
}
function skStats(d){

  const lvlName=l28.length>=8?'intensiv':l28.length>=4?'regelmäßig':l28.length>=1?'locker':'ruht';
  return {n:d.log.length,min,l28:l28.length,weeks,last,lvlName,lv:l28.length>=8?3:l28.length>=4?2:l28.length>=1?1:0};
}

function skLog(id,entry){

function ckNext(step,a){
  const order=['rec','cause','sick','sleep','sore','areas','pain','stress','motiv','result'];
  const skip={cause:()=>!(a.rec<=2),sick:()=>!(a.cause||[]).includes('krank'),areas:()=>!(a.sore>0),pain:()=>a.sore!==3};
  let i=order.indexOf(step)+1; while(i<order.length&&skip[order[i]]&&skip[order[i]]()) i++; return order[i]||'result';
}
function ckGet(k){ const d=Store.get('d-'+(k||todayKey())); return d&&d.check||null; }
function ckHist(n){ const out=[]; for(let i=n-1;i>=0;i--){ const k=addDays(todayKey(),-i), c=ckGet(k); out.push({k,c}); } return out; }
function ckBase(){ const v=[]; for(let i=1;i<=21;i++){ const c=ckGet(addDays(todayKey(),-i)); if(c&&+c.rhr) v.push(+c.rhr); } if(v.length<3) return null; v.sort((a,b)=>a-b); return v[Math.floor(v.length/2)]; }
function ckScore(a){
  const why=[]; let s=0;
  s+=(a.rec-1)/4*35;
  if(a.sleep!=null&&a.sleep!==''){ const h=+a.sleep; s+=Math.max(0,Math.min(1,(h-5)/3))*20; if(h<6) why.push('kurzer Schlaf ('+fmtNum(h,2)+' h)'); }
  else s+=(a.cause||[]).includes('schlaf')?6:13;
  s+=[15,11,5,0][a.sore||0]; if(a.sore>=2) why.push(a.sore===3?'Schmerz':'deutlicher Muskelkater');
  s+=(5-a.stress)/4*15; if(a.stress>=4) why.push('hoher Stress');
  s+=(a.motiv-1)/4*15; if(a.motiv<=2) why.push('wenig Lust');
  if(a.rec<=2) why.unshift(a.rec===1?'sehr müde':'müde');
  const base=ckBase(); if(base&&+a.rhr){ const dif=+a.rhr-base; if(dif>=7){ s-=12; why.push('Ruhepuls '+dif+' über deinem Schnitt'); } else if(dif>=4){ s-=6; why.push('Ruhepuls leicht erhöht'); } }
  let score=Math.round(Math.max(0,Math.min(100,s))), L=score>=60?'g':score>=30?'y':'r';
  const sick=(a.cause||[]).includes('krank');
  if(sick&&a.sick==='koerper'){ L='r'; why.unshift('Beschwerden im Körper'); }
  else if(sick&&L==='g'){ L='y'; why.unshift('leichte Erkältung'); }
  if(a.sore===3&&a.pain==='ja'&&L==='g') L='y';
  if(a.rec===1&&L==='g') L='y';
  return {score,light:L,why};
}

/* ---------- Lesen: Bücher und Timer ---------- */
function readStats(){
  const d=skDoc('lesen'), wk=mondayOf(new Date()), logs=d.log.filter(x=>x.src==='read'||x.min);
  const week=logs.filter(x=>x.d>=wk).reduce((a,x)=>a+(+x.min||0),0);
  const days=new Set(logs.filter(x=>(x.min||0)>=1).map(x=>x.d)); let streak=0, k=todayKey(); if(!days.has(k)) k=addDays(k,-1); while(days.has(k)){ streak++; k=addDays(k,-1); }
  const pages=logs.reduce((a,x)=>a+(+x.pages||0),0);
  return {week,streak,pages,books:booksDone()};
}

  cfg(){ const d=this.defaults(); let c={}; try{ c=JSON.parse(localStorage.getItem(this.KEY)||'{}')||{}; }catch(e){}
    const types={}; for(const k in d.types) types[k]={...d.types[k],...((c.types||{})[k]||{})}; return {...d,...c,types}; },
  save(c){ try{ localStorage.setItem(this.KEY,JSON.stringify(c)); }catch(e){} },
  ledger(){ try{ return JSON.parse(localStorage.getItem(this.LKEY)||'null')||{topic:'',items:{}}; }catch(e){ return {topic:'',items:{}}; } },
  saveLedger(L){ try{ localStorage.setItem(this.LKEY,JSON.stringify(L)); }catch(e){} },
  newTopic(){ const a='abcdefghijkmnpqrstuvwxyz23456789', r=new Uint8Array(20); crypto.getRandomValues(r); return 'hantelwoche-'+Array.from(r,x=>a[x%a.length]).join(''); },

  hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))|0; return (h>>>0).toString(36); },
  async publish(c,m){

function goLink(){
  const m=/[#&]go=([^&]+)/.exec(location.hash||''); if(!m) return; const g=decodeURIComponent(m[1]);
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(UI.session||UI.guide||(UI.br&&!UI.br.end)) return;
  UI.modal=null; $('#overlay').innerHTML='';
  if(g==='check'){ UI.tab='home'; render(); if(ckGet()){ UI.ck={step:'view',hist:[],a:{}}; UI.modal='ck'; renderCk(); } else ckStart(); }
  else if(g.startsWith('skill:')){ UI.tab='skills'; render(); if(skById(g.slice(6))) skOpen(g.slice(6)); }
  else if(g==='ntfy'){ render(); openNtfy(); }

  window.scrollTo(0,0);
}

      ${GitSync.on()?`<p class="small" style="margin-top:8px;color:${GitSync.err?'var(--amber)':'var(--good)'}">${GitSync.err?esc('Fehler: '+GitSync.err):GitSync.last?'Zuletzt abgeglichen um '+GitSync.last.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'Noch nicht abgeglichen'}</p>`:''}
    </div>`; })()}
    <div id="dangerzone" class="row"><button class="btn ghost small" data-act="askwipe">Alle Daten löschen…</button></div>
  </section></div></div>`;
}

document.addEventListener('toggle',e=>{ const d=e.target; if(d.classList&&d.classList.contains('tips')&&d.closest('.stage')) UI.tipsOpen=d.open; },true);
document.addEventListener('change',e=>{
  const t=e.target, a=t.dataset.act, k=todayKey();
  if(a==='done'){ const d=dayDoc(k); d.done[t.dataset.key]=t.checked; saveDay(k,d); render(); }
  else if(a==='supp'){ const d=dayDoc(k); d.supps[t.dataset.k]=t.checked; saveDay(k,d); render(); }
  else if(a==='meal'){ const d=dayDoc(k), i=+t.dataset.i; d.meals=(d.meals||[]).filter(x=>x!==i); if(t.checked) d.meals.push(i); saveDay(k,d); render(); }
  else if(a==='sleep'||a==='steps'){ const d=dayDoc(k); d[a]=t.value===''?null:+t.value; saveDay(k,d); }
  else if(a==='warm'){ const s=sessObj(); s.warm[t.dataset.i]=t.checked; saveSess(s); renderSession(); }
  else if(a==='setv'){ const s=sessObj(), x=s.sets[t.dataset.g][+t.dataset.i]; x[t.dataset.f]=t.value; if(t.dataset.f==='kg') x.tot=totalKg(EX[s.exmap[t.dataset.g]],t.value); saveSess(s); }
  else if(a==='tedf'&&UI.ted){ const d=UI.ted.d, f=t.dataset.f;
    if(f==='cls'){ if(t.value==='__new'){ UI.ted.newCls=true; } else { d.cls=t.value; UI.ted.newCls=false; if(!d.items.length&&d.cls==='ausdauer') d.mode='timer'; } renderTed(); }
    else if(f==='warm'){ d.warm=t.checked; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(d)+' min'; } }
  else if(a==='tedi'&&UI.ted&&t.type==='checkbox'){ const it=UI.ted.d.items[+t.dataset.i]; it[t.dataset.f]=t.checked; if(t.dataset.f==='ss') renderTed(); else { const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(UI.ted.d)+' min'; } }
  else if(a==='import'){ const f=t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); const docs=data.docs||data; let n=0; for(const key in docs){ if(/^(profile|mob|d-|w-|t-|sk-)/.test(key)){ Store.put(key,docs[key]); n++; } } toast(n+' Einträge geladen'); openSettings(); }catch(err){ toast('Die Datei ist keine gültige Sicherung (JSON aus „Daten als Datei sichern“).'); } }; r.readAsText(f); }
});
document.addEventListener('input',e=>{
  const t=e.target, a=t.dataset.act;
  if(a==='libq'){ libState(t.dataset.ctx).q=t.value; libRefresh(t.dataset.ctx); return; }
  if(a==='tedf'&&UI.ted&&t.tagName==='INPUT'&&t.type!=='checkbox'){ const d=UI.ted.d, f=t.dataset.f; if(f==='clsNew'){ if(t.value.trim()) d.cls=t.value.trim(); } else if(['rounds','work','rest','rrest'].includes(f)) d[f]=t.value===''?'':+t.value; else d[f]=t.value; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(d)+' min'; return; }
  if(a==='tedi'&&UI.ted&&t.type!=='checkbox'){ const it=UI.ted.d.items[+t.dataset.i], f=t.dataset.f, v=t.value===''?'':+t.value; if(f==='lo') it.r[0]=v; else if(f==='hi') it.r[1]=v; else it[f]=v; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(UI.ted.d)+' min'; return; }
  if(t.dataset.act!=='setv'||t.dataset.f!=='kg'||!UI.session) return;
  const s=sessObj(), el=document.querySelector(`[data-tot="${t.dataset.g}-${t.dataset.i}"]`); if(el) el.textContent=totTxt(EX[s.exmap[t.dataset.g]],t.value);

document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), k=todayKey();
  if(f.dataset.form==='extra'){ const d=dayDoc(k); d.extra=[...(d.extra||[]),{n:fd.get('n'),kcal:+fd.get('kcal')||0,p:+fd.get('p')||0}]; saveDay(k,d); render(); toast('Eingetragen'); }
  if(f.dataset.form==='bw'){ const p=prof(), d=fd.get('d'), kg=parseFloat(String(fd.get('kg')).replace(',','.')); if(!kg) return; p.bw=p.bw.filter(x=>x.d!==d); p.bw.push({d,kg}); saveProf(p); render(); toast('Gewicht gespeichert'); }
  if(f.dataset.form==='gh'){ const repo=String(fd.get('repo')||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/$/g,''), token=String(fd.get('token')||'').trim(), pass=String(fd.get('pass')||'');
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){ toast('Bitte Repository als Name/Repo und den Token eintragen'); return; }
    if(pass.length<8){ toast('Bitte ein Passwort mit mindestens 8 Zeichen wählen'); return; }
    if(!(window.crypto&&crypto.subtle)){ toast('Verschlüsselung geht nur über https, nicht in der Offline-Datei'); return; }
    GitSync.setCfg({repo,token,pass,branch:'daten'}); toast('Verbinde mit GitHub …'); GitSync.sync().then(()=>{ toast(GitSync.err?'GitHub: '+GitSync.err:'Mit GitHub abgeglichen'); if(UI.modal==='settings') openSettings(); }); return; }
  if(f.dataset.form==='ntfy'){ const c=ntfyForm(fd); if(!c) return; const was=Ntfy.cfg(); Ntfy.save(c); openNtfy(); Ntfy.sync(); toast(c.on?(was.on?'Gespeichert, plane neu ein':'Eingeschaltet, plane ein …'):(was.on?'Ausgeschaltet, eingeplante werden gelöscht':'Gespeichert')); return; }
  if(f.dataset.form==='settings'){ const p=prof(); const s=p.settings;
    s.start=mondayOf(parseKey(fd.get('start')||s.start)); s.kcal=+fd.get('kcal')||s.kcal; s.protein=+fd.get('protein')||s.protein; s.renegade=+fd.get('renegade')||1; s.imgStyle=IMG_STYLE[fd.get('imgStyle')]?fd.get('imgStyle'):'auto';
    ['plates','vary','bar','circuit45','iron','zinc'].forEach(x=>s[x]=fd.get(x)==='on'); ['barlh','barsz','barkh'].forEach(x=>{ const v=parseFloat(String(fd.get(x)).replace(',','.')); if(!isNaN(v)) s[x]=v; }); saveProf(p); UI.modal=null; $('#overlay').innerHTML=''; render(); toast('Einstellungen gespeichert'); }
});
async function doExport(){
  const json=JSON.stringify({app:'Hantelwoche',version:1,exported:new Date().toISOString(),docs:Store.cache},null,1);
  const name='hantelwoche-sicherung-'+todayKey()+'.json';
  try{ const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data:json}); toast('Sicherung gespeichert'); return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Sicherung heruntergeladen'); }
  catch(e){ toast('Speichern ist hier nicht möglich'); }
}
