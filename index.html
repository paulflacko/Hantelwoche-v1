<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hantelwoche"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Hantelwoche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f3d6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: ein Spaltenfluss wie ein Trainingsbuch; Tab-Leiste unten am Handy, links ab 900px. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e3e8e6; --line:#cfd7d4;
  --fg:#16201d; --muted:#5a6863; --accent:#1f4f9a; --accent-ink:#ffffff;
  --amber:#b86e00; --good:#1f7a4d; --warn:#a4501d; --plate:#c23b2a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201e; --surface-2:#212b29; --line:#2d3936;
  --fg:#e6ecea; --muted:#9aa8a4; --accent:#7fa8ef; --accent-ink:#0b1426;
  --amber:#f0a94a; --good:#5fca93; --warn:#e8935f; --plate:#f07b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --surface-2:#212b29; --line:#2d3936;
  --fg:#e6ecea; --muted:#9aa8a4; --accent:#7fa8ef; --accent-ink:#0b1426;
  --amber:#f0a94a; --good:#5fca93; --warn:#e8935f; --plate:#f07b6b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.sync{margin-left:auto;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;min-width:0;color:var(--muted);cursor:pointer;font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}
  .top{grid-column:1/-1}
  nav.tabs{position:sticky;top:60px;align-self:start;display:flex;flex-direction:column;border:0;background:none;padding:16px 0 0 max(16px,env(safe-area-inset-left,0px));gap:4px}
  nav.tabs button{flex-direction:row;gap:10px;font-size:1rem;padding:10px 12px;border-radius:8px;justify-content:flex-start}
  nav.tabs button[aria-current="page"]{background:var(--surface)}
  main{padding-bottom:48px}
}

.section{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.good{color:var(--good)} .pill.amber{color:var(--amber)} .pill.accent{color:var(--accent)}

/* Heute: Zeitleiste */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .date{font-family:var(--display);font-size:1.05rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch}
.tl .t{font-family:var(--display);font-weight:600;font-size:1.05rem;padding-top:14px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .c{border-left:2px solid var(--line);padding:8px 0 8px 14px;position:relative;min-width:0}
.tl .c::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl.done .c::before{background:var(--good);border-color:var(--good)}
.tl.main .c::before{border-color:var(--accent)}
.tl .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tl.main .box{border-color:var(--accent)}
.zone-pill{color:var(--fg);background:var(--surface-2);gap:6px}.zone-pill i{width:9px;height:9px;border-radius:50%;background:#ff5436;box-shadow:0 0 6px #ff5436}
.actcol{display:flex;gap:8px;flex-basis:100%;padding-left:36px}
.actcol .btn{flex:1;white-space:nowrap}
.mobwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:520px){.mobwrap{grid-template-columns:120px 1fr;gap:12px}}
.body svg{width:100%;height:auto;display:block}
.body .zone{cursor:pointer;fill:var(--accent);stroke:var(--accent);stroke-width:1.5;transition:fill-opacity .15s}
.body .zone[data-lv="0"]{fill-opacity:.06;stroke-opacity:.6;stroke-dasharray:3 3}
.body .zone[data-lv="1"]{fill-opacity:.35;stroke-opacity:.9}
.body .zone[data-lv="2"]{fill-opacity:.8;stroke-opacity:1}
.body .sil{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.chip .lv{font-weight:700;margin-left:4px;opacity:.85}
.mobprev .li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mobprev img{width:72px;height:48px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.mobprev .li:last-child{border-bottom:0}
.check{appearance:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;margin:0}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li label{flex:1;min-width:0;cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .v small{font-size:1rem;color:var(--muted);font-weight:600}

/* Woche */
.week{display:flex;flex-direction:column;gap:8px}
.wd{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.wd.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wd .d{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1}
.wd .d small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.plates{display:flex;gap:3px;align-items:center}
.plates i{width:7px;height:22px;border-radius:2px;background:var(--surface-2)}
.plates i.on{background:var(--plate)}

/* Übungen */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ex .img{background:#fff;aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.ex .img img{width:100%;height:100%;object-fit:contain}
.ex .img.none{background:var(--surface-2);color:var(--muted);font-size:.85rem;text-align:center;padding:12px}
.ex .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Bibliothek und Workout-Editor */
.search{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:11px 12px;font:inherit;color:var(--fg);width:100%}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.lib{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lr{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.th{flex:none;width:64px;height:48px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:contain}
.th.none{background:var(--surface-2);color:var(--muted)}
.th svg{width:24px;height:24px}
.lr .nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lrx{padding:0 12px 12px 88px;display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.lrx{padding-left:12px}}
.lrx img{width:100%;max-width:360px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl.hid{opacity:.6}
.tli{margin:0;padding:0;list-style:none;font-size:.875rem;display:flex;flex-direction:column;gap:3px}
.tli .gnum{font-size:.95rem}
.tpl .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tedrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.tedrow.ss{border-left:4px solid var(--accent)}
.tedhead{display:flex;gap:8px;align-items:center}
.tedhead .iconbtn{width:34px;height:34px;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.tedctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tedctl input{width:100%}
.mini{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.mini input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.field select{appearance:auto}

/* Overlay (Training, Timer) */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ov-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.ov-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 140px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.excard.done{border-color:var(--good)}
.excard .top2{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px}
@media (max-width:420px){.excard .top2{grid-template-columns:96px 1fr}}
.excard .thumb{background:#fff;border-radius:8px;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;max-width:100%}
.excard .thumb img{width:100%;height:100%;object-fit:contain}
.excard .thumb.none{background:var(--surface-2);color:var(--muted);font-size:.7rem;text-align:center;padding:6px}
.gnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.1rem;margin-right:6px}
.hint{font-size:.85rem;padding:8px 12px;background:var(--surface-2);border-radius:8px}
.tips{background:var(--surface-2);border-radius:10px;padding:0;text-align:left;width:100%;max-width:560px}
.tips summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:.9rem;list-style-position:inside}
.tips .tipbody{padding:0 14px 12px;font-size:.88rem;line-height:1.45}
.tips h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.tips ol,.tips ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tips ul.warn li::marker{color:var(--warn)}
.tips p{margin:0}
.gcue{display:flex;gap:10px;align-items:flex-start;text-align:left;max-width:560px;width:100%;padding:10px 14px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--accent);font-weight:600;line-height:1.35}
.gcue .lab{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:3px;flex:none}
.gcue.flash{animation:cueflash .6s ease}
@keyframes cueflash{from{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2))}to{background:var(--surface-2)}}
.regbars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.regbars .rb{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 4.5em;gap:8px;align-items:center;font-size:.85rem}
.regbars .rb small{color:var(--muted);text-align:right}
.regen.done{opacity:.85}
.hint.up{color:var(--good);font-weight:600}
.sets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .tot{grid-column:2/4;font-size:.75rem;color:var(--muted);margin-top:-4px}
.excard .wt{margin:0 12px 8px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 6px 6px 0}
.hint.down{color:var(--amber);font-weight:600}
.wuthumb{flex:none;width:64px;height:48px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;cursor:pointer}
.wuthumb img{width:100%;height:100%;object-fit:contain;display:block}
.wubig{display:flex;flex-direction:column;gap:6px;padding:0 0 12px}
.wubig img{width:100%;max-width:420px;aspect-ratio:3/2;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.1rem;text-align:center}
.set.ok{background:color-mix(in srgb,var(--good) 10%,transparent)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;min-width:0}
.inp input{border:0;background:none;width:100%;min-width:0;padding:9px 8px;font:600 1.1rem var(--display);color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
.inp span{padding-right:8px;color:var(--muted);font-size:.8rem}
.setbtn{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.set.ok .setbtn{background:var(--good);border-color:var(--good);color:#fff}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--fg);color:var(--bg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.restbar .big{font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.restbar button{background:none;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.restbar .prog{position:absolute;left:0;top:0;height:4px;background:var(--amber)}

/* Geführter Ablauf */
.player{min-height:100%;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage .phase{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:1rem}
.stage .phase.work{color:var(--plate)} .stage .phase.rest{color:var(--good)}
.stage .clock{font-family:var(--display);font-weight:700;font-size:clamp(4.5rem,22vw,9rem);line-height:.9;font-variant-numeric:tabular-nums}
.stage .stepname{font-size:clamp(1.4rem,5vw,2.2rem)}
.stage .gif{width:min(300px,70vw);aspect-ratio:4/3;background:#fff;border-radius:12px;overflow:hidden;max-width:100%}
.stage .gif img{width:100%;height:100%;object-fit:contain}
.ring{width:min(260px,64vw);aspect-ratio:1;max-width:100%}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.controls .btn{min-width:88px;justify-content:center;padding:12px 16px}
.steps-mini{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:600px}
.steps-mini i{width:12px;height:5px;border-radius:2px;background:var(--surface-2)}
.steps-mini i.past{background:var(--muted)} .steps-mini i.cur{background:var(--accent)}

/* Formulare */
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;font:inherit;color:var(--fg);min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
details summary{cursor:pointer;font-weight:600}

/* Atemübungen */
.brcard .brico{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.brcard .brico svg{width:24px;height:24px}
.brgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.brc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-width:0}
.brc:hover{border-color:var(--accent)}
.brpat{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin-top:2px}
.brpat i{display:block;height:100%;min-width:3px}
.brpat .in,.brpat .top{background:var(--accent)} .brpat .top{opacity:.6}
.brpat .hold,.brpat .retain{background:var(--amber)} .brpat .out{background:var(--good)} .brpat .out.hum{background:repeating-linear-gradient(90deg,var(--good) 0 5px,color-mix(in srgb,var(--good) 55%,transparent) 5px 8px)}
.brpat .rest{background:var(--line)}
.brleg{line-height:1.35}
.brhow{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.brsrc{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.warnbox{border-left:4px solid var(--warn);background:var(--surface-2)}
.brok{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--warn);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-size:.9rem}
.brok[aria-pressed="true"]{border-color:var(--good)}
.brok[aria-pressed="true"] .check{background:var(--good);border-color:var(--good)}
.brok[aria-pressed="true"] .check::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.brprogbar{height:4px;background:var(--surface-2)}
.brprogbar span{display:block;height:100%;width:0;background:var(--accent)}
.brsvg{width:min(320px,78vw);aspect-ratio:1;max-width:100%;overflow:visible}
.brcirc{fill:color-mix(in srgb,var(--accent) 20%,transparent);stroke:var(--accent);stroke-width:3;transition:fill .6s,stroke .6s}
.brcirc.k-hold,.brcirc.k-retain{fill:color-mix(in srgb,var(--amber) 20%,transparent);stroke:var(--amber)}
.brcirc.k-out{fill:color-mix(in srgb,var(--good) 18%,transparent);stroke:var(--good)}
.brcirc.k-rest,.brcirc.k-prep,.brcirc.k-free{fill:color-mix(in srgb,var(--muted) 14%,transparent);stroke:var(--muted)}
.brlab{fill:var(--fg);font:700 22px var(--display);letter-spacing:.06em;text-transform:uppercase}
.brnum{fill:var(--fg);font:700 48px var(--display);font-variant-numeric:tabular-nums}
.brsubt{fill:var(--muted);font:600 14px var(--body)}
.brring{stroke:var(--accent)} .brring.k-hold,.brring.k-retain{stroke:var(--amber)} .brring.k-out{stroke:var(--good)} .brring.k-rest,.brring.k-prep,.brring.k-free{stroke:var(--muted)}
.brwaves circle{fill:none;stroke:var(--good);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.brwaves.on circle{animation:brwave 1.8s ease-out infinite}
.brwaves.on circle:nth-child(2){animation-delay:.6s} .brwaves.on circle:nth-child(3){animation-delay:1.2s}
@keyframes brwave{from{transform:scale(.9);opacity:.7}to{transform:scale(1.9);opacity:0}}
.brh{min-height:1.5em;font-weight:600;max-width:440px}
.brbig{font-size:1.2rem;padding:16px 36px;justify-content:center}
.brnose{width:170px;height:90px}
.brnose ellipse{fill:var(--surface-2);stroke:var(--line);stroke-width:2;transition:fill .3s}
.brnose text{font:700 14px var(--display);fill:var(--muted)}
.brnose[data-open="L"] .nl,.brnose[data-open="R"] .nr{fill:var(--accent);stroke:var(--accent)}
.brnose[data-open="L"] .nlt,.brnose[data-open="R"] .nrt{fill:var(--accent)}
.brret{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.brret div{display:flex;flex-direction:column}
.brret b{font-size:1.6rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function mobPlan(cfg){
  const feel=MOB_FEEL[cfg.feel]||MOB_FEEL.gut, total=(cfg.min||15)*60;
  let sel=MOB_AREAS.filter(a=>(cfg.areas||{})[a.k]>0); const all=!sel.length; if(all) sel=MOB_AREAS;
  const w=a=>all?1:cfg.areas[a.k];
  const seed=Math.floor(Date.now()/864e5/7); // wöchentlich etwas andere Reihenfolge im Pool
  const pools=sel.map(a=>{ let pl=a.pool.slice();
    if(feel.gentle) pl=pl.filter(x=>!['wgs','birddog','pullapart'].includes(x.ex)).concat(pl.filter(x=>['wgs','birddog','pullapart'].includes(x.ex)));
    else if(feel.dyn>0) pl=pl.filter(x=>x.dyn).concat(pl.filter(x=>!x.dyn));

  const closer=feel.gentle||cfg.feel==='verspannt' ? {ex:'sava',sec:feel.gentle?150:90,rest:1,note:'Alles loslassen, Atem beobachten'} : {ex:'child',sec:60,rest:1,note:'Tief in Bauch und Flanken atmen'};
  const opener=feel.gentle ? {ex:'seiza',sec:60,note:'5 tiefe Atemzüge in den Bauch, ankommen'} : {ex:'catcow',sec:60,dyn:1,note:'8 langsame Wiederholungen mit dem Atem'};
  let budget=total-cost(opener)-closer.sec; const used=new Set([opener.ex,closer.ex]); const picked=[];
  const tickets=[]; pools.forEach(p=>{ for(let k=0;k<w(p.a);k++) tickets.push(p); });
  tickets.sort((x,y)=>w(y.a)-w(x.a));
  let progress=true;
  while(progress && budget>20){ progress=false;
    for(const p of tickets){
      while(p.i<p.pl.length && used.has(p.pl[p.i].ex)) p.i++;
      if(p.i>=p.pl.length) continue;
      const x=p.pl[p.i], c=cost(x);
      if(c<=budget+20){ picked.push({...x,area:p.a.n}); used.add(x.ex); budget-=c; p.i++; progress=true; }
      else p.i++;
    } }
  // Wenige Bereiche gewählt: mit benachbarten Bereichen auffüllen, bevor Haltezeiten verlängert werden
  const focusBase=picked.reduce((t,x)=>t+cost(x),0); let fill=budget-focusBase*.5; // gewählte Bereiche erst länger halten, dann ergänzen
  if(fill>90 && !all){
    const near={nacken:['schulter','bws'],schulter:['bws','nacken'],bws:['schulter','lws'],lws:['bws','huefte','po'],huefte:['po','leiste','lws'],po:['huefte','lws'],hinten:['waden','huefte'],leiste:['huefte','po'],waden:['hinten','huefte']};
    const extra=[...new Set(sel.flatMap(a=>near[a.k]))].filter(k=>!sel.some(a=>a.k===k)).map(k=>MOB_AREAS.find(a=>a.k===k));
    const rest=MOB_AREAS.filter(a=>!sel.includes(a)&&!extra.includes(a)); let more=true;

  }
  // Restzeit: Haltezeiten verlängern (max. +50 %)
  const base=picked.reduce((t,x)=>t+cost(x),0); const stretch=budget>30&&base?Math.min(1.5,1+budget/base):1;
  if(!feel.gentle) picked.push(opener);
  picked.sort((x,y)=>(MOB_POS[x.ex]-MOB_POS[y.ex])||((y.dyn?1:0)-(x.dyn?1:0)));
  const steps=[]; const sec=x=>Math.round(cost(x)/(x.side?2:1)*stretch/5)*5;
  const push=(x,kind)=>{ const e=EX[x.ex]; let note=x.note||''; if(!x.dyn&&feel.tip&&!x.rest) note=(note?note+' · ':'')+feel.tip;
    if(x.side){ steps.push(S(e.n+' · links',sec(x),x.ex,note,kind)); steps.push(S(e.n+' · rechts',sec(x),x.ex,note,kind)); }
    else steps.push(S(e.n,x===opener||x===closer?x.sec:sec(x),x.ex,note,kind)); };
  if(feel.gentle) push(opener); picked.forEach(x=>push(x)); push(closer,'rest');
  return {steps,areas:all?['Ganzkörper']:sel.map(a=>a.n),short:all?['Ganzkörper']:sel.map(a=>a.s),feel};
}

  [/^(?!.*unter).*(rücken|\blat\b)/i,{bws:1,lws:.4,schulter:.3}],
  [/(^|\s)po(\s|$)/i,{po:1,huefte:.4}],
  [/beinbeuger|rückseite/i,{hinten:1,lws:.3}],
  [/oberschenkel innen|adduktor/i,{leiste:1}],
  [/oberschenkel(?! innen)|beine/i,{huefte:.7,po:.4,leiste:.3}],
  [/waden|schienbein/i,{waden:1}],

const _exLoad={};
function exLoad(k){ if(_exLoad[k]) return _exLoad[k]; const e=EX[k], out={};
  if(e && e.cat!=='mobil' && !GLOW_EX.has(k)){
    const parts=String(e.mg||'').split(/,\s*/).filter(Boolean);
    parts.forEach((p,i)=>{ const w=i===0?1:.7; // erstgenannter Muskel zählt voll
      LOAD_MAP.forEach(([re,m])=>{ if(re.test(p)) for(const a in m) out[a]=Math.max(out[a]||0,m[a]*w); }); });
  }
  return _exLoad[k]=out; }
// Übungen und Satzzahl einer abgeschlossenen Einheit
function sessExSets(w){
  if(w.plan && w.plan.mode==='timer'){ const t=getTpl(w.tpl); if(!t) return []; const R=+t.rounds||1; return tplItems(t).map(x=>[x.ex,R]); }
  const rows=Object.entries(w.sets||{}).map(([g,arr])=>[w.exmap&&w.exmap[g],(arr||[]).filter(x=>x.done).length,(arr||[]).length]).filter(r=>EX[r[0]]);

const REGEN_DAY=['Heute','Gestern','Vorgestern','Vor 3 Tagen'];
function regenInfo(key){
  key=key||todayKey(); const L={}, src=[];
  const add=(ex,n,f)=>{ const m=exLoad(ex); for(const a in m) L[a]=(L[a]||0)+m[a]*n*f; };
  for(let d=0;d<=3;d++){ const k=addDays(key,-d), f=[1,1,.6,.3][d];
    workouts().filter(w=>w.date===k&&w.finished).forEach(w=>{ const list=sessExSets(w); if(!list.length) return; list.forEach(([ex,n])=>add(ex,n,f)); src.push({d,n:wname(w)}); });
    const doc=Store.get('d-'+k);
    if(doc&&doc.done){
      if(doc.done.circuit && !workouts().some(w=>w.date===k&&w.slot==='circuit')){ ['thruster','climber','renegade','burpee','woodchop','hollow'].forEach(e=>add(e,4,f)); src.push({d,n:'Zirkel'}); }
      if(doc.done.z2){ L.waden=(L.waden||0)+3*f; L.huefte=(L.huefte||0)+2*f; L.hinten=(L.hinten||0)+1.5*f; src.push({d,n:'Ausdauer'}); }

  const office=!Object.keys(areas).length;

  const today=Store.get('d-'+key)||{}, total=ranked.reduce((t,[,v])=>t+v,0);
  const recent=src.some(s=>s.d<=1);
  let feel='gut', why='';

  else if(recent && total>=25){ feel='verspannt'; why='Hohe Belastung: längere, ruhige Haltezeiten.'; }

  const byDay={}; src.forEach(s=>{ (byDay[s.d]=byDay[s.d]||[]).push(s.n); });
  const srcTxt=Object.keys(byDay).sort().map(d=>REGEN_DAY[d]+': '+[...new Set(byDay[d])].join(', ')).join(' · ');

  const sava={ex:'sava',sec:Math.max(90,Math.round(total*(relax?.15:.08)/30)*30),note:'Alles loslassen, Atem kommen und gehen lassen'};
  let budget=total-opener.sec-warm.sec-(sun?sun.sec:0)-sava.sec;
  const seed=Math.floor(Date.now()/864e5);
  const pool=YOGA_POOL.filter(x=>!(x.min&&(relax||int<x.min))).map((x,i)=>{
    const rs=all?1:x.r.reduce((t,k)=>t+(cfg.areas[k]||0),0);
    const st=relax?2-x.act:x.act;
    return {...x,sets:x.sets?(relax?1:int):0,score:rs*(all?1:3)+st*(all?1.5:1)+(relax&&(MOB_POS[x.ex]??2)>=2?1:0)+((i*7+seed)%5)/10};
  }).sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const x of pool){ if(budget<30) break; if(!all&&!x.r.some(k=>cfg.areas[k])) continue; const c=cost(x); if(c<=budget+15){ picked.push(x); budget-=c; } }
  const focus=picked.reduce((t,x)=>t+cost(x),0); let fill=budget-focus*.4; // Schwerpunkt etwas länger halten, Rest mit passenden Haltungen füllen
  for(const x of pool){ if(fill<60) break; if(picked.includes(x)) continue; const c=cost(x); if(c<=fill){ picked.push(x); budget-=c; fill-=c; } }
  // Rest auf Haltungen verteilen
  const base=picked.reduce((t,x)=>t+cost(x),0), k=budget>20&&base?Math.min(1.6,1+budget/base):1;
  picked.sort((a,b)=>(MOB_POS[a.ex]??2)-(MOB_POS[b.ex]??2)||b.act-a.act);
  const steps=[]; const sec=x=>Math.round(hold(x)*k/5)*5;
  const add=(x,kind)=>{ const e=EX[x.ex], note=x.note||'';
    if(x.sets>1){ for(let i=1;i<=x.sets;i++){ steps.push(S('Brücke halten',sec(x),x.ex,i+' von '+x.sets)); if(i<x.sets) steps.push(S('Lösen',15,null,'','rest')); } }
    else if(x.side){ steps.push(S(e.n+' · links',sec(x),x.ex,note,kind)); steps.push(S(e.n+' · rechts',sec(x),x.ex,note,kind)); }
    else steps.push(S(x.ex==='bridge'?'Brücke halten':e.n,x.fixed?x.sec:sec(x),x.ex,note,kind)); };
  [opener,warm,sun].filter(Boolean).forEach(x=>{ x.fixed=1; add(x); });
  picked.forEach(x=>add(x)); sava.fixed=1; add(sava,'rest');
  const names=all?['Ganzkörper']:MOB_AREAS.filter(a=>cfg.areas[a.k]).map(a=>a.s);
  return {steps,short:names,title:'Yoga · '+(relax?'entspannend':'aktiv')+' · '+YOGA_INT[int].n.toLowerCase()};
}

const ytUrl=e=>'https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' Übung Ausführung');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
function libState(ctx){ return ctx==='ted'?UI.ted:(UI.lib=UI.lib||{q:'',eq:'',cat:'',open:null}); }
function libKeys(st){ const q=norm(st.q).trim();
  return Object.keys(EX).filter(k=>{ const e=EX[k]; if(!e.cat) return false; if(st.eq&&!e.eqk.includes(st.eq)) return false; if(st.cat&&e.cat!==st.cat) return false;
    return !q || q.split(/\s+/).every(w=>norm(e.n+' '+e.mg+' '+e.eq+' '+CATS[e.cat]+' '+e.eqk.map(x=>EQK[x]).join(' ')).includes(w)); })
    .sort((a,b)=>EX[a].n.localeCompare(EX[b].n,'de')); }
function libFilters(ctx){ const st=libState(ctx);
  return `<input class="search" type="search" placeholder="Suchen, z. B. Rudern, Po, Band …" value="${esc(st.q)}" data-act="libq" data-ctx="${ctx}" aria-label="Übung suchen" autocomplete="off">
  <div class="chips scroll" role="group" aria-label="Ausrüstung">${['',...Object.keys(EQK)].map(k=>`<button class="chip" data-act="libeq" data-ctx="${ctx}" data-v="${k}" aria-pressed="${st.eq===k}">${k?EQK[k]:'Alle Geräte'}</button>`).join('')}</div>
  <div class="chips scroll" role="group" aria-label="Körperbereich">${['',...Object.keys(CATS)].map(k=>`<button class="chip" data-act="libcat" data-ctx="${ctx}" data-v="${k}" aria-pressed="${st.cat===k}">${k?CATS[k]:'Alle Bereiche'}</button>`).join('')}</div>`; }
function thumb(k){ const e=EX[k]; return `<div class="th ${e.img?'':'none'}">${e.img?`<img src="${imgSrc(e.img)}" alt="" loading="lazy">`:ICONS.ex}</div>`; }
function libList(ctx){ const st=libState(ctx), keys=libKeys(st), bar=prof().settings.bar;
  if(!keys.length) return '<p class="small muted" style="padding:12px">Nichts gefunden. Anderen Filter oder Suchbegriff probieren.</p>';
  const inTed=ctx==='ted'?new Set(UI.ted.d.items.map(i=>i.ex)):null;
  return `<div class="small muted" style="padding:8px 12px">${keys.length} Übungen</div>`+keys.map(k=>{ const e=EX[k], open=st.open===k;
    return `<div class="lr">${thumb(k)}<button class="nm" data-act="libopen" data-ctx="${ctx}" data-k="${k}" aria-expanded="${open}"><b>${esc(e.n)}</b><span class="small muted">${esc(CATS[e.cat])} · ${esc(e.eq)}</span></button>${ctx==='ted'?`<button class="btn small ${inTed.has(k)?'':'primary'}" data-act="tedadd" data-k="${k}" aria-label="${esc(e.n)} hinzufügen">${inTed.has(k)?'+ nochmal':'+ Hinzu'}</button>`:''}</div>
    ${open?`<div class="lrx">${e.img?`<img src="${imgSrc(e.img)}" alt="Animation ${esc(e.n)}" loading="lazy">`:''}<p class="small">${esc(e.cue)}</p><p class="small muted">Trainiert: ${esc(e.mg)}${e.bar&&!bar?' · braucht die Klimmzugstange':''}</p>${tipsHtml(k,false)}<div class="row small">${GUIDE_SLUG[k]?`<a href="${GUIDE(GUIDE_SLUG[k])}" target="_blank" rel="noopener">Anleitung (WorkoutLabs)</a>`:''}<a href="${ytUrl(e)}" target="_blank" rel="noopener">Video suchen (YouTube)</a></div></div>`:''}`; }).join(''); }
function libRefresh(ctx){ const el=$(ctx==='ted'?'#tedlist':'#exlist'); if(el) el.innerHTML=libList(ctx); }

const LS_KEY = 'hantelwoche-v1';
const Store = {
  cache:{}, mode:'local', col:null, timers:{}, writing:{}, dirty:{},
  load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) this.cache=JSON.parse(raw)||{}; }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(this.cache)); }catch(e){} },
  get(k){ return this.cache[k]; },
  put(k,v){ this.cache[k]=JSON.parse(JSON.stringify(v)); this.touch(k); this.saveLocal(); this.queue(k); },
  del(k){ delete this.cache[k]; this.touch(k); this.saveLocal(); this.queue(k); },
  touch(k){ try{ const m=JSON.parse(localStorage.getItem(LS_KEY+'-t')||'{}'); m[k]=Date.now(); localStorage.setItem(LS_KEY+'-t',JSON.stringify(m)); }catch(e){} if(typeof GitSync!=='undefined') GitSync.soon(); },
  queue(k){ if(!this.col) return; this.dirty[k]=true; clearTimeout(this.timers[k]); this.timers[k]=setTimeout(()=>this.flush(k),700); },
  async flush(k){
    if(this.writing[k]){ this.timers[k]=setTimeout(()=>this.flush(k),400); return; }
    this.writing[k]=true; this.dirty[k]=false;
    try{ const v=this.cache[k]; const ref=this.col.doc(k); if(v===undefined) await ref.delete(); else await ref.set(v); }
    catch(e){ if(e && e.code==='unavailable'){ this.dirty[k]=true; setTimeout(()=>this.flush(k),1500+Math.random()*1000);} }
    finally{ this.writing[k]=false; }
  },
  async connect(){
    if(!window.claude || !claude.use) return;
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user) return;
      const uid=await user.id(); if(!uid) return;
      this.col=db.collection('data/users/'+uid);
      let first=true;
      this.col.onSnapshot(snap=>{
        const remote={}; snap.docs.forEach(d=>{ remote[d.id]=d.data(); });
        if(first){ first=false; for(const k in this.cache) if(!(k in remote)) this.queue(k); }
        else { for(const k in this.cache) if(!(k in remote) && !this.dirty[k] && !this.writing[k]) delete this.cache[k]; }
        for(const k in remote) if(!this.dirty[k] && !this.writing[k]) this.cache[k]=JSON.parse(JSON.stringify(remote[k]));
        this.mode='cloud'; this.saveLocal(); onData();
      }, ()=>{ this.mode='local'; this.col=null; onData(); });
    }catch(e){}
  }
};

const GitSync = {
  KEY:LS_KEY+'-gh', busy:false, timer:null, last:null, err:'',
  cfg(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ return null; } },
  setCfg(c){ try{ if(c) localStorage.setItem(this.KEY,JSON.stringify(c)); else localStorage.removeItem(this.KEY); }catch(e){} },
  on(){ const c=this.cfg(); return !!(c&&c.repo&&c.token&&c.pass) && !Store.col && !!(window.crypto&&crypto.subtle); },
  times(){ try{ return JSON.parse(localStorage.getItem(LS_KEY+'-t')||'{}'); }catch(e){ return {}; } },
  soon(){ if(!this.on()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.sync(),4000); },
  api(path,opt={},raw){ const c=this.cfg(); const br=c.branch||'daten'; return fetch('https://api.github.com/repos/'+c.repo+'/contents/'+path+(opt.method==='PUT'?'':'?ref='+encodeURIComponent(br)),{...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})},cache:'no-store'}); },
  // Verschlüsselung: AES-GCM 256, Schlüssel aus dem Passwort per PBKDF2-SHA256. Das Passwort verlässt das Gerät nie.
  ITER:310000, keyCache:{},
  bytesB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); },
  b64Bytes(b){ const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; },
  async key(pass,salt,iter){ const id=pass+'|'+salt+'|'+iter; if(this.keyCache[id]) return this.keyCache[id];
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);

  async zip(u,dir){ if(typeof CompressionStream==='undefined') return null; const st=new Blob([u]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip')); return new Uint8Array(await new Response(st).arrayBuffer()); },
  async seal(obj,salt){ const c=this.cfg(); salt=salt||this.bytesB64(crypto.getRandomValues(new Uint8Array(16)));
    let plain=new TextEncoder().encode(JSON.stringify(obj)); const z=await this.zip(plain,true); if(z) plain=z;
    const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await this.key(c.pass,salt,this.ITER),plain));
    return {app:'Hantelwoche',hinweis:'Verschlüsselt. Lesbar nur in der App mit deinem Passwort.',v:1,enc:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter:this.ITER,zip:!!z,salt,iv:this.bytesB64(iv),data:this.bytesB64(ct),saved:new Date().toISOString()}; },
  async open(f){ const c=this.cfg(); if(!f.enc) return f;
    let pt; try{ pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:this.b64Bytes(f.iv)},await this.key(c.pass,f.salt,f.iter||this.ITER),this.b64Bytes(f.data))); }

  b64(str){ const b=new TextEncoder().encode(str); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); },
  unb64(b){ const bin=atob(b.replace(/\n/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); },
  async sync(tries=0){
    if(!this.on()) return; if(this.busy){ this.soon(); return; } this.busy=true; this.err='';
    try{
      const r=await this.api('data.json');
      let remote={docs:{},t:{}}, sha, salt;
      if(r.status===200){ const j=await r.json(); sha=j.sha;
        let txt=j.content&&j.encoding==='base64'?this.unb64(j.content):await (await this.api('data.json',{},true)).text();
        const f=JSON.parse(txt); salt=f.salt; remote=await this.open(f); remote.docs=remote.docs||{}; remote.t=remote.t||{}; }
      else if(r.status!==404) throw new Error(r.status===401?'Token ungültig oder abgelaufen':r.status===403?'Token hat keine Rechte für dieses Repository':'GitHub antwortet mit Fehler '+r.status);
      const lt=this.times(); const keys=new Set([...Object.keys(remote.docs),...Object.keys(remote.t),...Object.keys(Store.cache),...Object.keys(lt)]);
      const out={docs:{},t:{}}; let changedLocal=false, changedRemote=false;
      keys.forEach(k=>{ if(!/^(profile|mob|d-|w-|t-)/.test(k)) return;
        const tl=lt[k]||0, tr=remote.t[k]||0;
        if(tr>tl){ if(k in remote.docs){ if(JSON.stringify(Store.cache[k])!==JSON.stringify(remote.docs[k])){ Store.cache[k]=remote.docs[k]; changedLocal=true; } } else if(k in Store.cache){ delete Store.cache[k]; changedLocal=true; } lt[k]=tr; }
        else if(tl>tr || (!(k in remote.docs) && k in Store.cache)){ changedRemote=true; }
        const t=Math.max(tl,tr)||Date.now(); lt[k]=t; out.t[k]=t; if(k in Store.cache) out.docs[k]=Store.cache[k]; });
      try{ localStorage.setItem(LS_KEY+'-t',JSON.stringify(lt)); }catch(e){}
      if(changedLocal){ Store.saveLocal(); onData(); }
      if(changedRemote||!sha){
        const file=await this.seal(out,salt);
        const w=await this.api('data.json',{method:'PUT',body:JSON.stringify({message:'Daten '+todayKey()+' (verschlüsselt)',branch:this.cfg().branch||'daten',content:this.b64(JSON.stringify(file)),...(sha?{sha}:{})})});
        if(w.status===409||w.status===422){ this.busy=false; if(tries<3) return this.sync(tries+1); throw new Error('Konflikt beim Speichern'); }

let audioCtx=null;
function beep(freq=880,dur=.15,times=1){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
      const t0=audioCtx.currentTime+i*(dur+.08); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.35,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.02); }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(times>1?[120,80,120]:120); }catch(e){}
}

async function keepAwake(on){

function weekStatus(mon){
  const keys=[...Array(7)].map((_,i)=>addDays(mon,i));
  const ws=workouts().filter(w=>w.finished && keys.includes(w.date));
  let med=0, circuit=false;
  keys.forEach(k=>{ const d=Store.get('d-'+k); if(d&&d.done){ if(d.done.med) med++; if(d.done.circuit) circuit=true; } });
  return {strength:new Set(ws.map(w=>w.slot||w.type).filter(t=>WORKOUTS[t])).size, med, circuit};
}

function weeklyAverages(bw){
  const m={}; bw.forEach(e=>{ const w=mondayOf(parseKey(e.d)); (m[w]=m[w]||[]).push(e.kg); });
  return Object.keys(m).sort().map(w=>({w,avg:m[w].reduce((a,b)=>a+b,0)/m[w].length,n:m[w].length}));
}

function drawCharts(){
  const el=$('#bwchart'); if(!el) return;
  const bw=[...prof().bw].sort((a,b)=>a.d<b.d?-1:1);
  if(bw.length<2){ el.innerHTML='<p class="small muted">Ab zwei Messungen siehst du hier den Verlauf.</p>'; return; }
  const W=Math.max(320,el.clientWidth||600),H=200,L=40,R=12,T=12,B=26;
  const xs=bw.map(e=>parseKey(e.d).getTime()), x0=Math.min(...xs), x1=Math.max(...xs);
  const ys=bw.map(e=>e.kg); let y0=Math.floor(Math.min(...ys)-0.5), y1=Math.ceil(Math.max(...ys)+0.5);
  const X=t=>L+(x1===x0?0:(t-x0)/(x1-x0))*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const step=(y1-y0)>4?1:0.5; let grid='';
  for(let v=y0;v<=y1+1e-9;v+=step){ grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v,1)}</text>`; }
  const avgs=weeklyAverages(bw).map(a=>({t:parseKey(a.w).getTime()+3*864e5,v:a.avg}));
  const pts=bw.map(e=>`<circle cx="${X(parseKey(e.d).getTime())}" cy="${Y(e.kg)}" r="3" fill="var(--muted)"/>`).join('');
  const line=avgs.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${avgs.map(a=>X(Math.min(x1,Math.max(x0,a.t)))+','+Y(a.v)).join(' ')}"/>`:'';
  const last=avgs[avgs.length-1];
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">${grid}${pts}${line}${last?`<circle cx="${X(Math.min(x1,Math.max(x0,last.t)))}" cy="${Y(last.v)}" r="5" fill="var(--accent)"/>`:''}<text x="${L}" y="${H-6}">${fmtShort(bw[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(bw[bw.length-1].d)}</text></svg><p class="small muted">Punkte: einzelne Messungen · Linie: Wochenschnitt</p>`;
}

/* ============================== TRAINING ============================== */
function variantOf(raw){ return raw.v ? {...raw, ...raw.v, isVar:true} : null; }
function altOf(raw){ return raw.alt ? {...raw, ex:raw.alt.ex, sets:raw.alt.sets, r:raw.alt.r, side:false, lab:null, isAlt:true} : null; }
function itemFor(raw,exId){ if(raw.alt && exId===raw.alt.ex) return altOf(raw); if(raw.v && exId===raw.v.ex) return variantOf(raw); return raw; }
function isVariantWeek(k){ const w=weekNo(k); return w>0 && w%2===0; }
function resolveItem(raw,st,k){
  if(raw.alt && !st.bar) return altOf(raw);
  if(raw.v && st.vary!==false && isVariantWeek(k)) return variantOf(raw);
  return raw;
}
function activeItem(it,s){ return resolveItem(it,s,todayKey()); }
// Gesamtgewicht: eingetragen werden die Scheiben, die Stange wird addiert
function barOf(e,st){ st=st||prof().settings; return !st.plates||!e.imp ? 0 : e.imp==='lh'?+st.barlh||0 : e.imp==='sz'?+st.barsz||0 : +st.barkh||0; }
function totalKg(e,kg,st){ if(kg===''||kg==null||isNaN(+kg)) return null; return +kg+barOf(e,st); }
function totTxt(e,kg){ const t=totalKg(e,kg); if(t===null||!barOf(e)) return ''; return '= '+fmtNum(t,2)+' kg'+(e.imp==='kh2'?' je Hantel':'')+' mit Stange'; }
function setTotal(e,s){ return s.tot!=null ? +s.tot : (totalKg(e,s.kg)||0); }
function perfHistory(exId, beforeId, n){
  const out=[]; const ws=workouts().filter(w=>w.finished && w.id!==beforeId).reverse();
  for(const w of ws){ for(const [g,arr] of Object.entries(w.sets||{})){ if(w.exmap&&w.exmap[g]===exId){ const done=arr.filter(x=>x.done); if(done.length) out.push({date:w.date,sets:done}); } } if(out.length>=n) break; }
  return out;
}
function lastPerf(exId, beforeId){ return perfHistory(exId,beforeId,1)[0]||null; }
function suggestion(it,sessId){
  const ex=EX[it.ex], hist=perfHistory(it.ex,sessId,4), last=hist[0];
  const weighted=ex.unit==='kg'||ex.unit==='carry';
  if(!last) return {kg:'',text: weighted ? 'Erstes Mal: Gewicht wählen, mit dem du die untere Wdh.-Zahl mit RIR 2 schaffst.'+(barOf(ex)?' Trag nur die Scheiben ein, die Stange ('+fmtNum(barOf(ex),2)+' kg) rechnet die App dazu.':'') : 'Erstes Mal: sauber ausführen, Satz endet bei RIR 2.',up:false,trend:''};
  const unitTxt=ex.unit==='sec'?' s':'';
  const fmtSets=h=>h.sets.map(x=>(weighted&&x.kg!==''?fmtNum(x.kg,2)+'×':'')+(x.reps||'–')+unitTxt).join(', ');
  const trend=hist.slice().reverse().map(h=>fmtShort(h.date)+': '+fmtSets(h)).join(' · ');
  const top=h=>h.sets.length>=it.sets && h.sets.every(x=>+x.reps>=it.r[1]);
  const below=h=>h.sets.some(x=>x.reps!=='' && +x.reps<it.r[0]);
  const maxKg=h=>Math.max(0,...h.sets.map(x=>+x.kg||0));
  const reps=last.sets.map(x=>Math.min(it.r[1],(+x.reps||it.r[0])+1)).join(', ');
  if(weighted){
    const kg=maxKg(last), step=ex.step||1, rnd=x=>Math.max(0,Math.round(x/step)*step);
    const tot=x=>barOf(ex)?' (= '+fmtNum(totalKg(ex,x),2)+' kg'+(ex.imp==='kh2'?' je Hantel':'')+' mit Stange)':'';
    if(top(last)) return {kg:kg+step, up:true, trend, text:`Letztes Mal alle Sätze mit ${it.r[1]} Wdh. geschafft: heute ${fmtNum(kg+step,2)} kg${tot(kg+step)}, also +${fmtNum(step,2)} kg.`};
    if(below(last)){ const k=rnd(kg-Math.max(step,kg*0.05)); return {kg:k, down:true, trend, text:`Letztes Mal unter ${it.r[0]} Wdh. geblieben. Heute etwas leichter: ${fmtNum(k,2)} kg${tot(k)}, Ziel ${it.r[0]}–${it.r[1]} Wdh.`}; }
    const sumReps=h=>h.sets.reduce((a,x)=>a+(+x.reps||0),0);
    const stalled=hist.length>=3 && hist.slice(0,3).every(h=>maxKg(h)===kg && !top(h)) && sumReps(hist[0])<=sumReps(hist[2]);
    if(stalled){ const k=rnd(kg*0.9); return {kg:k, down:true, trend, text:`Seit 3 Einheiten mit ${fmtNum(kg,2)} kg kein Fortschritt. Heute ca. 10 % leichter: ${fmtNum(k,2)} kg${tot(k)}, sauber arbeiten und von dort neu steigern. Schlaf und Essen prüfen.`}; }
    return {kg, trend, text:`Gewicht halten: ${fmtNum(kg,2)} kg${tot(kg)}. Ziel heute: ${reps} Wdh.`};
  }
  if(it.ex==='pushup'){ const mx=Math.max(...last.sets.map(x=>+x.reps||0)); return {kg:'',trend,text:mx>=20?'Ab 20 Wdh.: Rucksack mit Gewicht aufsetzen.':'Ziel heute: '+reps+' Wdh.',up:mx>=20}; }
  if(ex.unit==='sec'){ return {kg:'',trend,up:top(last),text:top(last)?`Obere Zeit geschafft: nächste Stufe (${EX[it.v?.ex]?.n||'5–10 s länger'}) oder 5 s mehr.`:'Ziel heute: 5 s länger halten als letztes Mal.'}; }
  return {kg:'', trend, up:top(last), text:top(last)?'Obere Zahl geschafft: schwerere Variante oder stärkeres Band.':'Ziel heute: '+reps+' Wdh.'};
}
function startTraining(type,slot){
  const key=todayKey(); let sess=workouts().find(w=>!w.finished && w.date===key && w.type===type);
  if(!sess){
    const s=prof().settings, deload=isDeload(key), id='w-'+Date.now();
    const sets={}, exmap={}, sugg={};
    WORKOUTS[type].items.forEach(raw=>{ const it=resolveItem(raw,s,key); const n=deload?Math.ceil(it.sets/2):it.sets; const sg=suggestion(it,id);
      exmap[raw.g]=it.ex; sets[raw.g]=[...Array(n)].map(()=>({kg:sg.kg===''?'':sg.kg,reps:'',done:false})); });
    sess={id,type,...(slot&&slot!==type?{slot}:{}),date:key,start:Date.now(),sets,exmap,warm:{},finished:false};
    Store.put(id,stripId(sess));
  }
  UI.session=sess.id; keepAwake(true); renderSession(true);
}
function stripId(o){ const {id,...rest}=o; return rest; }
function sessObj(){ return UI.session?{id:UI.session,...Store.get(UI.session)}:null; }
function saveSess(s){ Store.put(s.id,stripId(s)); }

  const order=['lh','sz','kh2','kh1','none']; if(s.plan&&!order.slice(0,4).some(k=>groups[k])) return '';
  return `<section class="card"><h3>Gewichte heute</h3><div class="list small" style="margin-top:4px">${order.filter(k=>groups[k]).map(k=>`<div class="li"><b style="min-width:120px">${k==='none'?'Ohne Umstecken':IMP_NAME[k]}</b><span class="grow">${esc(groups[k].join(' · '))}</span></div>`).join('')}</div><p class="small muted" style="margin-top:6px">${s.plan?'Gewichte nach Gerät sortiert, damit du planen kannst, was du wann umsteckst.':'Die Reihenfolge ist so gewählt, dass du kaum umstecken musst. Band- und Körpergewichtsübungen laufen im Wechsel mit den Hantelübungen.'}</p></section>`;

  const nov=$('#overlay .overlay'); if(nov && !top) nov.scrollTop=y;

function startRest(sec,label){ if(!sec) return; UI.rest={end:Date.now()+sec*1000,total:sec,label}; tickRest(); }

/* ============================== GEFÜHRTER ABLAUF ============================== */

function guideStep(){ const g=UI.guide; return g.steps[g.i]; }

  const c=$('#gclock'); if(c) c.textContent=mmss(left);
  const gc=$('#gcue'); if(gc){ const cu=cueNow(g,st); if(gc.textContent!==cu){ gc.textContent=cu; gc.parentNode.classList.remove('flash'); void gc.offsetWidth; gc.parentNode.classList.add('flash'); } }
  const ring=$('#gring'); if(ring){ ring.style.strokeDashoffset=String(691*(left/st.sec)); }
  if(st.kind==='box'){ const ph=Math.floor(((st.sec-left)%16)/4); const lab=['Einatmen','Halten','Ausatmen','Halten'][ph]; const b=$('#boxlab'); if(b&&b.textContent!==lab) b.textContent=lab; const sq=$('#boxdot'); if(sq){ const t=((st.sec-left)%16)/16; const p=boxPos(t); sq.setAttribute('cx',p[0]); sq.setAttribute('cy',p[1]); } }
}
function cueIdx(g,st){ const t=tipFor(st.ex); if(!t) return -1; const el=st.sec?Math.max(0,st.sec-g.remain):0; return Math.floor(el/9)%t.a.length; }

  $('#overlay').innerHTML=`<div class="overlay"><div class="player">
    <div class="ov-head"><button class="iconbtn" data-act="closeGuide" aria-label="Schließen">✕</button><div class="grow"><h2>${esc(g.title)}</h2><div class="small muted">Schritt ${g.i+1} von ${g.steps.length}</div></div></div>
    <div class="stage">

      ${st.sec?`<div class="clock" id="gclock">${mmss(g.remain)}</div>`:''}
      ${next?`<p class="small muted">Danach: ${esc(next.n)}${next.sec?' · '+mmss(next.sec):''}</p>`:'<p class="small muted">Letzter Schritt</p>'}
      ${ex&&tipFor(st.ex)?tipsHtml(st.ex,UI.tipsOpen):''}
    </div>
    <div class="controls">
      <button class="btn" data-act="gprev" ${g.i===0?'disabled':''}>Zurück</button>
      ${st.sec?`<button class="btn primary" data-act="gplay">${g.paused?(g.started?'Weiter':'Start'):'Pause'}</button>`:`<button class="btn primary" data-act="gnext">Weiter</button>`}

function finishGuide(completed){
  const g=UI.guide; UI.guide=null;
  if(completed){
    beep(784,.25,3);
    if(g.key==='warmup' && UI.session){ const s=sessObj(); WARMUP.forEach((_,i)=>s.warm[i]=true); saveSess(s); }
    else if(g.key){ const k=todayKey(), d=dayDoc(k); d.done[g.key]=true; saveDay(k,d); }
    if(g.onDone) g.onDone();
    toast(g.title+' erledigt');
  }
  if(!UI.session) keepAwake(false);
  renderGuide(); if(!UI.session) render();
}

const brMode=id=>BR.find(m=>m.id===id);

function brSaveCfg(patch){ const m=Store.get('mob')||{}, b=brCfg(); Store.put('mob',{...m,breath:{set:{...b.set,...(patch.set||{})},last:{...b.last,...(patch.last||{})}}}); }
function brChoice(m){ const l=brCfg().last[m.id]||{}; const v=Math.min(l.v||0,m.vars.length-1); return {v,len:m.lens.includes(l.len)?l.len:m.len}; }
function brEstimate(m,v,len){ if(m.whm) return len*(m.vars[v].b*3+75); return m.unit==='min'?len*60:len*brCyc(m.vars[v].pat); }
function brLenTxt(m,len){ return m.unit==='min'?len+' min':len+' '+(len===1?m.unit.replace(/n$/,''):m.unit); }

function brSuggest(){
  const h=new Date().getHours(), k=todayKey();
  const fresh=workouts().some(w=>w.date===k&&w.finished&&w.start&&Date.now()-w.start<3*36e5);
  if(fresh) return {id:'sigh',why:'Nach dem Training: schnell runterfahren und regenerieren.'};
  if(h>=5&&h<10) return {id:'whm',why:'Morgens zum Wachwerden, am besten vor dem Frühstück.'};
  if(h>=10&&h<17) return {id:'box',why:'Im Büro: kurz sammeln, dann konzentriert weiter.'};
  if(h>=17&&h<21) return {id:'coherent',why:'Feierabend: Stress abbauen, Puls und Atem in Takt bringen.'};
  return {id:'478',why:'Vor dem Schlafen: Puls senken und müde werden.'};
}

/* Ablauf */
function brSegs(m,v,len){
  const out=[]; let lv=.42;
  const push=(p,extra)=>{ const from=lv; let to=lv;
    if(p.k==='in') to=p.to||1; else if(p.k==='top') to=p.to||1; else if(p.k==='out') to=p.to||.42; else if(p.k==='prep') to=.42;
    out.push({...p,...(extra||{}),from,to}); lv=to; };
  push(BP('prep',m.whm?5:4,{h:m.whm?'Setz dich hin oder leg dich hin':'Bequem hinsetzen, Schultern locker'}));
  if(m.whm){ const B=m.vars[v].b;
    for(let r=0;r<len;r++){
      for(let b=0;b<B;b++){ push(BP('in',1.6,{to:.95,lab:'Tief ein',cnt:b+1,of:B,r,fast:1})); push(BP('out',1.4,{to:.55,lab:'Loslassen',cnt:b+1,of:B,r,fast:1})); }
      push(BP('out',2.5,{to:.34,lab:'Ausatmen',h:'Alles raus, dann halten',r}));
      push(BP('retain',null,{max:240,h:'Mit leerer Lunge entspannt halten. Wenn der Atemreiz kommt: tippen.',r}));
      push(BP('in',2.5,{to:1,lab:'Tief einatmen',r}));
      push(BP('hold',15,{lab:'Halten',h:'Volle Lunge, 15 s',r}));
      push(BP('out',3,{to:.5,lab:'Ausatmen',h:r<len-1?'Gleich beginnt die nächste Runde':'Loslassen',r}));
    }
    push(BP('free',45,{h:'Normal atmen und nachspüren'}));
    return out; }
  const pat=m.vars[v].pat, n=m.unit==='min'?Math.max(1,Math.round(len*60/brCyc(pat))):len;
  for(let c=0;c<n;c++) pat.forEach(p=>push(p,{c,of:n}));
  return out;
}
function brStart(id,v,len,key){
  const m=brMode(id); brSaveCfg({last:{[id]:{v,len}}});
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(_){}
  const segs=brSegs(m,v,len);
  UI.bp=null; UI.modal='breath';
  UI.br={id,v,len,key,segs,i:0,t0:performance.now(),paused:false,pauseAt:0,done:0,started:Date.now(),ret:[],end:false};
  keepAwake(true); renderBreath(); brCue(segs[0]); brLoop();
}
function brLoop(){ const b=UI.br; if(!b||b.end) return; brTick(); b.raf=requestAnimationFrame(brLoop); }
function brSeg(){ const b=UI.br; return b.segs[b.i]; }
function brElapsed(){ const b=UI.br; return ((b.paused?b.pauseAt:performance.now())-b.t0)/1000; }
function brAdvance(){
  const b=UI.br, s=brSeg(), el=brElapsed();
  if(s.k==='retain') b.ret.push(Math.round(el));
  b.done+=s.s==null?el:s.s; b.t0+=(s.s==null?el:s.s)*1000;
  b.i++;
  if(b.i>=b.segs.length){ brFinish(true); return false; }
  const n=brSeg(); if(n.k==='retain'||(s.k==='retain')||n.k==='free'||n.k==='prep'||s.k==='prep') renderBreath();
  brCue(n); return true;
}
function brTick(){
  const b=UI.br; if(!b||b.end) return;
  if(!b.paused){ let guard=0; while(guard++<200){ const s=brSeg(), el=brElapsed(), dur=s.s==null?s.max:s.s; if(el<dur) break; if(!brAdvance()) return; } }
  const s=brSeg(), el=Math.max(0,brElapsed()), dur=s.s==null?null:s.s, f=dur?Math.min(1,el/dur):0;
  const ease=x=>(1-Math.cos(Math.PI*x))/2;
  let lv=s.from+(s.to-s.from)*ease(f); if(s.k==='free') lv=.6+.18*Math.sin(el/5*Math.PI*2/1.6);
  const R=38+78*lv;
  const c=$('#brc'); if(c){ c.setAttribute('r',R.toFixed(1)); c.setAttribute('class','brcirc k-'+s.k+(s.hum?' hum':'')); }
  const ring=$('#brring'); if(ring){ ring.style.strokeDashoffset=String(754*(dur?1-f:0)); ring.setAttribute('class','brring k-'+s.k); }
  const lab=$('#brlab'), num=$('#brnum'), sub=$('#brsub');
  const L=s.lab||BR_KIND[s.k];
  if(lab&&lab.textContent!==L) lab.textContent=L;
  let N, S='';
  if(s.k==='retain'){ N=mmss(el); S='Runde '+(s.r+1); }
  else if(s.cnt){ N=String(s.cnt); S='von '+s.of; }
  else { N=String(Math.max(1,Math.ceil(dur-el))); S=''; }
  if(num&&num.textContent!==N) num.textContent=N; if(sub&&sub.textContent!==S) sub.textContent=S;
  const h=$('#brh'); if(h){ const H=s.h||''; if(h.textContent!==H) h.textContent=H; }
  const wv=$('#brwaves'); if(wv) wv.classList.toggle('on',!!s.hum&&!b.paused);
  const nose=$('#brnose'); if(nose){ const o=s.k==='hold'||s.k==='prep'?'':(s.open??''); nose.dataset.open=o; }
  const tot=$('#brtot'); if(tot){ const m=brMode(b.id), total=b.done+el;
    let T; if(m.whm){ T='Runde '+((s.r??0)+1)+' von '+b.len+' · '+mmss(total); }
    else { const all=b.segs.reduce((t,x)=>t+x.s,0); T='Noch '+mmss(all-total)+(s.of?' · Zyklus '+(s.c+1)+' von '+s.of:''); }
    if(tot.textContent!==T) tot.textContent=T; }
  const bar=$('#brprog'); if(bar){ const all=brMode(b.id).whm?null:b.segs.reduce((t,x)=>t+x.s,0); if(all) bar.style.width=Math.min(100,(b.done+el)/all*100)+'%'; }
}
function brTone(f1,f2,dur,vol){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t0=audioCtx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(f1,t0); o.frequency.linearRampToValueAtTime(f2,t0+dur); o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.12,t0+.08); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.05); }catch(e){}
}
function brCue(s){
  const set=brCfg().set; if(!s) return;
  if(set.tone){ const d=Math.min(1.2,Math.max(.25,(s.s||1)*.6));
    if(s.fast){ if(s.k==='in') brTone(392,523,.3,.06); }
    else if(s.k==='in'||s.k==='top') brTone(s.k==='top'?523:392,s.k==='top'?660:587,s.k==='top'?.4:d);
    else if(s.k==='out') brTone(587,392,d,.1);
    else if(s.k==='hold'||s.k==='rest'||s.k==='retain') brTone(494,494,.25,.08);
    else if(s.k==='free') brTone(523,784,.8,.1); }
  if(set.vib&&!s.fast){ try{ navigator.vibrate&&navigator.vibrate(s.k==='in'?60:s.k==='out'?[30,60,30]:25); }catch(e){} }
  if(set.voice&&!s.fast&&s.k!=='prep'&&window.speechSynthesis){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(s.lab||BR_KIND[s.k]); u.lang='de-DE'; u.rate=.95; u.volume=.8; speechSynthesis.speak(u); }catch(e){} }
}
function brNose(){ return `<svg id="brnose" class="brnose" viewBox="0 0 120 64" aria-hidden="true" data-open=""><path d="M60 4c-6 18-14 30-24 38-8 6-10 16 2 18h44c12-2 10-12 2-18C74 34 66 22 60 4z" fill="none" stroke="var(--line)" stroke-width="3"/><ellipse class="nl" cx="48" cy="52" rx="8" ry="5"/><ellipse class="nr" cx="72" cy="52" rx="8" ry="5"/><text x="20" y="58" class="nlt">L</text><text x="96" y="58" class="nrt">R</text></svg>`; }
function renderBreath(){

function brFinish(completed){
  const b=UI.br; if(!b) return; const el=b.paused?b.pauseAt:performance.now();

  try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
  b.end=true; b.sec=sec; b.completed=completed;
  if(sec>=30){ const k=todayKey(), d=dayDoc(k); d.breath=[...(d.breath||[]),{m:b.id,v:b.v,sec,at:Date.now(),...(b.ret.length?{ret:b.ret}:{})}];

}

    case 'ghoff': GitSync.setCfg(null); GitSync.last=null; GitSync.err=''; toast('GitHub getrennt, Daten bleiben auf dem Gerät'); openSettings(); render(); break;
    case 'closeModal': UI.modal=null; $('#overlay').innerHTML=''; render(); break;

    case 'resume': UI.session=t.dataset.id; keepAwake(true); renderSession(true); break;
    case 'tplpick': openTplPick(t.dataset.slot); break;
    case 'tplgo': startTemplate(t.dataset.id, UI.modal==='tplpick'&&UI.tp?UI.tp.slot:null); break;
    case 'tplcls': if(UI.modal==='tplpick'){ UI.tp.cls=t.dataset.c; renderTplPick(); } else { UI.tplCls=t.dataset.c; render(); } break;
    case 'tplmanage': UI.modal=null; UI.tp=null; $('#overlay').innerHTML=''; UI.tab='tpl'; render(); window.scrollTo(0,0); break;
    case 'tplhidden': UI.tplHidden=!UI.tplHidden; render(); break;
    case 'tplhide': { const p=prof(), h=p.settings.hideTpl||[], id=t.dataset.id; p.settings.hideTpl=h.includes(id)?h.filter(x=>x!==id):[...h,id]; saveProf(p); render(); toast(h.includes(id)?'Wieder sichtbar':'Ausgeblendet. Über „Ausgeblendete zeigen“ holst du es zurück.'); break; }
    case 'tpldel': if(t.dataset.sure){ Store.del(t.dataset.id); render(); toast('Workout gelöscht'); } else { t.dataset.sure='1'; t.textContent='Wirklich löschen?'; t.style.color='var(--warn)'; } break;
    case 'tednew': tedOpen(null); break;
    case 'tededit': tedOpen(t.dataset.id); break;
    case 'tedcopy': tedOpen(t.dataset.id,true); break;
    case 'tedcancel': UI.ted=null; UI.modal=null; $('#overlay').innerHTML=''; render(); break;
    case 'tedsave': tedSave(); break;
    case 'teddel': if(t.dataset.sure){ Store.del(UI.ted.id); UI.ted=null; UI.modal=null; $('#overlay').innerHTML=''; render(); toast('Workout gelöscht'); } else { t.dataset.sure='1'; t.textContent='Wirklich löschen? Nochmal tippen'; t.style.color='var(--warn)'; } break;
    case 'tedmode': UI.ted.d.mode=t.dataset.m; renderTed(); break;
    case 'tedpick': UI.ted.pick=true; UI.ted.added=0; renderTed(true); break;
    case 'tedback': UI.ted.pick=false; renderTed(true); break;
    case 'tedadd': { const T=UI.ted; T.d.items.push(defItem(t.dataset.k)); T.added++; renderTedPick(); toast(EX[t.dataset.k].n+' hinzugefügt'); break; }
    case 'tedmv': { const its=UI.ted.d.items, i=+t.dataset.i, j=i+(+t.dataset.d); if(j<0||j>=its.length) break; [its[i],its[j]]=[its[j],its[i]]; renderTed(); break; }
    case 'tedrm': UI.ted.d.items.splice(+t.dataset.i,1); renderTed(); break;
    case 'exmode': UI.exMode=t.dataset.m; render(); break;
    case 'libeq': case 'libcat': { const st=libState(t.dataset.ctx), f=a==='libeq'?'eq':'cat'; st[f]=st[f]===t.dataset.v?'':t.dataset.v; st.open=null; if(t.dataset.ctx==='ted') renderTedPick(); else render(); break; }
    case 'libopen': { const st=libState(t.dataset.ctx); st.open=st.open===t.dataset.k?null:t.dataset.k; libRefresh(t.dataset.ctx); break; }
    case 'seq': if(UI.modal==='mob'){ UI.modal=null; UI.mob=null; } startSeq(t.dataset.seq,t.dataset.key); break;
    case 'mobpick': openMobPick(t.dataset.key,+t.dataset.min||0); break;
    case 'mobzone': { const a=t.dataset.area||t.closest('[data-area]').dataset.area; UI.mob.areas[a]=((UI.mob.areas[a]||0)+1)%3; if(!UI.mob.areas[a]) delete UI.mob.areas[a]; renderPick(); break; }
    case 'mobfeel': UI.mob.feel=t.dataset.feel; renderMobPick(); break;
    case 'mobauto': { const r=regenInfo(); UI.mob.areas={...r.areas}; UI.mob.feel=r.feel; renderMobPick(); break; }
    case 'regengo': { const r=regenInfo(), plan=mobPlan(r); startSteps('Regeneration · '+(plan.short.length>2?plan.short.length+' Bereiche':plan.short.join(' + ')),plan.steps,t.dataset.key); break; }
    case 'regenedit': { const r=regenInfo(); UI.mob={areas:{...r.areas},feel:r.feel,min:r.min,key:t.dataset.key}; UI.modal='mob'; renderMobPick(); break; }
    case 'regenmin': { const m=Store.get('mob')||{}; Store.put('mob',{...m,regenMin:+t.dataset.min}); render(); break; }
    case 'mobmin': UI.mob.min=+t.dataset.min; renderMobPick(); break;
    case 'yogapick': openYogaPick(t.dataset.key); break;
    case 'yogastyle': UI.mob.style=t.dataset.v; renderYogaPick(); break;
    case 'yogaint': UI.mob.int=+t.dataset.v; renderYogaPick(); break;
    case 'yogamin': UI.mob.min=+t.dataset.v; renderYogaPick(); break;
    case 'yogago': { const m=UI.mob, plan=yogaPlan(m); yogaSave(); UI.modal=null; UI.mob=null; startSteps(plan.title,plan.steps,m.key); break; }
    case 'mobgo': { const m=UI.mob, plan=mobPlan(m); mobSave(); UI.modal=null; UI.mob=null;
      startSteps('Mobility · '+(plan.short.length>2?plan.short.length+' Bereiche':plan.short.join(' + ')),plan.steps,m.key); break; }
    case 'brpick': if(UI.br){ UI.br=null; UI.modal=null; } openBreathPick(t.dataset.key); break;
    case 'brquick': { const m=brMode(t.dataset.id); if(m.whm) openBreathPick(null,m.id); else { const c=brChoice(m); brStart(m.id,c.v,c.len,null); } break; }
    case 'brgoal': UI.bp.goal=t.dataset.g; renderBreathPick(); break;
    case 'brsel': brSelInit(t.dataset.id); renderBreathPick(true); break;
    case 'brback': UI.bp.sel=null; renderBreathPick(true); break;
    case 'brvar': UI.bp.v=+t.dataset.i; renderBreathPick(); break;
    case 'brlen': UI.bp.len=+t.dataset.n; renderBreathPick(); break;
    case 'brok': UI.bp.ok=!UI.bp.ok; renderBreathPick(); break;
    case 'brset': { const k2=t.dataset.k, cur=brCfg().set; brSaveCfg({set:{[k2]:!cur[k2]}}); if(k2==='voice'&&!cur[k2]&&window.speechSynthesis){ try{ const u=new SpeechSynthesisUtterance('Ansage an'); u.lang='de-DE'; speechSynthesis.speak(u); }catch(_){} } if(UI.br) renderBreath(); else renderBreathPick(); break; }
    case 'brgo': { const P=UI.bp; brStart(P.sel,P.v,P.len,P.key); break; }
    case 'brplay': { const b=UI.br; if(b.paused){ b.t0+=performance.now()-b.pauseAt; b.paused=false; keepAwake(true); } else { b.pauseAt=performance.now(); b.paused=true; try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(_){} } renderBreath(); break; }
    case 'brnext': if(UI.br&&!UI.br.end) brAdvance(); break;
    case 'brstop': if(UI.br&&!UI.br.end) brFinish(false); break;
    case 'brclose': UI.br=null; UI.modal=null; $('#overlay').innerHTML=''; render(); break;
    case 'wk': UI.weekOffset+=+t.dataset.d; render(); break;
    case 'dayinfo': { const d=parseKey(t.dataset.key); if(t.dataset.key===k){ UI.tab='today'; render(); } else toast(DAYS[d.getDay()].name+': '+DAYS[d.getDay()].blocks.map(b=>b.t+' '+b.n).join(', ')); break; }
    case 'exf': UI.exFilter=t.dataset.f; render(); break;
    case 'wuimg': UI.wuBig=UI.wuBig===+t.dataset.i?null:+t.dataset.i; renderSession(); break;
    case 'quick': { const q=QUICK[+t.dataset.i], d=dayDoc(k); d.extra=[...(d.extra||[]),{n:q.n,kcal:q.kcal,p:q.p}]; saveDay(k,d); render(); toast(q.n+' eingetragen'); break; }
    case 'rmextra': { const d=dayDoc(k); d.extra.splice(+t.dataset.i,1); saveDay(k,d); render(); break; }
    case 'rmbw': { const p=prof(); p.bw=p.bw.filter(x=>x.d!==t.dataset.d); saveProf(p); render(); break; }
    case 'setdone': { const s=sessObj(), g=t.dataset.g, i=+t.dataset.i, x=s.sets[g][i];
      const card=t.closest('.set'); const reps=card.querySelector('[data-f="reps"]').value, kg=card.querySelector('[data-f="kg"]')?.value;
      x.reps=reps; if(kg!==undefined){ x.kg=kg; x.tot=totalKg(EX[s.exmap[g]],kg); }
      if(!x.done && x.reps===''){ const it=wdef(s).items.find(z=>z.g===g); const ii=itemFor(it,s.exmap[g]); x.reps=String(EX[ii.ex].unit==='carry'?ii.r[0]:ii.r[1]); }
      if(x.done===false){ for(let j=i+1;j<s.sets[g].length;j++){ const y=s.sets[g][j]; if(!y.done && y.kg===''){ y.kg=x.kg; y.tot=x.tot; } } }
      x.done=!x.done;
      if(x.done){ const its=wdef(s).items, it=its.find(z=>z.g===g), nx=it.rest<=20?its[its.indexOf(it)+1]:null; startRest(it.rest, nx?'Weiter mit '+nx.g+': '+EX[s.exmap[nx.g]].n:'Nächster Satz '+EX[s.exmap[g]].n); }
      saveSess(s); renderSession(); break; }
    case 'toggleBar': { const p=prof(); p.settings.bar=!p.settings.bar; saveProf(p);
      const s=sessObj(); wdef(s).items.forEach(raw=>{ if(raw.alt && !(s.sets[raw.g]||[]).some(x=>x.done)){ const it=resolveItem(raw,p.settings,s.date); s.exmap[raw.g]=it.ex; s.sets[raw.g]=[...Array(isDeload(s.date)?Math.ceil(it.sets/2):it.sets)].map(()=>({kg:'',reps:'',done:false})); } });
      saveSess(s); renderSession(); break; }
    case 'rest+': if(UI.rest){ UI.rest.end+=15000; UI.rest.total+=15; tickRest(); } break;
    case 'restskip': UI.rest=null; tickRest(); break;
    case 'closeSess': UI.session=null; UI.rest=null; tickRest(); keepAwake(false); $('#overlay').innerHTML=''; render(); toast('Einheit gespeichert, du kannst sie später fortsetzen'); break;
    case 'finish': { const s=sessObj(); s.finished=true; s.min=Math.round((Date.now()-s.start)/60000); saveSess(s); if(s.slot&&!WORKOUTS[s.slot]){ const d=dayDoc(s.date); d.done[s.slot]=true; saveDay(s.date,d); } UI.session=null; UI.rest=null; tickRest(); keepAwake(false); $('#overlay').innerHTML=''; render(); toast(wname(s)+' abgeschlossen'); beep(784,.25,3); break; }
    case 'discard': { if(t.dataset.sure){ Store.del(UI.session); UI.session=null; UI.rest=null; tickRest(); keepAwake(false); $('#overlay').innerHTML=''; render(); toast('Einheit verworfen'); } else { t.dataset.sure='1'; t.textContent='Wirklich verwerfen? Nochmal tippen'; t.style.color='var(--warn)'; } break; }
    case 'gplay': { const g=UI.guide; try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(_){}
      if(g.paused){ g.paused=false; g.started=true; g.end=Date.now()+g.remain*1000; } else { g.paused=true; g.remain=(g.end-Date.now())/1000; } renderGuide(); break; }
    case 'gnext': guideGo(UI.guide.i+1); break;
    case 'gprev': guideGo(UI.guide.i-1); break;
    case 'closeGuide': { const g=UI.guide; if(g && g.i>=g.steps.length-1 && g.started){ finishGuide(true); } else { UI.guide=null; if(!UI.session) keepAwake(false); renderGuide(); if(!UI.session) render(); } break; }
    case 'export': doExport(); break;
    case 'askwipe': $('#dangerzone').innerHTML='<span class="small" style="color:var(--warn)">Alle Trainings, Gewichte und Häkchen werden gelöscht.</span><button class="btn small" data-act="wipe" style="color:var(--warn)">Ja, alles löschen</button><button class="btn small ghost" data-act="settings">Abbrechen</button>'; break;
    case 'wipe': Object.keys(Store.cache).forEach(k=>Store.del(k)); toast('Alle Daten gelöscht'); openSettings(); break;
  }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.classList&&d.classList.contains('tips')&&d.closest('.stage')) UI.tipsOpen=d.open; },true);
document.addEventListener('change',e=>{
  const t=e.target, a=t.dataset.act, k=todayKey();
  if(a==='done'){ const d=dayDoc(k); d.done[t.dataset.key]=t.checked; saveDay(k,d); render(); }
  else if(a==='supp'){ const d=dayDoc(k); d.supps[t.dataset.k]=t.checked; saveDay(k,d); render(); }
  else if(a==='meal'){ const d=dayDoc(k), i=+t.dataset.i; d.meals=(d.meals||[]).filter(x=>x!==i); if(t.checked) d.meals.push(i); saveDay(k,d); render(); }
  else if(a==='sleep'||a==='steps'){ const d=dayDoc(k); d[a]=t.value===''?null:+t.value; saveDay(k,d); }
  else if(a==='warm'){ const s=sessObj(); s.warm[t.dataset.i]=t.checked; saveSess(s); renderSession(); }
  else if(a==='setv'){ const s=sessObj(), x=s.sets[t.dataset.g][+t.dataset.i]; x[t.dataset.f]=t.value; if(t.dataset.f==='kg') x.tot=totalKg(EX[s.exmap[t.dataset.g]],t.value); saveSess(s); }
  else if(a==='tedf'&&UI.ted){ const d=UI.ted.d, f=t.dataset.f;
    if(f==='cls'){ if(t.value==='__new'){ UI.ted.newCls=true; } else { d.cls=t.value; UI.ted.newCls=false; if(!d.items.length&&d.cls==='ausdauer') d.mode='timer'; } renderTed(); }
    else if(f==='warm'){ d.warm=t.checked; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(d)+' min'; } }
  else if(a==='tedi'&&UI.ted&&t.type==='checkbox'){ const it=UI.ted.d.items[+t.dataset.i]; it[t.dataset.f]=t.checked; if(t.dataset.f==='ss') renderTed(); else { const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(UI.ted.d)+' min'; } }
  else if(a==='import'){ const f=t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); const docs=data.docs||data; let n=0; for(const key in docs){ if(/^(profile|mob|d-|w-|t-)/.test(key)){ Store.put(key,docs[key]); n++; } } toast(n+' Einträge geladen'); openSettings(); }catch(err){ toast('Die Datei ist keine gültige Sicherung (JSON aus „Daten als Datei sichern“).'); } }; r.readAsText(f); }
});
document.addEventListener('input',e=>{
  const t=e.target, a=t.dataset.act;
  if(a==='libq'){ libState(t.dataset.ctx).q=t.value; libRefresh(t.dataset.ctx); return; }
  if(a==='tedf'&&UI.ted&&t.tagName==='INPUT'&&t.type!=='checkbox'){ const d=UI.ted.d, f=t.dataset.f; if(f==='clsNew'){ if(t.value.trim()) d.cls=t.value.trim(); } else if(['rounds','work','rest','rrest'].includes(f)) d[f]=t.value===''?'':+t.value; else d[f]=t.value; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(d)+' min'; return; }
  if(a==='tedi'&&UI.ted&&t.type!=='checkbox'){ const it=UI.ted.d.items[+t.dataset.i], f=t.dataset.f, v=t.value===''?'':+t.value; if(f==='lo') it.r[0]=v; else if(f==='hi') it.r[1]=v; else it[f]=v; const m=$('#tedmin'); if(m) m.textContent='ca. '+tplMin(UI.ted.d)+' min'; return; }
  if(t.dataset.act!=='setv'||t.dataset.f!=='kg'||!UI.session) return;
  const s=sessObj(), el=document.querySelector(`[data-tot="${t.dataset.g}-${t.dataset.i}"]`); if(el) el.textContent=totTxt(EX[s.exmap[t.dataset.g]],t.value);
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), k=todayKey();
  if(f.dataset.form==='extra'){ const d=dayDoc(k); d.extra=[...(d.extra||[]),{n:fd.get('n'),kcal:+fd.get('kcal')||0,p:+fd.get('p')||0}]; saveDay(k,d); render(); toast('Eingetragen'); }
  if(f.dataset.form==='bw'){ const p=prof(), d=fd.get('d'), kg=parseFloat(String(fd.get('kg')).replace(',','.')); if(!kg) return; p.bw=p.bw.filter(x=>x.d!==d); p.bw.push({d,kg}); saveProf(p); render(); toast('Gewicht gespeichert'); }
  if(f.dataset.form==='gh'){ const repo=String(fd.get('repo')||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/$/g,''), token=String(fd.get('token')||'').trim(), pass=String(fd.get('pass')||'');
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){ toast('Bitte Repository als Name/Repo und den Token eintragen'); return; }
    if(pass.length<8){ toast('Bitte ein Passwort mit mindestens 8 Zeichen wählen'); return; }
    if(!(window.crypto&&crypto.subtle)){ toast('Verschlüsselung geht nur über https, nicht in der Offline-Datei'); return; }
    GitSync.setCfg({repo,token,pass,branch:'daten'}); toast('Verbinde mit GitHub …'); GitSync.sync().then(()=>{ toast(GitSync.err?'GitHub: '+GitSync.err:'Mit GitHub abgeglichen'); if(UI.modal==='settings') openSettings(); }); return; }
  if(f.dataset.form==='settings'){ const p=prof(); const s=p.settings;
    s.start=mondayOf(parseKey(fd.get('start')||s.start)); s.kcal=+fd.get('kcal')||s.kcal; s.protein=+fd.get('protein')||s.protein; s.renegade=+fd.get('renegade')||1;
    ['plates','vary','bar','circuit45','iron','zinc'].forEach(x=>s[x]=fd.get(x)==='on'); ['barlh','barsz','barkh'].forEach(x=>{ const v=parseFloat(String(fd.get(x)).replace(',','.')); if(!isNaN(v)) s[x]=v; }); saveProf(p); UI.modal=null; $('#overlay').innerHTML=''; render(); toast('Einstellungen gespeichert'); }
});
async function doExport(){
  const json=JSON.stringify({app:'Hantelwoche',version:1,exported:new Date().toISOString(),docs:Store.cache},null,1);
  const name='hantelwoche-sicherung-'+todayKey()+'.json';
  try{ const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data:json}); toast('Sicherung gespeichert'); return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Sicherung heruntergeladen'); }
  catch(e){ toast('Speichern ist hier nicht möglich'); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && (UI.session||UI.guide||(UI.br&&!UI.br.end))){ wakeLock=null; keepAwake(true); } });

/* ============================== START ============================== */

if(!Store.get('profile')){ Store.cache.profile={settings:{...DEFAULT_SETTINGS},bw:[]}; Store.saveLocal(); Store.queue('profile'); } // ohne Zeitstempel, damit eine Online-Sicherung Vorrang hat
onData();
(function resume(){ const open=workouts().find(w=>!w.finished && w.date===todayKey()); if(open) toast('Offene Einheit von heute: auf „Fortsetzen“ tippen'); })();
Store.connect();
setTimeout(()=>GitSync.sync(),300);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') GitSync.sync(); });
